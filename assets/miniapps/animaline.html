<script type="application/aurai-resource" id="doc-0-0">{"key":"doc-0-0","title":"安宁列车 Animaline","access":"public","content":"# 安宁列车 Animaline\n\n玩家扮演一群拥有不同职业的动物，共同运营一列退役的二手绿皮火车。团队已经承包列车并完成基本整修，开局时列车正在正常运营：厨房能做饭、用餐间能接客、卧铺能住人，各项基本设施都能使用，只是设备老旧、装饰陈旧，翻新尚未完成。闲置空间可以在后续经营中利用，不要求玩家先修好整辆车才能开始游戏。\n\n角色此前不一定做过乘务工作，如今一起负责乘客服务、用餐间等设施的经营，以及旅途中的大小问题。角色保留原来的职业和专业本领，不统一改成乘务员职业。\n\n游戏以轻量跑团和自由发挥为基础：解谜是需要逐步解决的大问题，小游戏处理眼前的小问题，经营赚钱是持续可参与的支线。玩家可以商量先做生意、处理小麻烦还是推进主线；主持人补充场景细节并裁定临时办法。\n\n这份设定把**动物、职业、车厢、道具、事故**分别准备。首轮开放下文八种玩家动物，玩家可以选择相同动物；车厢文档列出的其他物种以后也可以加入可选角色。具体出现哪些乘客、他们知道什么，由当前事件或主持人决定。玩家的位置由场景安排，不受动物物种限制。\n\n"}</script>
<script type="application/aurai-resource" id="doc-0-1">{"key":"doc-0-1","title":"1. 开始与持续游玩","access":"public","content":"## 1. 开始与持续游玩\n\n每名玩家从首轮可选动物中选一种，再选一种职业，得到两个技能。主持人介绍团队和列车现状，并在开局给每人一件道具。开局不再演出接手列车或要求先选翻新目标，直接从已经运营的列车生活开始。\n\n第一次上岗从午餐时间开始：第一批订单送进厨房，玩家自行分工，通过普通服务熟悉玩法，再让第一件异常自然出现。开场到第一次停站的场景、分工、旅途推进与结算安排见[《安宁列车小游戏设计思路》](./安宁列车小游戏设计思路.md)中的主流程样例，具体小游戏规则另行设计。\n\n旅程没有最终抵站通关。列车大部分时间在行驶，也会正常停站或因事件停车；订单、小游戏和大事件各自可以完成，整体游戏持续进行，可以保存后下次继续。\n\n### 主流程\n\n群聊是实际游玩的入口。DM 在群里描述现场，玩家讨论、分工、选角色并提出行动；DM 审核自由办法，调用小程序后台保存已经发生的结果。小程序页面用于查看团队角色、订单、共享库存、资金、乘客、设施和事件公开进展，不通过点击阶段推进旅程。旅途指南保留为规则参考。\n\n群聊发送小程序后，创建人选择主持 AI 与参与成员，为每人绑定动物和职业。主持人也可以根据群聊中玩家的选择在营业开始前修改绑定。后台保存旅程状态，页面关闭后主持人仍可通过群聊调用；暂停与恢复不重置资金或物资。\n\n当前后台处理上下客与票款、订单及交付、实际采购与库存、路段补给、设施安装和维修。商人采购折扣、厨师同款出餐倍率和机械师维修耗材倍率由后台结算。其他动物技能、道具使用、掷骰与种植先由 DM 按规则裁定并记录，尚未实现自动处理，不把记录一条描述等同于实际扣除或发放物资。订单取消、改菜单、补票和退款按已协商的条件处理；已经完成的订单不能再次收钱。\n\n后台将幕后事实单独提供给主持人与创建人，玩家页面只展示已经公开的信息。DM 应先读取当前状态，再调用操作；钱物不足或行动条件不满足时，按返回的具体原因继续协商，不能只在群里宣称成功。小程序不把自由讨论强制变成按座次发言，也不采用狼人杀的昼夜或投票流程。\n\n1. **列车日常**：查看设施营业情况、乘客需求、小问题和当前大事件的进展，玩家商量要做什么。\n2. **进入短场景**：去营业、处理故障、与乘客交流、推进解谜，或主动提出自己的计划。\n3. **处理事情**：简单事情直接完成；适合操作的小问题进入小游戏；自由发挥由主持人结合动物、职业和现场裁定，有风险才判定。\n4. **立即记录结果**：完成订单就结算收入，处理问题就更新现场，解谜有进展就记录信息，不等整段旅程结束。\n5. **继续自由活动**：回到列车日常，也可以补货、翻新或休息。投入收入的时机由团队决定，翻新不是每次活动后的必经步骤。\n\n多人可以分工处理不同事情，也可以一起参与一个场景。主持人轮流切换短场景，让每个人都有参与机会，普通走路和重复准备可以略过。第一版同时只保留一个大事件，解决后留出正常经营和自由活动的空间，再引入下一件，不用连续事故催促玩家。\n\n停站时可以接送乘客、采购补货、接取站外委托或处理站外事件，之后继续运行。停站不结束游戏，也不是所有结算必须等待的节点。\n\n新乘客停站时上车，到目的站下车，开局已有乘客在车上。运行中的需求和事件来自在车乘客及其与货物、设施的互动；只要有乘客，就可以出现生意、小问题或大事件，不必等停站，也不要求每名乘客都触发事件。主持人依据现有乘客和实际情况展开内容，不在运行中凭空加入新乘客。\n\n主线事故可以按“发现异常 → 找线索和绕路 → 救援或临时修复 → 找到故障源并决定如何处理”推进。主线之间穿插玩家经营的服务和处理小问题的小游戏，不要求玩家一直调查。失败不应让重要线索消失；可以让玩家拿到线索，同时付出时间、位置或道具使用次数的代价。\n\n### 经营与小游戏\n\n用餐间等公共服务设施由玩家团队经营。经营收入用于补货、改善设施和开放新服务；新服务应带来新的可玩内容，而不只是数值加成或买道具。遇到设备故障、行李整理等小问题时，可以进入对应的短小游戏，结果影响当前服务或列车状况。\n\n乘客可以吃荤或吃素，饮食偏好不由动物物种限定。荤食采用普通鱼、水产与昆虫，蛋奶正常供应，不使用培养鱼肉。蔬菜等按具体品种入库，品种、用途与采购价见[食材表](./安宁列车食材.md)。厨房经营围绕有限预算、共享食材库存和乘客需求展开；小卖部也属于团队，内部调拨不花钱。缺少的食材可以外部采购，也可以由玩家提出获取办法，经主持人明确条件后实际行动，按结果入库。点餐与交付的详细设计见[《安宁列车小游戏设计思路》](./安宁列车小游戏设计思路.md)。\n\n经营和小游戏的具体流程尚待试玩。设计思路文档已给出首批订单、采购价格与设施投入的待试玩数值，不代表经营玩法已经实现。日常行动不累计分钟，到站与旅途变化由主持人按场景节奏推进并提前提醒；只有确实紧迫的特殊事件才使用事先说明的倒计时。下文保留现有动物、职业、道具和行动规则作为基础素材。\n\n### 场景中的回合与掷骰\n\n以下方格移动规则保留为需要地图、路线和协作的具体场景玩法，不作为列车日常的强制全局回合。自由活动先确定要做的事，再进入对应场景。\n\n- 使用方格地图的场景中，轮到玩家时先掷一枚 D6，点数是本回合的**移动上限**；可以少走或不走。普通格消耗 1 点移动，难走格消耗 2 点；墙和固定障碍不能穿过。格子效果按地图结算。\n- 移动之外，每回合可做 **1 件事**：使用道具、调查、操作设施或使用主动技能。顺手拿起、放下或递出 1 件道具不占这次行动。六名玩家行动后，主持人推进乘客与事故。\n- 没有风险的合理行动直接成功；结果不确定、时间紧迫或有危险时，再掷一枚 D6 判定这件事。移动骰只决定步数，不按成败表判定。\n- 行动判定的自然 1：失败，并出现一个后果。2：失败。3：有代价的进展。4—5：成功。自然 6：成功，并得到额外好处。\n- 明确写了改骰或重掷的技能、道具才改变判定结果。玩家先描述想怎么做，主持人判断是否需要掷骰；成功后的具体场面按做法和骰点裁定。\n- 主动使用技能占这一件事；若技能只是在一次判定或道具使用中发挥作用，不额外占用。\n- 技能可以反复使用；道具按表扣除使用次数。\n\n"}</script>
<script type="application/aurai-resource" id="doc-0-2">{"key":"doc-0-2","title":"2. 玩家角色","access":"public","content":"## 2. 玩家角色\n\n每名角色起始有**一个动物技能和一个职业技能**。动物技能体现物种自带的通用本领，不要求特定职业；职业技能明确改变产出、采购成本、资源消耗或判定结果。任何角色仍可尝试普通的做饭、采购、修理等行动，但描述专业做法不自动获得职业表中的额外效果。技能不采用每局次数限制。\n\n### 动物技能\n\n首轮可选仓鼠、猴子、浣熊、鹦鹉、山羊、猎豹、猫、水豚。各自的技能效果见[《安宁列车 TRPG 动物》](./安宁列车TRPG动物.md)。\n\n### 职业技能\n\n首轮职业为厨师、商人、机械师、园艺师、服务员和桌游 DM，专业技能见[《安宁列车 TRPG 职业》](./安宁列车TRPG职业.md)。选职业时只获得该职业的一个技能；职业不限制可选动物或起始车厢。\n\n"}</script>
<script type="application/aurai-resource" id="doc-0-3">{"key":"doc-0-3","title":"3. 背包与道具","access":"public","content":"## 3. 背包与道具\n\n每人的背包空间为 3，通常可带 **3 件道具**，每件通常占 1 位。道具可以带到任意车厢。\n\n转交道具时，持有者在自己的回合移动到队友的相邻格，把 1 件道具递给愿意接收、背包有足够空间的队友。递出属于本回合那次不占行动的顺手操作，接收也不占队友的行动；若背包已满，须先腾出空间。\n\n开局主持人给每名玩家 1 件道具；之后完成救援、解开支线或帮助乘客，可能获得道具。道具表中的“数量”是整局最多能发出多少件，“次数”是每件能用多少次。道具描述只写核心效果；其他用法由玩家提出，DM 裁定。\n\n首轮道具的具体占位、次数和效果见[《安宁列车 TRPG 道具》](./安宁列车TRPG道具.md)。\n\n### 搜索获得道具\n\n可以搜索的杂物堆、废弃箱子或旧储物柜，在准备场景时就确定基础概率和可能找到的道具。主持人根据现场描述物资的丰富程度，不在玩家搜索后临时改变概率。以下是待试玩的起始数值：\n\n| 地点情况 | 基础概率 | 浣熊翻找（×1.5） |\n| --- | --- | --- |\n| 东西少，或此前已被别人翻找过 | 20% | 30% |\n| 普通杂物堆、废弃箱子 | 40% | 60% |\n| 有不少可用物资的旧储物柜 | 60% | 90% |\n\n玩家选择搜索后，由程序按对应概率结算；成功获得 1 件预先确定的候选道具，失败则没有找到可用道具。搜索在回合场景中占一次行动。同一处只结算一次，全队共享搜索记录，换人或重复搜索不能再次抽取；后来实际补入物资才可以重新准备搜索内容。搜索发放的道具计入道具表的全局数量，准备候选道具时预留其数量。\n\n明确摆在现场的道具和剧情必需的线索按实际行动获取，不使用随机搜索概率。浣熊技能只将搜索概率乘以 1.5，不增加 50 个百分点，也不影响任务奖励、购买或队友转交。\n\n"}</script>
<script type="application/aurai-resource" id="doc-0-4">{"key":"doc-0-4","title":"4. 车厢","access":"public","content":"## 4. 车厢\n\n列车有冻原、沙漠、热带雨林、湿地、温带草原、洞穴、厨房与仓储车厢、火山地带八节车厢。详见[《安宁列车 TRPG 车厢》](./安宁列车TRPG车厢.md)。\n\n"}</script>
<script type="application/aurai-resource" id="doc-0-5">{"key":"doc-0-5","title":"5. 准备一场事故","access":"public","content":"## 5. 准备一场事故\n\n主持人至少写清：\n\n1. **起因**：哪项设施先出了问题，是否有人误操作或隐瞒。\n2. **影响**：哪些车厢受波及，每过一段时间会发生什么变化。\n3. **线索**：至少从乘客、现场、设备三个方向各留一条可得到的线索。\n4. **眼前目标**：哪些乘客受困，哪条路被堵，哪项设施需要临时维持。\n5. **处理办法**：预想至少两条可行路线，也接受玩家用技能和道具拼出的新办法。\n6. **结局**：修好、暂时稳定或安全撤离各会留下什么结果。\n\n第一件大事件使用[《风雪中的接驳列车》](./安宁列车大事件-风雪中的接驳列车.md)：正常旅途中突然遭遇风雪，沿途接送滞留乘客，安排供餐、供暖与空间，核实失联站和物资去向，最后交接到安全枢纽。开局没有暴风雪预告，不计算日常分钟账，玩家逐步了解实际情况。另有[《迷路的雨水》](./安宁列车TRPG首局剧本-迷路的雨水.md)作为独立地图事故试玩，含四节车厢、救援与事故时间表；该剧本的轮数和后续火山事故不自动套入经营开局。开局不必一次把所有车厢都写成完整剧本。\n\n"}</script>
<script type="application/aurai-resource" id="doc-0-6">{"key":"doc-0-6","title":"6. 留到后续的东西","access":"public","content":"## 6. 留到后续的东西\n\n- **兴趣技能**：先用“动物＋职业”试玩；若两个技能不够，再把兴趣作为第三个可选技能。\n- **电鳗与电力机制**：等设备供电、耗电、断电有了可玩的规则，再设计电鳗技能，并检查电控相关技能是否匹配。\n- **更多可选动物**：车厢中尚未开放的物种及开放原则见[动物文档](./安宁列车TRPG动物.md)。\n- **体型与占格**：首轮不使用。若格子移动确实好玩，再试大型动物占相邻 2 格、过窄门需要额外行动。\n- **试玩观察**：看 3 件道具上限是否带来有趣选择，主持人送道具的节奏是否合适；看哪些动物或职业技能经常被主动使用，哪些始终没有机会出场。\n"}</script>

<script type="application/aurai-resource" id="doc-1-0">{"key":"doc-1-0","title":"安宁列车：小游戏设计思路","access":"public","content":"# 安宁列车：小游戏设计思路\n\n> 主流程与开局背景已确定；厨房已有首轮经营样例与待试玩数值，第一件大事件为“风雪中的接驳列车”，具体小游戏待设计。此前的 TRPG 文档保留为动物、职业、道具和车厢的素材，不直接视作小游戏规则。\n\n"}</script>
<script type="application/aurai-resource" id="doc-1-1">{"key":"doc-1-1","title":"一句话","access":"public","content":"## 一句话\n\n一群拥有不同职业的动物共同运营一列已投入使用、尚未彻底翻新的二手绿皮火车，经营用餐间等服务设施、处理日常小问题，并合作解决旅途中的谜题。\n\n"}</script>
<script type="application/aurai-resource" id="doc-1-2">{"key":"doc-1-2","title":"开局背景","access":"public","content":"## 开局背景\n\n列车已经退役，由团队承包并完成基本整修。厨房、用餐间、卧铺等基本设施齐全且能使用，只是设备和装饰老旧，还有待翻新。玩家保留各自原来的职业，现在兼任列车服务与经营工作；不需要从零搭建设施，也不需要先选择翻新目标。\n\n开场时列车已经在行驶，正值午餐时间。第一批订单送进厨房，玩家开始分工，通过日常服务熟悉玩法，之后第一件异常自然出现。首批订单见下文经营样例。\n\n"}</script>
<script type="application/aurai-resource" id="doc-1-3">{"key":"doc-1-3","title":"持续游玩的三条活动线","access":"public","content":"## 持续游玩的三条活动线\n\n- **解谜主线**：列车上的大问题需要讨论、调查和自由行动，逐步查明原因并决定处理方式。\n- **小游戏**：整理行李、处理设备或准备餐食等小问题，用短小游戏提供直接反馈。具体小游戏及结果如何影响旅途，逐项设计。\n- **经营支线**：玩家经营用餐间等设施，通过服务乘客获得收入。钱用于补货、改善设施和开放新服务；投入应增加可做的事情，而非只提高收益数字。\n\n三条活动线共同填充旅途，玩家可以选择当前投入哪一件事。小问题可以影响经营，例如设备坏了会暂停一项服务；解决后恢复营业。经营可以让玩家接触主线人物，但普通订单不必都暗藏线索。个人目标与称号留作后续可选内容，先不作为填充过程的核心。\n\n"}</script>
<script type="application/aurai-resource" id="doc-1-4">{"key":"doc-1-4","title":"反复进行的玩法","access":"public","content":"## 反复进行的玩法\n\n1. **选择当前活动**：查看设施营业情况、乘客需求、小问题和当前大事件进展，玩家商量先做什么，也可以主动提出计划。\n2. **进入短场景**：玩家去营业、处理故障、交谈或推进解谜，可以分工，也可以合作。动物特色、原职业和道具提供不同办法。\n3. **处理事情**：简单事情直接完成；适合操作的部分玩小游戏；临时办法由主持人裁定，有风险才判定。普通走路和重复准备可以略过，方格移动仅用于需要地图的具体场景。\n4. **得到结果**：订单交付就收钱，小问题解决就更新现场，主线有进展就记录信息。每件事单独结算。\n5. **回到列车日常**：继续选择事情，也可以补货、翻新或休息。翻新开放新服务和玩法，由团队自行决定投入时机，不是每次活动后的必经阶段。\n\n多人分头行动时，主持人轮流切换短场景，让每个人都有参与机会；需要合作时再会合。第一版同时只放一个大事件，完成后留出日常经营空间，再引入下一件。大事件有结局，整趟旅程没有最终通关终点。\n\n公共事故不能只是一处“到场按一下就修好”的点。每张事故卡至少要写清**现场变化、玩家需要作出的选择、几种合理处理途径，以及处理后的持续影响**。道具和技能提供新办法或更好的结果；不作为唯一的通关钥匙。主持人可负责叙述和裁定玩家提出的剧本外办法，卡片本身要足以结算常规玩法。\n\n"}</script>
<script type="application/aurai-resource" id="doc-1-5">{"key":"doc-1-5","title":"一趟列车如何变化","access":"public","content":"## 一趟列车如何变化\n\n列车大部分时间持续行驶，也会正常停站或因事件停车。停站开放补货、乘客上下车、站外委托和事件，之后继续运行；停站不代表结束，也不要求等停站才结算。\n\n### 乘客与事件从哪里来\n\n新乘客在停站时上车，到自己的目的站下车；开局已经有乘客在车上。运行中出现的新需求来自现有乘客，不为了触发内容凭空加入新乘客。\n\n只要车上有乘客，就可以在旅途中出现点餐、购物、求助、小游戏相关的小问题或大事件。停站负责改变车上的乘客组成，事件不必等到站才出现，也不规定每上一位乘客必须触发一次事件。乘客可以正常乘车、反复使用服务，也可以与其他乘客、货物或设施产生新的情况。\n\n事件根据现有乘客的需求、携带物品、相互关系以及实际发生的事情展开。主持人补充合理细节，不为了玩家眼前缺什么，就直接安排持有该物品的新乘客在运行中出现。基础乘客信息和已发生的事实持续记录，离站后仍可与在车乘客互动。\n\n### 一位乘客需要记录什么\n\n每位乘客保留一份简短资料。同行者可以共用一张资料卡，单独注明各自的饮食要求；不要求主持人为每个人写完整背景故事。\n\n| 信息 | 记录方式 | 用途 |\n| --- | --- | --- |\n| 称呼与动物 | 一个名字或称呼、一种动物；同行者列在一起。 | 让玩家能认出、找到同一位乘客。 |\n| 上下车站 | 已在车上或本站上车，以及目的站。 | 决定谁仍在车上、谁到站离开；站名明确后不临时更换。 |\n| 饮食要求 | 不能吃什么、已知偏好；没有特别要求就不展开。 | 产生订单和菜单选择，不按物种自动限制。 |\n| 随身或托运物品 | 一两件值得互动的物品；普通行李不逐件列清单。 | 支持购物、交换、搬运、小游戏与事件。物品属于乘客，不自动变成玩家库存。 |\n| 当前需求 | 眼前想吃什么、需要什么服务；谈妥后记录餐费或服务费。 | 提供玩家现在能接的事情，不记录乘客全部财产。 |\n| 已发生的事 | 已接订单、交付结果、物品变化、已经获知的事实。 | 让后续互动延续实际结果，避免重复发同一份奖励。 |\n\n人物性格、聊天内容和普通生活细节由主持人补充；只有会影响订单、物品归属或事件判断的内容才记下来。人物关系和事件线索有需要再补，不给每位乘客强制安排秘密、支线或好感度。\n\n### 开局乘客：对应第一批订单\n\n首段站序为松岭站、溪桥站、港湾站，后续继续延伸。下面七位乘客在开场前已经上车，均不会在松岭站下车，保证约定等采购后交付的菌菇面有明确接收者。\n\n| 同行资料卡 | 动物与目的站 | 饮食要求与当前需求 | 携带物品 | 可以展开的互动 |\n| --- | --- | --- | --- | --- |\n| 小栗与阿斑 | 小栗是仓鼠，阿斑是野猫；溪桥站下车。 | 小栗吃素、接受蛋奶；两人要热乎管饱的午饭，共 18 元。 | 一个装旧书的旅行箱，另有装零食的小袋。 | 吃完饭可以继续购物或聊天；只有零食具体内容确认后才能商量交换，不默认正好补齐玩家缺的食材。 |\n| 芦苇、阿陶与青羽 | 芦苇是河狸，阿陶是山羊，青羽是鹦鹉；港湾站下车。 | 芦苇不吃肉和蛋奶；另两位各要一份鱼，三人不吃辣，共 36 元。 | 三件外观相似、分别属于各人的行李，已放在行李架上。 | 自由交谈时能说明如何辨认行李；若实际发生行李混放，可进入辨认与归还的小问题，不重新支付同一份餐费。 |\n| 松针与阿岚 | 松针是北极狐，阿岚是猴子；溪桥站下车。 | 两人要无肉菌菇汤面，普通版 24 元、当地山菌版 30 元，愿意等松岭站采购。 | 松针带着地方食物手册，阿岚带着相机。 | 手册可提供山菌产地与采购地点的信息，但不会凭阅读获得食材；可帮助玩家提出采购或其他获取方案。 |\n\n乘客不因点完一次餐就退场。只要尚未到目的站，他们仍可正常用餐、购物、求助和参与事件；新增需求按旅途情况出现，不在每轮强制生成。玩家也可以主动找他们聊天、商量服务或交换。\n\n风雪突然出现后，阿岚可以先注意到窗外变化并提醒队友；他只知道亲眼看见的情况，不知道天气会怎样发展。松岭站的接驳请求由站方提出，不能让乘客提前知道全线灾情。大事件发生时，原定溪桥下车的乘客到站后可商量留站或继续到港湾，实际安排另行记录。\n\n### 松岭站的新乘客示例\n\n这两位只在松岭站停靠时加入；上车后可以马上产生需求，也可以稍后再参与场景。开局已有乘客继续留在车上。\n\n| 乘客 | 动物与目的站 | 明确物品与初始需求 | 后续可以做什么 |\n| --- | --- | --- | --- |\n| 苔花 | 兔子；港湾站下车。 | 带着一箱已经加工包装的菌菇干货，要托运并保持干燥。箱子是她的商品，不是团队库存，也不是第三单所需的新鲜山菌。 | 团队商量放在哪处、怎样固定与防潮；若要购买干货，先谈品种、数量和价格，完成交易后再入库。 |\n| 阿响 | 乌鸦；溪桥站下车。 | 带着一只装乐器的硬箱，想先吃顿便宜的热饭。 | 玩家报价并谈好菜单后接单；他愿意讨论在用餐间表演，但是否表演、怎样合作要另谈，不自动变成免费员工。 |\n\n样例乘客携带的物品在上车时确定，不根据玩家当前缺什么临时替换。以后站点可以换成新的乘客、同行组合和物品，仍沿用这份简短资料格式。\n\n### 从乘客展开事件\n\n先看车上实际有谁、他们正在做什么，再选一个合理的起因：乘客提出需求、物品出了问题、乘客之间发生分歧，或乘客发现设施异常。主持人说明现场与眼前问题，玩家决定接不接、如何处理；不要求所有事情都变成调查。\n\n- 点餐和购买商品属于正常经营，按已约定的价格与实际消耗结算。\n- 整理、辨认行李等小问题，可以用短小游戏；规则未设计时仍可描述行动处理。\n- 大事件可以由乘客反映，或由沿途情况与站方求助展开，但关键事实必须事先明确，不随主持人临时想法改变。第一件大事件见[《风雪中的接驳列车》](./安宁列车大事件-风雪中的接驳列车.md)。\n- 额外收费服务须先报价并得到乘客同意；一般求助不自动发钱，道具与食材也不因为完成事件就随机出现。\n- 同一件事情处理后保留结果。新事件需要新的起因，不能把刚整理好的行李、交付过的订单重置后再做一遍。\n\n列车设施的状态、经营收入、翻新结果和未完成的事件持续保存。玩家退出后，下次接着玩。动物、职业、道具和车厢分别设计，可以自由组合；现场变化按已经发生的事实延续，不靠连续制造故障填满过程。\n\n重玩可以更换主线事件、服务需求、小问题和经营选择。主线事件要检查因果与可解决性，避免把无关事故随机拼在一起。已知谜底也不应让经营和小游戏失去玩法。\n\n"}</script>
<script type="application/aurai-resource" id="doc-1-6">{"key":"doc-1-6","title":"首个试玩版本要验证什么","access":"public","content":"## 首个试玩版本要验证什么\n\n先完成用餐间的一条经营流程：乘客提出需求，玩家分工准备与服务，必要时进入小游戏，交付后结算收入，并查看能开放新服务的设施投入。资金足够后由团队决定是否购买，不要求第一批订单后立即升级。同时放入一个小问题和一个主线事件，观察三条活动线能否自然切换。\n\n先确定每个环节玩家实际做什么、小游戏玩什么、设施投入会新增什么玩法，再试算收入、成本和升级价格。下文金额用于首轮试玩，尚未验证经营节奏；先不加入员工、贷款、复杂满意度等额外系统。试玩重点是多人是否都有事可做，小游戏能否反复玩，赚钱后的投入是否值得期待，以及主线会不会挤掉其余活动。\n\n厨房开局可用。经营的核心是用有限的预算和库存满足乘客，并为缺少的食材想办法。普通备菜与烹饪可以直接完成，不要求每做一道菜都玩小游戏。后续添置烤炉、冷藏设备等设施，可以开放新菜品、储存方式和服务。\n\n"}</script>
<script type="application/aurai-resource" id="doc-1-7">{"key":"doc-1-7","title":"开场到第一次停站的主流程","access":"public","content":"## 开场到第一次停站的主流程\n\n这一段从正在运行的列车开始，覆盖午餐营业、一个小问题、突然出现的风雪与松岭停站后的接驳请求。订单和问题各自结算，玩家可以分工或中途改变安排。首次停站不是通关点，暴风雪也没有开局预告。\n\n### 开场说明与场景推进\n\n主持人向玩家说明：“现在是午餐时间，列车正在行驶，下一站是出产山菌的松岭站。厨房和其他基本设施能用，列车由你们共同经营。共有资金 30 元，午餐订单已经送来；接什么、怎么分工由你们决定。”随后给出起始库存与前两张订单。\n\n列车持续运行，日常行动不计算分钟。主持人根据场景节奏推进旅途、引入异常和宣布到站；到站前提前提醒玩家有哪些补货与站外活动机会，不要求做完所有订单才能停站。\n\n玩家分头行动时，主持人轮流处理各组短场景，完成一件事就记录结果，再继续或切换。其他组的行动可以同时发生，无需相加或比较耗时。只有确实紧迫的特殊事件才使用提前说明的倒计时，本段日常经营不使用。\n\n### 场景安排\n\n| 时机 | 主持人提供的情况 | 玩家可以做什么 | 立即记录的结果 |\n| --- | --- | --- | --- |\n| 午餐开场 | 厨房收到热乎午饭与三人套餐两张订单，库存可支持样例菜单。 | 谈菜单、接单、分工、开始制作；也可以先查看列车。 | 已接订单、菜单、预留的食材。 |\n| 玩家开始准备后 | 第三位乘客询问地方菌菇面，愿意等到下一站采购后吃。 | 接普通版、承诺山菌版，或暂不接；商量采购与其他获取办法。 | 约定版本、餐费和交付安排。 |\n| 首次进入仓储区 | 上次补货留下的几只空箱挤在取货通道里，一只推车的固定带松了。 | 重新堆放并固定、借推车转移，或先绕行取货；可分出一人处理。 | 通道是否畅通、推车是否可用。 |\n| 普通活动已经展开后 | 风雪突然加重，前方站台发来求助；司机按当前条件减速，厨房仍能使用。 | 继续交付订单、查看漏风处、询问当前行车与站台情况。 | 已知天气变化和收到的信息，不推断完整灾情。 |\n| 主持人提前提醒后到站 | 松岭站道路中断，一批约 10—20 名乘客想买票前往港湾，站内有供暖；站方说明港湾与线路情况。 | 售票、上下客、采购、安排休息区域、接受乘客点餐。 | 已售车票、票款、订单、采购支出及乘客变化。 |\n| 停站场景收束、下一段获得通行确认后 | 列车继续行驶，原有乘客与接上的乘客共处。 | 交付菌菇面、供餐、布置临时空间、联络溪桥或继续营业。 | 资金、库存、安置和供暖状态、尚未完成的事项。 |\n\n表中的安排用于首段样例，处理过的问题保留结果。不能为了按表演出，仍让已经修好的设备再次失效，也不能因玩家讨论或主持人切换场景而惩罚性升级灾情。\n\n### 小问题怎样处理\n\n空箱与推车不锁住全部食材；玩家可以绕行拿到开局订单需要的东西。将空箱搬入空货架并重新固定推车是直接成功的常规解法。玩家也可以提出别的整理方案，主持人按现场判断。\n\n这一处预留给后续短小游戏：玩家选择移走哪些箱子、怎样留出取货通道。具体小游戏规则尚未设计，当前用描述行动即可走通流程。不能因为小游戏未实现，让这一段没有可执行的处理办法。处理后本段保持畅通，不循环制造相同的堵塞。\n\n### 第一件大事件：风雪中的接驳列车\n\n突然遭遇风雪后，沿途乘客希望买票搭车离开受影响地区。松岭约有 10—20 名滞留乘客，溪桥约有 20—30 名，团队按实际空间安排接待，将实际上车的乘客送到港湾；乘客自己点餐，团队按订单供餐。车厢只给接待范围，不逐座计数；售票与点餐时确定实际人数用于收款和食材结算。玩家逐步核实现场情况，不提前知道全线灾情或风雪结束时间。\n\n经营、小游戏与调查围绕同一趟接驳展开：决定怎样腾出休息空间、使用有限食材、处理保温问题，并查明溪桥失联情况和供暖物资去向。完整的事实、选择、样例票价与采购费用见[大事件文档](./安宁列车大事件-风雪中的接驳列车.md)。乘客买票和点餐，站方不代付餐费、预付接驳费或提供免费物资包。原有水循环故障保留在独立地图事故剧本中，不作为本次开局大事件。\n\n### 松岭站停靠期间\n\n首次停站提供经营样例中的采购表，以及烤炉的价格与安装说明。团队开局买不起烤炉，可以了解信息，之后资金足够再购买；本次不要求设施升级。\n\n- 站台商家按表出售食材，可以一次买多种；不要求逐件跑场景。\n- 玩家提出交换、采集或帮忙换食材时，主持人先说明地点、实际可得数量与风险。风雪已出现，野外采集不能照搬晴天条件；商家已有的库存照常按实际供应交易。能在本站完成的进入短场景；需要远行或留站的方案先说明安排与影响，不按分钟计算。\n- 本批点餐乘客继续乘车，因此菌菇面可以离站后交付。普通版与山菌版按先前约定或重新协商的结果结算。\n- 普通停站活动处理完后，主持人确认团队是否还有本站要做的事，再收束场景并宣布发车。远行或留站等特殊安排需要结合站方条件与后续行程另行商量。正常发车前确认外出队友已经返回；不能让角色因为主持人切换场景而莫名被丢在站外。\n- 根据当前空间与拥挤情况确定接待安排，记录实际售票人数、票款与订单，取得下一段线路的当时通行确认后离站；若不继续接客，仍可与站方商量停留或自己的后续行程。不是完成所有额外订单才允许发车。\n\n### 本段结束与保存\n\n第一次离站后，记录共有资金、库存、未交付订单、在车乘客、票款、安置与供暖状态、已知情况和玩家当前安排。风雪接驳继续到港湾下客，完成后留出正常营业空间。任何时候都可以保存退出，不要求完成整段才允许结束现实中的一次游玩。\n\n普通订单生成、公开采购、库存和收款交给程序按规则处理。主持人负责乘客的具体表达、场景细节、旅途与场景推进以及剧本外办法的条件与结果；不临时修改已确认的价格、库存或故障原因。\n\n"}</script>
<script type="application/aurai-resource" id="doc-1-8">{"key":"doc-1-8","title":"厨房：乘客吃什么","access":"public","content":"## 厨房：乘客吃什么\n\n### 食物与世界设定\n\n- 乘客可以吃荤、吃素或荤素搭配。动物物种不限定食性：兔子可以喜欢肉饭，狼也可以吃素。饮食偏好属于具体乘客。\n- 鱼、虾蟹贝和昆虫作为普通生物与食材，不使用培养鱼肉。蛋奶正常供应；本版荤食采用普通鱼、水产与昆虫，不加入培养肉。\n- 蔬菜、水果、谷物、菌菇、豆制品、蛋奶、鱼、水产与昆虫都可作为食材，具体品种、采购价、用途与来源见[食材表](./安宁列车食材.md)。稀有食材不天然更好，是否值得寻找取决于订单和玩家的方案。\n\n### 乘客怎样点餐\n\n多数乘客提出需求，玩家决定做什么；少数乘客明确点菜。每张订单只列出人数、总餐费、必须满足的要求和额外期待。只有确实赶时间的订单才有交付期限。\n\n**必须满足的要求**包括素食、不能吃的食材，以及事先说清的用餐条件。接单前明确，不能交付时突然追加。额外期待是可商量的偏好，例如喜欢酸甜、想尝当地特色、希望看起来像一顿生日餐。乘客愿意为额外服务付多少，也要提前谈好。\n\n| 订单方向 | 乘客可能说的话 | 玩家可以做的选择 |\n| --- | --- | --- |\n| 日常饱餐 | “两个人，想吃热乎的，能吃饱就行。” | 饭、面、炖菜都可；用现有食材搭配，决定是否值得补买肉类。 |\n| 素食餐 | “我吃素，不要肉和鱼，蛋奶可以。” | 豆腐、菌菇、蛋奶与蔬菜组合；严格不吃蛋奶的乘客另行说明。 |\n| 口味偏好 | “想吃点酸甜的，别太辣。” | 水果、番茄、醋等都可能实现；不强制使用唯一食材或菜谱。 |\n| 分享餐 | “我们四个一起吃，有一位不能吃奶，想点些能分着吃的。” | 全部不用奶，或分开做并说明；共享大盘与分份套餐都可。 |\n| 纪念餐 | “今天过生日，钱不多，想吃得特别一点。” | 正餐、甜品或水果都能提出方案；不默认必须做蛋糕，先与乘客确认。 |\n| 指定菜或风味 | “想吃一碗菌菇汤，最好有下一站的山菌。” | 普通菌菇可以完成基础需求；山菌是另议的期待，也可以提出乘客接受的替代。 |\n\n日常订单通常用库存就能完成，提供持续收入。特殊订单偶尔带来采购、交涉或寻找食材的机会；不能每单都要求外出，也不能所有订单都直接套用同一道菜。\n\n### 食材怎样记录与获取\n\n厨房和小卖部都属于玩家团队，使用同一份列车库存。内部调拨只转移用途，不付钱。食材按可制作的份数记录，不称克数；菜品由使用的食材和做法组成，记录一份菜实际消耗什么，不要求逐道解锁固定菜谱。\n\n| 食材类别 | 起步可用的例子 | 可以支持的选择 |\n| --- | --- | --- |\n| 主食 | 米、面条、面粉 | 饭、汤面、饼等；决定一餐如何管饱。 |\n| 蔬菜与豆制品 | 土豆、胡萝卜、白菜、番茄、菠菜、豆腐 | 配菜、炖菜、素食主菜；各品种分别入库。 |\n| 蛋奶 | 鸡蛋、牛奶、奶酪 | 蛋料理、奶汤、甜点；注意订单禁忌。 |\n| 鱼与水产 | 鲈鱼、鲫鱼、河虾、蛤蜊、鱿鱼 | 煎鱼、鱼汤、炒菜和馅料；各品种与来源不同。 |\n| 昆虫 | 食用蟋蟀、食用蝗虫、面包虫、蚕蛹、竹虫 | 烤串、脆口小食、炒饭配料与地方特色餐；是否接受由乘客决定。 |\n| 水果与菌菇 | 苹果、橙子、香菇、平菇、松茸 | 酸甜风味、果盘、菌菇汤；地方品种提供特殊订单内容。 |\n\n盐、油和常用基础调味料开局齐备，作为日常补货支出统一记录，不逐勺扣除。会决定订单能否完成的特殊调味料单独入库。\n\n食材有三类获取途径：停站向外部商家采购；与持有食材的乘客购买、交换或协商；玩家提出其他合理办法，例如采集或帮忙换取。普通采购直接按公开价格和供应量执行。\n\n自由获取按以下流程处理：\n\n1. 玩家讨论从哪里、用什么办法获得食材。\n2. 主持人说明办法是否可行、所需条件、成本或风险，以及可能获得的数量。审核通过表示可以尝试。\n3. 玩家实际行动；简单事情直接完成，需要交涉、操作或承担风险时进入相应场景。\n4. 主持人根据实际结果发放食材，加入共享库存，再决定如何用于订单。\n\n可以免费采集、交换或求助，不为了消耗钱强行收费。外部购买通常更可靠、更省事；自己设法获取可能节约资金，但需要行动并接受已经说明的风险。\n\n### 接单、交付与收入\n\n乘客提出需求后，团队可以直接接单，也可以先谈菜单、价格与替代食材。已接订单的总餐费是收入，采购支出由团队承担；玩家决定花多少成本完成它。尚未确认能否获得的食材，不应当作已经在库。\n\n菜单合理且满足双方确认的条件，常规制作后即可交付并收取约定餐费，不额外掷骰决定乘客是否喜欢。更换已约定的关键食材或菜品，要先与乘客沟通。额外期待只有提前约定了加价才增加收入，不临时随机发小费或新增满意度数值。\n\n钱流向外部食材采购、确有需要的站外服务和设施改善；厨房不能通过向自家小卖部买东西制造支出。收入进入团队共有资金，后续可投入烤炉、冷藏设备等，开放新的经营选择。首批订单与采购价格见下文试算。\n\n### 第一单示例\n\n两位乘客想吃热乎、管饱的午饭，其中一位吃素且接受蛋奶。库存有大米、白菜、胡萝卜、鸡蛋，鲈鱼已经用完。\n\n玩家可以提出两份蛋炒饭配白菜汤，确认后使用库存完成；也可以向持有鲈鱼的乘客商量购买，分别做鱼饭和素饭；还可以向乘客提出虫料理，确认愿意吃后再设法取得食材。三种办法都有明确条件和成本，不要求为了开局这一单专门找材料。\n\n之后再放入一张想尝地方菌菇的订单，让玩家选择普通菌菇替代、停站采购，或自行提出获取办法。先验证普通接单与自由获取食材都能顺畅完成，再细化价格和具体小游戏。\n\n"}</script>
<script type="application/aurai-resource" id="doc-1-9">{"key":"doc-1-9","title":"厨房首轮经营样例","access":"public","content":"## 厨房首轮经营样例\n\n以下金额统一使用“元”，是待试玩的游戏数值。初始资金和库存都是团队已经拥有的运营物资，不在每批订单开始时重置。第一批涉及七份饭，是用来走通流程的样例，不限定玩家人数。下文试算按普通产出与采购价计算；实际有厨师或商人负责时，再按[职业技能](./安宁列车TRPG职业.md)计算额外出餐或采购折扣。\n\n### 起始资金与库存\n\n团队共有资金 **30 元**。厨房已有炉灶和冷藏设备，可煮、炒、煎、炖；尚无烤炉。基础油盐和调味料充足，本批无需补充，以下试算只计算表内食材。\n\n“1 份食材”指一人份对应食材的用量。例如一份大米、一份鸡蛋、一份白菜，可以做一人份蛋炒饭配白菜汤；不是一道菜只能用一种食材。\n\n| 食材 | 起始库存（份） | 下一站单价（元／份） | 下一站供应量（份） |\n| --- | ---: | ---: | ---: |\n| 大米 | 6 | 1 | 12 |\n| 面条 | 4 | 2 | 8 |\n| 白菜 | 3 | 2 | 6 |\n| 胡萝卜 | 2 | 2 | 4 |\n| 番茄 | 1 | 2 | 4 |\n| 土豆 | 2 | 2 | 6 |\n| 鸡蛋 | 4 | 2 | 8 |\n| 豆腐 | 4 | 2 | 6 |\n| 香菇 | 2 | 3 | 4 |\n| 鲈鱼 | 2 | 5 | 4 |\n| 食用蟋蟀 | 2 | 2 | 6 |\n| 蚕蛹 | 0 | 4 | 4 |\n| 面粉 | 2 | 2 | 8 |\n| 苹果 | 2 | 3 | 8 |\n| 松茸 | 0 | 5 | 2 |\n\n上表是起始库存与松岭商家的具体供货，不是整世界的全部食材。白菜、胡萝卜、番茄等分别记录，菜单必须对应实际消耗；下文把“普通菌菇”具体落实为香菇，“当地山菌”落实为松茸。其他站点可从[完整食材表](./安宁列车食材.md)选择货品，但不会每站卖齐所有品种。新加入的备用食材不要求在首批订单里全部用完。\n\n### 第一批三张订单\n\n开局先送来前两张订单；玩家谈好菜单、开始准备后，再让第三位乘客来询问。后者愿意等到下一站采购后用餐，接单前说明，因此不用一边做饭一边被隐藏倒计时催促。\n\n| 订单 | 人数与约定餐费 | 必须满足 | 可讨论的部分 | 一种可行菜单及消耗 |\n| --- | --- | --- | --- | --- |\n| 热乎午饭 | 2 人，共 18 元 | 热食、管饱；一人吃素且接受蛋奶 | 不指定肉类，二人可以吃同样的饭 | 两份蛋炒饭配白菜汤：大米 2、鸡蛋 2、白菜 2。 |\n| 同行三人的套餐 | 3 人，共 36 元 | 一人吃素且不吃蛋奶；另两人各想要一份鱼；都不吃辣 | 分盘或共享都可以，菜单先确认 | 两份煎鲈鱼饭、一份豆腐饭配胡萝卜和白菜：大米 3、鲈鱼 2、豆腐 1、胡萝卜 2、白菜 1。 |\n| 地方菌菇面 | 2 人，香菇版共 24 元；松茸版共 30 元 | 两份热汤面，不放肉 | 松茸是额外期待；乘客明确接受香菇版，也接受等到下一站 | 面条 2、番茄 1、菌菇 2；香菇或松茸二选一。 |\n\n菜单只是可行例子。玩家可以提出其他做法，与乘客确认后记录实际食材消耗，不能仅改菜名就省掉已经答应的鱼或用餐份数。\n\n### 第三单怎样产生选择\n\n- **用普通菌菇**：现有库存即可交付，收 24 元；不用等待或另找食材。\n- **停站购买山菌**：花 10 元买两份，做地方版，收 30 元。多收的 6 元略低于两份菌菇的采购价差，因此不是必选的赚钱答案。\n- **提出其他获取办法**：例如向带着山菌的乘客交换，或在停站时提出寻找当地供应者、采集等办法。主持人先确定现场是否支持、成本、风险和可得数量，再实际行动。并非每个站点都允许采集，审核通过也不等于已经拿到食材。\n\n自由获取得到的食材正常入共享库存，玩家也可留给之后的订单。若尝试未得到山菌，可以重新与乘客确认普通版，不把原先可用的完成途径锁死。\n\n### 按购买山菌的路线算一遍\n\n1. 第一单交付收 18 元，第二单交付收 36 元：共有资金从 30 元变为 **84 元**。\n2. 停站购买山菌两份，支出 10 元：剩 **74 元**。\n3. 第三单交付收 30 元：共有资金为 **104 元**。\n4. 原有库存共消耗大米 5、面条 2、白菜 3、胡萝卜 2、番茄 1、鸡蛋 2、豆腐 1、鲈鱼 2。按采购表补回这些库存需 **37 元**；购买后共有资金为 **67 元**，原有库存恢复起始数量，松茸已用于订单。备用土豆、食用蟋蟀、面粉、苹果未消耗。\n\n本批收入 84 元，山菌采购与原有库存补货共支出 47 元，资金净增加 **37 元**。104 元只是补货前余额，不能当作这一批的利润。补货由玩家实际选择购买并扣款，不自动在结算时扣一笔费用。\n\n如果第三单用普通菌菇，则本批收入 78 元，补齐所有消耗的食材需 43 元，资金净增加 **35 元**。两条路线相差 2 元；特殊订单提供不同体验，不应总是比普通菜单划算。\n\n### 第一个设施投入：烤炉\n\n**烤炉与安装共 400 元**，向站外设备商购买，停站时安装。购买是团队可选投入，原有厨房不依赖它才能营业。\n\n烤炉开放烘焙与烤制：面包、饼干、烤蔬菜、烤鱼等，新增可明确要求烘焙食品的订单。已有煎鱼和普通饭菜照常可做，不给原有订单统一加价。\n\n一张新增订单的样例：“四人想买一盒无奶苹果小饼干带走，接受鸡蛋”，约定餐费 **40 元**。用面粉 4 份、鸡蛋 2 份、苹果 2 份；设备商所在站点同时售面粉 2 元／份、苹果 3 元／份，各 8 份。本单食材成本 **18 元**。基础调味供应包含烘焙用糖；烤炉属于正常可用设施，不逐次扣燃料点数。\n\n这类订单增加“堂食还是外带、是否值得接指定烘焙需求、如何备货”的选择。具体烘焙小游戏另行设计，先不为了购买设备强行增加操作步骤。\n\n只经营这类七人餐单，按每批净增加约 37 元估算，十批后共有资金约 400 元；此时全部花掉会没有采购现金，不宜直接买烤炉。实际旅程还会有车票收入，设备投入节奏应看整段经营结果，不能只拿餐费推算。订单换人数、需求、库存和供应，不要求重复相同餐单攒钱。\n\n### 票款、运行支出与设施投入的比例\n\n车票承担列车经营的主要收入，餐饮是额外利润与自由发挥的来源。食材价格、餐费和开局 30 元现金保持上表数值；牵引燃料按已知路段向站外供应商购买，不给每位乘客扣一遍成本，也不计算分钟或燃料点数。下一段费用在售票和采购前公开，允许先收本站票款再补给。\n\n风雪样例中，开局燃料已够到松岭；松岭至溪桥、溪桥至港湾各需补给 60 元，共 120 元。站内供应足够，付费补给后该段正常行驶，普通厨房烹饪不另扣燃料费。先前已支付的路段费用不重复计算，也不在事件结束时凭空扣一次运行费。其他旅程在开始时给出对应路段报价，不能把本例的 120 元套在每次停站或每张餐单上。\n\n| 投入 | 试玩价格 | 实际得到什么 |\n| --- | ---: | --- |\n| 约十人用的临时垫子与毯子一批 | 60 元 | 可重复使用的休息用品；在用餐间布置时暂停堂食。 |\n| 隔帘一套 | 40 元 | 分隔已有区域，不能凭空增加空间。 |\n| 备用供暖组件一套 | 100 元 | 配合封窗，使草原临时休息区适合住宿。 |\n| 烤炉与安装 | 400 元 | 开放烘焙与烤制菜单，原有厨房仍正常使用。 |\n| 草原车厢局部卧铺翻新与安装 | 800 元 | 在既有空间内固定一块约十人的卧铺区，包含寝具、隔断及保温供暖；公共活动区相应缩小，用餐间继续营业，不再为这块区域每次临时搬家具。 |\n\n临时草原方案合计 200 元，永久卧铺方案是另一次可选施工，不要求先买临时套装。已有用品可继续用于其他实际区域；设备商是否收购或利用旧用品，先谈清报价，不默认全额折抵。永久改装仍使用既有空间，全车接待范围沿用车厢文档，不能把临时与永久安排的同一块空间重复算两遍。\n\n首轮目标是：完成一次较忙的大事件后，通常能负担临时布置并积累一部分翻新款；节省投入、接客更多时也可能买一件设备，但不应同时买齐主要改善项目。设备与用品永久保留，下次使用不再买一次。数值先按此比例试玩，实际自由获取、职业效果及额外生意都会改变结果。\n"}</script>
<script type="application/aurai-resource" id="doc-1">{"key":"doc-1","title":"主流程与经营","access":"public","sections":[{"key":"doc-1-0","title":"安宁列车：小游戏设计思路"},{"key":"doc-1-1","title":"一句话"},{"key":"doc-1-2","title":"开局背景"},{"key":"doc-1-3","title":"持续游玩的三条活动线"},{"key":"doc-1-4","title":"反复进行的玩法"},{"key":"doc-1-5","title":"一趟列车如何变化"},{"key":"doc-1-6","title":"首个试玩版本要验证什么"},{"key":"doc-1-7","title":"开场到第一次停站的主流程"},{"key":"doc-1-8","title":"厨房：乘客吃什么"},{"key":"doc-1-9","title":"厨房首轮经营样例"}]}</script>
<script type="application/aurai-resource" id="doc-2-0">{"key":"doc-2-0","title":"安宁列车 TRPG 动物","access":"public","content":"# 安宁列车 TRPG 动物\n\n首轮开放八种玩家动物。每名角色选一种动物，获得对应的一个动物技能；还会另选一种职业。动物技能体现物种自带的通用本领，不绑定职业或起始车厢。角色创建和掷骰规则见[主设定](./安宁列车TRPG设定.md)。\n\n技能只写效果。具体怎么用、现场是否说得通，由玩家描述，DM 裁定。\n\n| 动物 | 技能 | 效果 |\n| --- | --- | --- |\n| 仓鼠 | 颊囊 | 可以额外携带 1 件空间为1的道具。 |\n| 猴子 | 灵巧双手 | 一次行动可以连续使用 2 件道具，分别结算效果并扣除使用次数。 |\n| 浣熊 | 翻找 | 搜索时获得道具的概率乘以 1.5，最高为 100%；不影响任务奖励、购买或队友转交。 |\n| 鹦鹉 | 学舌 | 学会同车厢队友使用过的职业技能。 |\n| 山羊 | 什么都敢吃 | 吃掉 1 件道具，将一次 D6 视为自然 6。 |\n| 猎豹 | 疾奔 | 放弃本轮行动，移动最多 10 格。 |\n| 猫 | 蓄势 | 放弃本回合移动，本回合行动判定＋2。 |\n| 水豚 | 稳住 | 使用道具的行动判定失败时，不消耗该道具的使用次数。 |\n\n"}</script>
<script type="application/aurai-resource" id="doc-2-1">{"key":"doc-2-1","title":"待分配技能","access":"public","content":"## 待分配技能\n\n- **借用**（暂名）：可以直接使用相邻队友的道具。效果已认可，动物或职业归属待定；不作为猫的技能。\n\n"}</script>
<script type="application/aurai-resource" id="doc-2-2">{"key":"doc-2-2","title":"后续可选动物","access":"public","content":"## 后续可选动物\n\n[车厢文档](./安宁列车TRPG车厢.md)中的企鹅、骆驼、河马、河狸、变色龙、蝙蝠、乌鸦，以及北极狐、雪鸮、耳廓狐、沙蜥、树懒、鹈鹕、土拨鼠和穿山甲，都可以在后续成为玩家动物。开放一种前，先为它写好能改变玩家选择或行动结果的动物技能；环境型技能按现场的冰、沙等条件触发，不绑定在某节车厢。昆虫作为普通食材生物，不加入可选角色。\n"}</script>

<script type="application/aurai-resource" id="doc-3-0">{"key":"doc-3-0","title":"安宁列车 TRPG 职业","access":"public","content":"# 安宁列车 TRPG 职业\n\n本文件列出首轮可选的六种职业。每名玩家在[主设定](./安宁列车TRPG设定.md)中选一种动物，再从这里选一种职业。职业与动物、起始车厢不绑定。\n\n普通的做饭、采购、维修和使用道具谁都能尝试。职业技能明确改变产出、成本、资源消耗或判定结果。技能可以反复使用，不设置每局使用次数；具体物资与现场条件仍按实际记录结算。\n\n| 职业 | 技能 | 效果 |\n| --- | --- | --- |\n| 厨师 | 精打细算 | 同样食材，制作同一种餐食的出餐量 ×1.25。 |\n| 商人 | 进货渠道 | 外部采购价格 ×0.9。 |\n| 机械师 | 节省耗材 | 维修材料消耗 ×0.75。 |\n| 园艺师 | 栽培 | 留出种植空间并投入 1 份种子，经过一站后收获 3 份对应食材；只能种适合现有环境的品种。 |\n| 服务员 | 端稳 | 使用有次数限制的道具时，有 50% 概率不扣使用次数，效果正常结算。 |\n| 桌游 DM | 改剧本 | 队友掷骰失败时，可以放弃自己下一次行动，将这次结果改为 3。 |\n\n"}</script>
<script type="application/aurai-resource" id="doc-3-1">{"key":"doc-3-1","title":"结算说明","access":"public","content":"## 结算说明\n\n- **厨师**：按实际负责制作的一批同款餐食计算，完整份数向下取整，例如原本能做 4 份，技能后做 5 份。额外产出是正常的一人份餐食，保留该批餐食的配料与饮食要求；原本四份鱼饭可以出五份鱼饭，但素饭不会变成鱼饭。已经完成的餐食不通过再次处理反复乘倍率。\n- **商人**：对已谈妥的外部采购总价乘 0.9，金额保留两位小数。例如原价 20 元，实际付 18 元；只改变价格，不改变商品、库存或所有权。团队内部调拨、卖给乘客的报价与退款不使用此倍率。\n- **机械师**：先明确正常维修要消耗哪些材料，各项实际消耗乘 0.75，材料按份记录剩余量。例如需要 4 份封堵材料时消耗 3 份，需要 1 份时消耗 0.75 份。整件管箍、供暖组件等不可分割零件仍需完整安装，工具不因技能复制；无耗材的维修直接按原做法完成。\n- **园艺师**：种植时扣除种子，并记下品种与实际种植位置。列车到达下一站且生长条件保持可用后，收获一次、加入共享库存并清除本次种植记录。这里是轻量游戏的生长规则，不计算分钟；持续收获需再次投入种子与实际空间。雨林等车厢的可用种植区可以利用，但不能占通道或靠一句描述无限增加种植位置。\n- **服务员**：正常完成一次道具使用后，程序进行一次 50% 判定，成功则免去该次使用原本应扣的次数；失败照常扣除。不限次数的道具不需要判定。猴子一次使用两件道具时分别判定；同一次道具使用只触发一次端稳。食材、种子、维修材料与采购支出不属于道具次数，不能使用此技能免除。\n- **桌游 DM**：放弃下一次行动是确定的代价，不能在该次行动之前反复承诺放弃同一次行动。结果改为 3，按有代价的进展处理；移动骰与搜索道具的概率不使用此技能。\n"}</script>

<script type="application/aurai-resource" id="doc-4-0">{"key":"doc-4-0","title":"安宁列车 TRPG 道具","access":"public","content":"# 安宁列车 TRPG 道具\n\n| 道具 | 数量 | 占位 | 次数 | 效果                  |\n| --- | ---: | ---: | --- |---------------------|\n| 扩展背包 | 2 | 0 | 不限 | 背包空间上限+2。          |\n| 多用工具钳 | 3 | 1 | 不限 | 拆、剪、撬时 D6＋1。        |\n| 安全绳网 | 3 | 1 | 不限 | 跨越断口，或拉住正在坠落的东西。    |\n| 封堵泡沫 | 3 | 1 | 2 次 | 封住一处漏口，持续 2 轮。      |\n| 头灯 | 3 | 1 | 不限 | 照亮所在区域。             |\n| 便携喇叭 | 2 | 1 | 不限 | 让整节车厢听到你说话。         |\n| 迷你无人机 | 1 | 1 | 3 次 | 去够不到的地方拍摄，或带回一件小道具。 |\n| 地板蜡 | 2 | 1 | 2 次 | 把一片地面变滑；经过者可能摔倒。    |\n| 移动 BGM 机 | 1 | 1 | 2 次 | 播放出场音乐；队友下一次 D6＋1。  |\n| 静音铃 | 1 | 1 | 2 次 | 本节车厢的乘客停止说话和行动 1 轮。 |\n| 紧急出口票 | 1 | 1 | 1 次 | 在当前车厢打开一处安全出口。      |\n"}</script>

<script type="application/aurai-resource" id="doc-5-0">{"key":"doc-5-0","title":"安宁列车 TRPG 车厢","access":"public","content":"# 安宁列车 TRPG 车厢\n\n本文件列出八节车厢的用途、接待范围、设施与环境。角色创建与行动规则见[主设定](./安宁列车TRPG设定.md)。\n\n八节车厢两端连接前后车厢，各自包含主题装饰或环境区，以及正常使用的服务区域。日常用文字描述位置与布置，不画逐座布局。需要地图的具体事件可以使用方格地图，尺寸按实际场景确定，`8 × 20` 只是早期草案；已有地图事故剧本保留自己的布局。\n\n"}</script>
<script type="application/aurai-resource" id="doc-5-1">{"key":"doc-5-1","title":"实际用途与接待范围","access":"public","content":"## 实际用途与接待范围\n\n这些范围帮助主持人描述空闲、忙碌和拥挤，不是固定座位数。玩家不用逐个登记座位，乘客可以在不同车厢活动；同一人吃饭、观景和休息时不重复计入在车人数。下表各区域的同时使用人数不能相加作为全车售票上限。\n\n| 车厢 | 开局用途与基本布置 | 大致同时使用范围 | 可以经营的服务 | 改用途与后续投入 |\n| --- | --- | --- | --- | --- |\n| 冻原 | 偏凉的休息区与观景窗；独立隔开的普通温度卧铺区，已有铺位、帘子和行李架。 | 约 5—10 人休息。 | 普通卧铺、偏凉环境休息；差价事先说明。 | 增添保温隔断与寝具后可改善卧铺；不能让不耐冷的乘客直接睡在冰雪环境区。 |\n| 沙漠 | 明亮干燥的座席与小卖部柜台，设遮阳与正常通风；商品从共有库存调拨。 | 约 5—10 人坐席、购物。 | 普通乘车、饮品、零食与日用品零售。 | 挪动展示架能腾出休息空间，但陈列减少；添置饮品设备可增加商品。 |\n| 热带雨林 | 绿植观景区与邻接的用餐间，餐桌地面干燥，降雨区不覆盖用餐桌。 | 约 10—20 人同时堂食。 | 点餐、饮品、小型聚餐；厨房在专用车厢。 | 收拢桌椅可临时住人，但暂停堂食、改送餐或外带；烘焙等厨房投入可增加菜单。 |\n| 湿地 | 架高步道、浅水景观与干燥座席，乘客区有护栏，环境水区不作为日常床位。 | 约 5—10 人观景、短歇。 | 普通乘车、沿窗饮品与轻食。 | 挪开活动家具可增加干燥休息区域，但水池与步道不能算作可住空间。 |\n| 温带草原 | 开阔的公共休息区、可移动桌椅与广播设施，供暖和窗户开局能用。 | 约 10—20 人活动或休息。 | 普通乘车、饮品、经协商的小型表演与聚会。 | 布置垫子、隔帘和寝具可改临时卧铺，暂停公共活动；保温投入可让它更适合住宿。 |\n| 洞穴 | 昏暗主题区与安静卧铺区；照明、通风、检修柜与通道分开布置。 | 约 5—10 人休息。 | 安静卧铺、行李存放。 | 改善照明、通风与寝具能升级休息体验；检修柜前必须留操作空间。 |\n| 厨房与仓储车厢 | 厨房操作区、食品货架、冷藏柜、维修物资与托运行李分区。 | 约 2—4 人同时操作；支持约 10—20 份餐食一批制作。 | 为用餐间及送餐供餐、托运行李；不在厨房摆乘客床位。 | 烤炉开放烘焙，增加冷藏与货架空间可多备货；托运占用空间会影响其他物资存放。 |\n| 火山地带 | 蒸汽主题景观、隔开的温暖休息区与可用的洗浴间；高温设备在乘客区之外。 | 约 5—10 人休息、洗浴。 | 普通乘车、热水洗浴，费用先说明。 | 改善隔热与热水设施可扩大服务；添置寝具可临时休息，但不能占用高温区或排气通道。 |\n\n### 整列车怎样判断接待情况\n\n- **正常经营约 20—40 名乘客**：座席、卧铺和各服务区能正常使用；靠近范围上端时，热门服务需要分批。\n- **临时调整后约 40—60 名乘客**：需要挪家具、调配寝具、改变部分空间用途，可能暂停堂食或公共活动。团队先讨论方案，再接待更多人。\n- **再往上接**：需要另作安排，例如有人到站下车、进一步腾空间或增开接送；不能因为范围不是硬上限，就无限售票。\n\n范围不是自动判定线。主持人结合现有行李量、停用区域、同行者和住宿要求说明当前能否接待；新一批上车前先说清影响，不事后突然宣布超载。普通营业按“宽松、忙碌、拥挤”记录即可，不为每个座位维护占用表。\n\n票款与点餐仍按实际买票、实际点餐人数计算。准备乘客群体时可以先用人数范围，售票与订单确认时再确定这次实际人数；这只是收款和食材数量，不转化为逐座管理。\n\n### 空间决定哪些生意还能做\n\n厨房做饭、用餐间接待堂食、小卖部售货、卧铺休息和洗浴开局都能用。主角团队自己经营，不另外设置外包店主。各服务报价与乘客确认，本文先确定能做什么，不替每项服务随意定价。\n\n用餐间改住人后，厨房还能做饭，但餐食送到休息区或做外带；草原改住人后，用餐间可继续营业，但草原暂时不能办聚会。货物增加会占仓储空间，先整理、商量转移或减少采购，不凭空发明新的仓库。添置设备与用品完成后持续保留，不在事件结束时重置。\n\n首轮经营投入报价见[设计思路的投入表](./安宁列车小游戏设计思路.md)：烤炉与安装 400 元，草原局部永久卧铺翻新与安装 800 元。后者利用既有空间，保留其余公共区域及用餐间，不能把同一区域同时算成卧铺与活动空间；不改变整列车的接待范围。临时用品、设备和牵引燃料费用也按该表与具体路段记录。\n\n"}</script>
<script type="application/aurai-resource" id="doc-5-2">{"key":"doc-5-2","title":"环境、常见动物与故障","access":"public","content":"## 环境、常见动物与故障\n\n下表只列出各车厢**常见的动物物种**。首轮可选玩家动物见主设定中的八种；其他物种先作为世界中的乘客，补好动物技能后再开放给玩家选择。它们都不与车厢绑定。具体乘客的名字、行为、线索和立场由剧本或主持人安排。\n\n| 车厢 | 环境与设施 | 常见动物 | 故障带来的变化 |\n| --- | --- | --- | --- |\n| 冻原 | 冰雪、强风；保温管、防风门 | 企鹅、北极狐、雪鸮 | 保温管漏水后出现积水或薄冰；防风门卡住。 |\n| 沙漠 | 沙地、强光；遮阳层、储水点 | 骆驼、耳廓狐、沙蜥 | 冷却停摆后变成高温区；水管破裂后局部出现浅水。 |\n| 热带雨林 | 藤蔓、高处、人工降雨；灌溉阀、藤蔓桥 | 变色龙、树懒、鹦鹉 | 降雨失控形成积水；停电后出现黑暗。 |\n| 湿地 | 浅水、泥地；水泵、架高步道 | 河马、河狸、鹈鹕 | 水位上涨淹没通道；异常冷气让局部水面结冰。 |\n| 温带草原 | 开阔、微风；观测台、广播柱 | 猎豹、野猫、土拨鼠 | 烟尘遮挡远处视线；广播柱误报。 |\n| 洞穴 | 黑暗、潮湿岩壁；照明、通风机 | 蝙蝠、仓鼠、穿山甲 | 岩壁坍塌产生缝隙；漏水或停风改变路线。 |\n| 厨房与仓储车厢 | 厨房操作区与分隔的仓储区；炉灶、备菜台、水槽、排烟设备、冷藏柜、货架、搬运推车和货物固定带 | 猴子、浣熊、仓鼠、河狸 | 炉灶或排烟故障限制烹饪；冷藏故障影响食材保存；货物滑动堵住取货通道。 |\n| 火山地带 | 热气、蒸汽；隔热层、排气阀 | 乌鸦、山羊 | 蒸汽喷口乱开；冷却失效，也可能局部结冰。 |\n\n车厢的环境会影响行动，但不会给同名动物额外加成。玩家选仓鼠也可以从沙漠上车；火山地带出现什么线索，则要看当局事故的剧本。\n\n厨房与仓储车厢负责备菜、烹饪、出餐和物资存放，乘客在用餐间吃饭。厨房操作区与仓储区分隔，食品和维修物资分区存放，取货通道不穿过炉灶与备菜台。炉灶、备菜台、水槽、排烟设备和冷藏柜开局齐备且能用，支持煮、炒、煎、炖；烤炉等设备可在后续添置，开放烘焙和烤制菜品。\n\n仓储区存放团队共有的食材、小卖部商品和维修物资。厨房与小卖部从这里调拨库存，不产生内部购买费用。乘客托运的货物另行标记，不能作为团队物资取用。普通取货与常规烹饪直接完成，只有设备故障、货架倾倒等需要选择处理办法的情况才进入具体场景。\n"}</script>

<script type="application/aurai-resource" id="doc-6-0">{"key":"doc-6-0","title":"安宁列车食材","access":"public","content":"# 安宁列车食材\n\n食材按具体品种入库，不使用“蔬菜”“水果”“鱼肉”作为库存名称。每份是制作一人份餐食时对应食材的用量；价格是待试玩的游戏采购价。常备调味按一包计价，不逐勺扣除。\n\n“普通站点”表示商家可能供应，不表示每站全部有货。每次停站明确本店品种与数量；玩家提出采购之外的获取办法，由 DM 根据现场审核，实际获得后入库。昆虫是本世界的普通食材生物，采购的是商家处理好的食用品种，不与动物角色混用。\n\n| 类别 | 食材 | 采购价（元／份） | 可用做法或特色 | 常见来源 |\n| --- | --- | ---: | --- | --- |\n| 主食 | 大米 | 1 | 米饭、炒饭、粥。 | 普通站点粮店。 |\n| 主食 | 面条 | 2 | 汤面、拌面、炒面。 | 普通站点粮店。 |\n| 主食 | 面粉 | 2 | 饼、馅饼、面包、饼干。 | 普通站点粮店。 |\n| 主食 | 糯米 | 2 | 糯米饭、饭团、甜点。 | 粮店、地方食品商家。 |\n| 主食 | 燕麦 | 2 | 热粥、奶粥、烘焙。 | 普通站点粮店。 |\n| 主食 | 玉米 | 2 | 煮玉米、玉米汤、配菜。 | 菜市、农产站。 |\n| 蔬菜 | 土豆 | 2 | 炖菜、土豆泥、煎饼。 | 普通站点菜市。 |\n| 蔬菜 | 胡萝卜 | 2 | 炒饭、配菜、炖汤。 | 普通站点菜市。 |\n| 蔬菜 | 白菜 | 2 | 汤、炖菜、馅料。 | 普通站点菜市。 |\n| 蔬菜 | 番茄 | 2 | 酸甜汤、炒蛋、酱汁。 | 普通站点菜市。 |\n| 蔬菜 | 黄瓜 | 2 | 凉拌、沙拉、配菜。 | 普通站点菜市。 |\n| 蔬菜 | 菠菜 | 2 | 汤、炒菜、面食配菜。 | 普通站点菜市。 |\n| 蔬菜 | 南瓜 | 2 | 浓汤、粥、烤菜、甜点。 | 菜市、农产站。 |\n| 蔬菜 | 洋葱 | 2 | 炒菜、汤、馅料；作为主要配料时按份扣除。 | 普通站点菜市。 |\n| 蔬菜 | 茄子 | 2 | 炖菜、煎菜、烤菜。 | 普通站点菜市。 |\n| 蔬菜 | 青椒 | 2 | 炒菜、烤菜、填馅；本品种不辣。 | 普通站点菜市。 |\n| 蔬菜 | 西兰花 | 3 | 配菜、汤、烤菜。 | 菜市。 |\n| 蔬菜 | 莲藕 | 3 | 汤、炖菜、夹馅。 | 河湖沿线菜市。 |\n| 蔬菜 | 竹笋 | 3 | 汤、炒菜、馅料。 | 山区农产站。 |\n| 蔬菜 | 豌豆 | 2 | 炒饭、汤、泥状配菜。 | 普通站点菜市。 |\n| 菌菇 | 香菇 | 3 | 菌菇汤、炖菜、馅料。 | 普通站点菜市。 |\n| 菌菇 | 平菇 | 2 | 汤、炒菜、煎菜。 | 普通站点菜市。 |\n| 菌菇 | 木耳 | 2 | 汤、凉拌、炒菜。 | 菜市、干货商家。 |\n| 菌菇 | 松茸 | 5 | 地方特色汤、菌菇面；特殊订单可指定。 | 松岭站山货商家。 |\n| 豆制品 | 豆腐 | 2 | 素菜、炖汤、煎豆腐。 | 普通站点菜市。 |\n| 豆制品 | 豆皮 | 2 | 汤、卷物、凉拌。 | 普通站点菜市。 |\n| 豆制品 | 豆浆 | 2 | 饮品、甜品、替代奶的部分做法。 | 食品店、豆制品摊。 |\n| 蛋奶 | 鸡蛋 | 2 | 炒蛋、蛋汤、炒饭、烘焙。 | 普通站点食品店。 |\n| 蛋奶 | 鸭蛋 | 3 | 蛋料理、地方特色餐。 | 河湖沿线食品店。 |\n| 蛋奶 | 牛奶 | 2 | 热饮、奶汤、甜品、烘焙。 | 普通站点食品店。 |\n| 蛋奶 | 奶酪 | 3 | 面食、烤菜、夹馅。 | 食品店、特色商家。 |\n| 蛋奶 | 黄油 | 3 | 煎制、酱汁、烘焙；作为主要用料按份扣除。 | 食品店。 |\n| 鱼类 | 鲈鱼 | 5 | 煎鱼、鱼汤、烤鱼。 | 鱼市、河湖沿线站点。 |\n| 鱼类 | 鲫鱼 | 4 | 鱼汤、炖鱼。 | 河湖沿线鱼市。 |\n| 鱼类 | 鳕鱼 | 6 | 煎鱼、烤鱼、鱼排。 | 港湾鱼市。 |\n| 鱼类 | 三文鱼 | 7 | 煎鱼、烤鱼、鱼饭。 | 港湾鱼市、冷藏食品店。 |\n| 鱼类 | 沙丁鱼 | 3 | 煎鱼、鱼馅、简餐。 | 港湾鱼市。 |\n| 水产 | 河虾 | 4 | 汤、炒饭、炒菜。 | 河湖沿线鱼市。 |\n| 水产 | 螃蟹 | 6 | 蒸制、汤、蟹肉面。 | 河湖或港湾鱼市。 |\n| 水产 | 蛤蜊 | 3 | 汤、面食。 | 港湾鱼市。 |\n| 水产 | 扇贝 | 5 | 煎制、烤制、汤。 | 港湾鱼市。 |\n| 水产 | 鱿鱼 | 4 | 炒菜、烤制、馅料。 | 港湾鱼市。 |\n| 水产 | 海带 | 2 | 汤、凉拌、配菜。 | 港湾鱼市、干货商家。 |\n| 昆虫 | 食用蟋蟀 | 2 | 烤制、炒制、脆口配料。 | 昆虫食品摊、农产站。 |\n| 昆虫 | 食用蝗虫 | 3 | 烤串、炒菜、饭菜配料。 | 草原沿线昆虫食品摊。 |\n| 昆虫 | 面包虫 | 2 | 煎炒、烤制、脆口配料。 | 昆虫食品摊。 |\n| 昆虫 | 蚕蛹 | 4 | 煎炒、炖制、地方特色餐。 | 蚕业地区食品商家。 |\n| 昆虫 | 竹虫 | 4 | 烤制、煎制、地方特色餐。 | 竹林沿线食品商家。 |\n| 昆虫 | 食用蚂蚁 | 3 | 酸味配料、特色小食。 | 地方昆虫食品摊。 |\n| 水果 | 苹果 | 3 | 果盘、热饮、馅料、饼干。 | 普通站点水果摊。 |\n| 水果 | 橙子 | 3 | 果盘、酸甜酱汁、果汁。 | 普通站点水果摊。 |\n| 水果 | 香蕉 | 3 | 果盘、甜点、烘焙。 | 水果摊。 |\n| 水果 | 梨 | 3 | 热饮、果盘、甜点。 | 普通站点水果摊。 |\n| 水果 | 草莓 | 4 | 果盘、甜品、装饰。 | 水果摊、特色农产站。 |\n| 水果 | 柠檬 | 2 | 饮品、酸味酱汁、鱼菜调味。 | 水果摊。 |\n| 特色调味 | 蜂蜜 | 3 | 甜品、饮品、酱汁；按份记录。 | 农产站、食品店。 |\n| 特色调味 | 辣椒 | 2 | 辣味菜、酱汁；与青椒分开记录。 | 菜市、调味商家。 |\n| 特色调味 | 咖喱料 | 3 | 咖喱饭、炖菜。 | 调味商家。 |\n\n"}</script>
<script type="application/aurai-resource" id="doc-6-1">{"key":"doc-6-1","title":"常备调味","access":"public","content":"## 常备调味\n\n开局已有下表各一包。普通烹饪直接使用，不逐次扣数量；需要补充时先明确哪包用完，再采购。调味不能替代订单所需的主食、蛋、鱼或其他主要用料。\n\n| 食材 | 采购价（元／包） | 用途 | 来源 |\n| --- | ---: | --- | --- |\n| 食用油 | 2 | 煎炒与基础烹饪。 | 普通站点食品店。 |\n| 盐 | 1 | 基础调味。 | 普通站点食品店。 |\n| 糖 | 1 | 甜味与基础烘焙。 | 普通站点食品店。 |\n| 酱油 | 2 | 咸鲜风味。 | 普通站点调味商家。 |\n| 醋 | 2 | 酸味与凉拌。 | 普通站点调味商家。 |\n| 胡椒 | 2 | 辛香风味。 | 普通站点调味商家。 |\n| 姜 | 1 | 汤、炖菜与调味。 | 普通站点菜市。 |\n| 蒜 | 1 | 炒菜、酱汁与调味。 | 普通站点菜市。 |\n\n"}</script>
<script type="application/aurai-resource" id="doc-6-2">{"key":"doc-6-2","title":"种子","access":"public","content":"## 种子\n\n种子是种植投入，不直接作为出餐食材。园艺师技能见[职业表](./安宁列车TRPG职业.md)；投入一份种子后，经过一站可收获三份对应食材。松岭农产商家首次各售下表两份种子，购买后按实际数量入库，不作为起始免费物资。\n\n| 种子 | 采购价（元／份） | 收获食材 | 种植条件 |\n| --- | ---: | --- | --- |\n| 白菜种子 | 1 | 白菜 3 份。 | 有土、水和适当光照的种植区。 |\n| 番茄种子 | 2 | 番茄 3 份。 | 温暖、有光照及支撑的种植区。 |\n| 豌豆种子 | 1 | 豌豆 3 份。 | 有土、水、光照及攀附位置的种植区。 |\n\n菜单以实际使用的食材和做法组成，不穷举菜谱。普通鱼、水产与昆虫均是荤食；蔬果、菌菇、谷物和豆制品可用于素食，蛋奶按乘客明确的要求处理。食物偏好不由角色物种限定，不默认鸟类一定吃虫或猫一定吃鱼。\n"}</script>

<script type="application/aurai-resource" id="doc-7-0">{"key":"doc-7-0","title":"安宁列车大事件：风雪中的接驳列车","access":"host","content":"# 安宁列车大事件：风雪中的接驳列车\n\n"}</script>
<script type="application/aurai-resource" id="doc-7-1">{"key":"doc-7-1","title":"事件定位","access":"host","content":"## 事件定位\n\n列车原本正常营业，途中突然遭遇暴风雪。到达下一站后，玩家才发现道路交通中断，其他客运列车暂时无法接驳，站里有滞留的动物想买票乘车，前往交通与生活条件正常的港湾枢纽。站方提供当前行车与车站情况，团队继续经营自己的列车。\n\n大目标是接送沿线乘客、维持车内生活，并抵达港湾。乘客自己买票、自己点餐；团队收取票款与餐费，自行决定补货与设施投入。风雪影响整条沿线和整列车的经营，但厨房、小游戏、乘客互动仍然可以继续。到达港湾后本事件结束，列车整修补货，继续无尽旅程。\n\n这份文档是待试玩的事件设计。普通经营规则见[设计思路](./安宁列车小游戏设计思路.md)，角色和道具见[主设定](./安宁列车TRPG设定.md)。不要求全员一直调查，也不模拟天气、行车与供暖的工程细节。\n\n"}</script>
<script type="application/aurai-resource" id="doc-7-2">{"key":"doc-7-2","title":"1. 玩家开始时知道什么","access":"host","content":"## 1. 玩家开始时知道什么\n\n开场仍是普通午餐营业，下一站松岭，之后是溪桥、港湾。没有提前发布暴风雪预告，不要求玩家开局采购救灾物资。原有乘客、库存与订单照常存在。\n\n在玩家已经开始日常活动后，主持人描述窗外骤然起风、雪变密，车窗接缝透风，广播收到前方站台的求助。天气变化是突发情况，不是玩家没有读到某条线索的惩罚。司机按当前可见条件减速，列车抵达松岭；玩家不必扮演专业司机或计算车速。\n\n松岭站才让玩家知道：道路已不通，站内供暖还能维持，约 10—20 名乘客想搭车离开；港湾目前确认有接收条件，但溪桥的通话中途断了。玩家不知道风雪何时结束，也没有全线受困人数和未来故障的清单。\n\n"}</script>
<script type="application/aurai-resource" id="doc-7-3">{"key":"doc-7-3","title":"2. 主持人提前确定的事实","access":"host","content":"## 2. 主持人提前确定的事实\n\n以下是本样例的幕后事实，不随玩家猜测改变。玩家可以通过现场、交谈和通信逐步得知。\n\n| 地点或事项 | 本样例实际情况 | 玩家怎样核实 |\n| --- | --- | --- |\n| 松岭站 | 站内有供暖，约 10—20 名滞留乘客想买票前往港湾；商家按公开库存出售食材与用品。 | 与乘客交谈，售票时确认实际人数，查看商家货物。 |\n| 溪桥站 | 约 20—30 名乘客在室内候车，备用供暖正常；没有失踪的人。 | 恢复通话，或列车获准进站后查看候车室；售票时确认实际人数。 |\n| 溪桥失联 | 风雪使站台通信接线箱进水，语音中断；铁路值守人员仍能使用独立的行车联络。 | 松岭值守人员能确认线路通行信息；溪桥现场可见进水痕迹与通信设备故障。 |\n| 供暖物资 | 溪桥站的备用供暖组件没有失窃，货单上的新旧库名混用，货物放在旁边的旧维修库。 | 送货单、仓库登记、卸货人员的说法互相印证。 |\n| 铁路 | 松岭至溪桥、溪桥至港湾两段在本样例中都能获准通行；每次离站前需得到当时确认。 | 站方通过行车联络明确当前路段条件，不能把一次确认当作永久通行保证。 |\n| 港湾枢纽 | 交通、住宿与商店正常开放，乘客抵达后可以继续自己的安排；无需等待风雪停止才结束本事件。 | 首站联络可确认当地情况，之后保持联系，抵达时下客。 |\n\n风雪本身不是阴谋或需要破解的谜底。解谜内容集中在失联情况、供暖物资去向与具体故障；不最后突然揭露一名乘客控制天气。\n\n若另开新剧本，主持人可以预先更换受困地点、人数和具体故障；这一事件开始后，不为了堵住玩家办法而临时改变关键事实。天气仍可被叙述为不稳定，但未公布的未来变化不是自动结算表。\n\n"}</script>
<script type="application/aurai-resource" id="doc-7-4">{"key":"doc-7-4","title":"3. 整件事怎样推进","access":"host","content":"## 3. 整件事怎样推进\n\n| 阶段 | 眼前情况 | 玩家主要选择 | 转入后续场景的依据 |\n| --- | --- | --- | --- |\n| 正常营业 | 原有订单与乘客服务。 | 分工经营、处理小问题。 | 日常活动已经展开，突发风雪出现。 |\n| 松岭停靠 | 一批约 10—20 名滞留乘客询问到港湾的车票。 | 接多少人、怎样安排、提供哪些餐食、补什么货；支付下一段 60 元燃料补给。 | 票价与乘车安排确认，乘客付费上车，完成补给，下一段线路获得通行确认。 |\n| 行驶中的临时生活 | 人变多，热饭、座位、行李与保温都有需求。 | 分工供餐、整理、与乘客交流；了解溪桥情况。 | 各短场景按结果更新，接近溪桥时站方提供新的现场信息。 |\n| 溪桥停靠 | 一批约 20—30 名乘客想买票；语音设备故障，待售的备用供暖组件找不到。 | 根据当前拥挤情况腾空间、恢复联系、核实物资、售票并接新订单；支付下一段 60 元燃料补给。 | 接人方案落实、必要问题控制、完成补给、港湾情况与路段通行确认。 |\n| 前往港湾 | 团队带着实际接上的人继续行驶。 | 继续供餐与车内服务、处理仍有影响的问题。 | 正常抵达港湾，无需完成所有可选订单。 |\n| 抵站收尾 | 乘客到达目的地，列车恢复普通营业安排。 | 下客、处理未完成订单、核对收入与支出、补货。 | 已上车乘客抵达或已有商量好的后续安排，事件收束。 |\n\n这些是沿途地点和事情的关系，不是按顺序锁定的任务按钮。玩家可提前联络、换菜单、另找物资、分头工作，或不接部分额外服务。基本接驳方案直接可用，不靠某一职业、某件道具或掷骰成功才能开启。\n\n普通活动不计算分钟，停站按场景收束。主持人不因玩家现实中讨论很久就让站内失温、线路消失或乘客突然受伤。需要引入新危险时，先呈现原因与预警，给玩家行动机会；本样例不设置隐藏死亡倒计时。\n\n"}</script>
<script type="application/aurai-resource" id="doc-7-5">{"key":"doc-7-5","title":"4. 接多少人、住在哪里","access":"host","content":"## 4. 接多少人、住在哪里\n\n接待范围使用[车厢文档](./安宁列车TRPG车厢.md)：正常经营约 20—40 名乘客，临时调整后约 40—60 名。开局七名乘客加松岭两名普通新乘客，接上松岭这一批后大致仍在正常接待范围内；到溪桥再接一批，就可能需要腾空间或改变用途。\n\n主持人根据实际买票人数、行李量和住宿需求说明当前“宽松、忙碌、拥挤”，不维护固定名额或要求玩家为每人指定座位。若本次两批人数较少，现有空间够用，就不强行插入改装任务；若接近临时范围上端，先落实接待方案再继续售票。\n\n| 布置方案 | 大致增加的休息空间 | 需要做什么 | 会影响什么 |\n| --- | --- | --- | --- |\n| 把用餐间改为临时休息区 | 可安排约 10—20 人临时休息，视行李量与布置而定。 | 将部分桌椅收拢固定，购置或实际取得配套垫子与毯子，保留出口和通道。样例整批用品价 60 元，供约 10 人使用；更多用品需商量采购或调配。 | 暂停堂食，厨房改为分份送餐；仍能经营外带与小卖部。 |\n| 草原车厢布置临时休息区 | 可安排约 10—20 人临时休息，视行李量与布置而定。 | 挪开活动家具，取得上述用品及隔帘，处理窗缝并添置备用供暖组件。约 10 人布置的样例费用为用品 60 元、隔帘 40 元、组件 100 元，共 200 元。 | 该区域暂停观景活动，用餐间照常营业；添置物品以后仍能用。 |\n\n上述费用是待试玩数值，商家物资需实际购买入库。玩家也可以利用已有物品、向乘客借用或提出交换，先确认归属与条件再布置，不能描述一句就凭空获得整套用品。也接受玩家组合其他空间，但厨房操作区、货架通道、深水和高温区域不能只改标签就变成床位；主持人根据实际设施说明要搬走什么、隔离什么。\n\n售票前把接待安排与拥挤程度讲清楚，只接实际能安排的乘客。未接上的乘客留在有供暖的车站，等待其他交通安排。如果团队主动安排二次接送，可另谈通行与售票，不把掉头无限往返当作默认流程。\n\n原有乘客的目的站不被悄悄改写。溪桥原定下车的乘客到站时得知当地接续交通中断，可以留在仍有供暖的站内，也可以商量补票继续到港湾。实际在车人数跟随上下客与乘客决定更新，不固定要求全员继续。\n\n"}</script>
<script type="application/aurai-resource" id="doc-7-6">{"key":"doc-7-6","title":"5. 供暖：保证生活，不逐格算能量","access":"host","content":"## 5. 供暖：保证生活，不逐格算能量\n\n列车现有供暖开局正常，只记录相关区域“正常、偏冷、暂停使用”与已经采取的办法。冻原环境不是供暖坏了，企鹅耐冷也不代表其他动物能直接住在冻原车厢。\n\n第一批上车后，乘客反映草原车厢窗边漏风。窗缝的保温条老化，能直接找到；维修箱里有本次修补所需材料。重新封好窗缝是常规解法，完成后保持有效。玩家也可先把乘客转到暖区，再决定是否修理。\n\n溪桥的备用供暖组件用于扩大后的临时休息区。车上已有正常供暖，不会因为暂时没找到组件就全车冻住；用餐间方案能利用原有暖区，草原方案则需要安装组件。组件是旧维修库内准备出售的设备，找到后向物资管理员按已说明的 100 元购买，实际搬运安装，不通过翻找概率抽取，也不因为调查完成就免费送给团队。玩家不需要该组件时，可以不购买。\n\n不计算每段行程消耗几单位燃料，也不靠厨房炉灶随意给整车供暖。涉及新的设备办法时，主持人说明现场是否支持、需要哪些材料，以及解决的范围。\n\n"}</script>
<script type="application/aurai-resource" id="doc-7-7">{"key":"doc-7-7","title":"6. 供餐与赚钱","access":"host","content":"## 6. 供餐与赚钱\n\n突发事件改变订单规模，但共享库存、菜单协商、外部采购和实际获取食材的规则不变。普通乘客仍能按原约定点餐，不会因为救援开启就把之前的餐费全部改成免费。\n\n### 乘客买票，餐食另外点\n\n收入来自实际买票和购买服务的乘客。车票只包含已说明的乘车位置与目的站，餐食另点，不附带站方指定的一份基本餐。乘客可以点便宜饭、想吃的菜，也可以吃自带食物；同行者可以一起点，但要说明各人的禁忌。\n\n| 路段 | 每人样例票价 | 本批全部上车时的票款范围 |\n| --- | ---: | ---: |\n| 松岭至港湾 | 15 元 | 约 10—20 人，约 150—300 元。 |\n| 溪桥至港湾 | 10 元 | 约 20—30 人，约 200—300 元。 |\n\n这些是普通路段票价的待试玩数值，不因风雪临时加价。买票上车时收款；未上车不收款。原有乘客已经付过的路段不再收费，主动改程的补票另行确认。其他普通新乘客按自己路段售票，不与上述两批重复计数。\n\n点餐仍采用厨房已有流程：乘客提出需求与预算，团队商量菜单、谈好餐费，实际准备交付后收钱。团队按已接订单和可能的后续需求决定采购多少，不把全车人数自动转换成一张供餐订单。\n\n例如三位乘客一起点无肉热饭，接受蛋奶，共愿付 24 元。可以商量做三份白菜蛋饭，消耗大米、白菜、鸡蛋各三份，按采购表成本为 15 元。确认菜单并交付后收 24 元；旁边没有点餐的乘客不参与本单结算。也可以提出更便宜的无蛋菜单，先问乘客是否接受。其他食材品种、用途与价格见[食材表](./安宁列车食材.md)。\n\n### 团队的钱花在哪里\n\n- **外部买食材**：补米、面、蔬菜、蛋、肉以及特殊食材。厨房和小卖部共享库存，内部取货不收费；乘客携带的食品须实际交易才能入库。\n- **下一段牵引燃料**：松岭至溪桥、溪桥至港湾各 60 元，共 120 元；各站离站前实际购买补给，本站票款可先用于支付。开局已有燃料够到松岭，不重复收费。不逐格计算燃料，也不另外扣厨房烹饪燃料费。\n- **扩大可售位置**：上文用餐间方案购买用品 60 元，草原方案共 200 元。花得少可能影响堂食，花得多可以保留营业空间；玩家也能商量利用现有材料。\n- **保温与维修**：开局维修箱内材料够处理一处窗缝；之后需要额外材料时再采购，不能无限复制现有耗材。\n- **改善服务与设施**：烤炉等沿用原有经营规则，添置后持续保留。风雪期间是否投资，由团队比较补货、安置和设施需求后决定。\n\n票款到账后就是共有资金，可以用于实际采购，不额外等待站方发预付款或事件结束发尾款。上述范围用于估计经营规模，实际收入仍是已售票数乘票价，减去真实采购与服务支出后才知道净收益；不按人数范围的上限直接发钱。\n\n两站都有能提供上述牵引燃料的供应商，报价在售票与采购前公开。补给一次即可完成对应路段，后续不因场景多或讨论久追加费用。若团队少接客或放弃接驳，离站前也要确认下一段的资金与补给；可以继续在有供暖的站内经营、协商供货或调整行程，DM 不让列车无预警停在途中。前一站买到的组件和用品下次仍能用，不反复收费。\n\n### 一趟经营的对照账\n\n以下按松岭 15 人、溪桥 25 人实际买票举例，都是人数范围内的一次取值，不是固定名额。票款共 475 元；新增三人热饭、两份蛋汤、四人热饭共收入 64 元，恢复所耗食材需 39 元，餐饮利润 25 元。食材补回发生在有货的站点，途中已消耗的部分可在港湾补回；这笔补货只有实际购买才扣款，尚未补回时列为后续补货预算，不直接改库存。\n\n| 项目 | 用餐间临时休息方案 | 草原临时休息方案 |\n| --- | ---: | ---: |\n| 新增票款 | 475 元 | 475 元 |\n| 上述新增餐费 | 64 元 | 64 元 |\n| 两段牵引燃料补给 | −120 元 | −120 元 |\n| 补回上述用掉的食材 | −39 元 | −39 元 |\n| 首次添置临时用品与设备 | −60 元 | −200 元 |\n| 本事件新增资金 | **320 元** | **180 元** |\n| 若另完成开局七人松茸餐单并补货，连同起始 30 元后的现金 | **387 元** | **247 元** |\n\n表内未算其他普通新客票款、改程补票、独立休息额外服务及职业效果；有实际成交再加入。不同人数下，两站票款为 350—600 元；仍按这三张新增餐单试算，用餐间方案新增资金为 195—445 元，草原方案为 55—305 元。无需布置时不扣设备费，少接订单时改用真实餐费和食材成本。\n\n烤炉与安装现为 400 元，草原局部永久卧铺翻新为 800 元，见[经营投入表](./安宁列车小游戏设计思路.md)。中间规模的一趟能积累翻新款；采用省钱方案且生意更多时，可以提前买烤炉，但买完还要考虑下一段补给与采购。这里没有强制冻结的储备金，团队自己决定是否花掉现金。暂停堂食仍可卖送餐，不能把 140 元的方案差价当作一定能用餐费赚回。\n\n松岭商家沿用厨房采购表。溪桥商家按食材表价格售大米十二份、面条八份、白菜六份、胡萝卜四份、番茄两份、土豆六份、鸡蛋八份、豆腐六份、鲈鱼四份、河虾四份、食用蟋蟀六份、面包虫四份、苹果四份，没有松茸；垫子毯子整批供约十人使用，隔帘与供暖组件各一套。库存与费用公开，买到后实际扣款入库，没有免费供餐物资包。乘客并非人人必须在车上点餐，若更多人想吃饭，团队可商量菜单、利用库存或另找供应，不保证商家库存自动随人数增加。\n\n### 三种可以穿插的生意\n\n- **原有订单**：松针与阿岚的菌菇面仍可交付。松岭商家有已经放在店内的山菌，不因突发风雪自动消失；野外采集则需要重新考虑实际天气，玩家也可确认改为普通菌菇。\n- **家庭点餐**：两名同行乘客想买两份蛋汤，愿付 8 元；各用蛋一份，食材来自团队库存，成本按现有采购价计算。乘客已经点过其他饭菜时也能加点，但不强制每人点餐。\n- **包厢询问**：一位有支付能力的乘客提出额外付 40 元，为同行小组安排独立休息区域。团队可接受、拒绝，或提出只加隔帘的方案；只有实际落实并经对方同意才收费。独占空间会影响其他乘客的接待，先说明影响，不计算锁住了几个固定座位。\n\n具体生意可以换成现有乘客提出，不必为每张订单新增一位角色。新需求与支出都先说清条件，付费、点餐与物资交易按实际约定执行。\n\n"}</script>
<script type="application/aurai-resource" id="doc-7-8">{"key":"doc-7-8","title":"7. 溪桥站的调查与自由行动","access":"host","content":"## 7. 溪桥站的调查与自由行动\n\n站内有独立行车联络，所以铁路通行信息能核实；乘客通信设备失灵，不等于必须猜测铁轨能否行驶。玩家面对的是“候车室是否有人需要接、组件到底在哪里”，不需要在没有任何信息时赌全车安全。\n\n### 失联站内发生了什么\n\n如果先通过独立联络请求核实，值守人员可说明约 20—30 名乘客仍在候车室、有备用供暖。到站检查也能得到同样事实，售票前确认实际想上车的人数。玩家可以安排一组去见乘客，一组查物资，一组继续经营。\n\n通信接线箱进水的常规处理是断开该设备电源、排水、替换损坏接线件，站内维修柜有材料。按方案可直接恢复语音；若玩家想临时搭联络方式，主持人结合已有设备裁定。维修过程可以放一个短操作小游戏，具体规则另行设计，未实现时仍能描述行动完成。\n\n### 供暖组件去了哪里\n\n物资商的货单写“二号库”，新仓库同号货架却没有待售组件；这造成了“物资丢失”的初步说法。\n\n| 线索来源 | 可获得的事实 |\n| --- | --- |\n| 送货单 | 收货地点沿用旧库名，附有旧维修库门上的标志描述。 |\n| 仓库登记 | 本次货物由装卸班放入旧维修库，签收数与送货单一致。 |\n| 卸货人员 | 见过旧库内的供暖箱，但新库管理员以为送到新库。 |\n\n任一信息可以推动寻找，三条互相验证，不必集齐才能行动。检查旧维修库能直接找到对应货箱；由物资管理员确认后，团队可按已知价格购买。也允许玩家先逐库查看，不能因为跳过预想调查顺序就把组件移走。找到货物不会改变归属或免去已说明的购买费用。\n\n旧库门前积雪遮住拉门的下缘。站内工具能清理并开门，属于常规解法；玩家也可提出用动物能力、道具或协作搬运的方式，DM 审核后执行。组件过重时用站内推车搬运，不让它强行占进一个角色的三格背包。\n\n"}</script>
<script type="application/aurai-resource" id="doc-7-9">{"key":"doc-7-9","title":"8. 小游戏放在哪里","access":"host","content":"## 8. 小游戏放在哪里\n\n每种只在实际问题存在时出现，处理完就保留结果。下列列出目标和影响，具体小游戏机制待单独设计，不要求所有环节都玩。\n\n| 场景 | 玩家要完成什么 | 结果影响 |\n| --- | --- | --- |\n| 临时安置 | 在保留通道和设备操作位置的条件下安排床垫、行李与同行者。 | 能否接待下一批乘客、当前拥挤程度、是否保留堂食。 |\n| 封窗保温 | 找到漏风处，选择已有材料完成封堵。 | 草原车厢由偏冷恢复适合休息，不直接加全车温度分。 |\n| 货箱搬运 | 清理取货路线、固定推车并搬出对应组件。 | 取得真实物资；错拿箱子可核对退换，不生成新货物。 |\n| 大批分餐 | 按人数和饮食禁忌分配已经做好的餐食。 | 正确交付人数与食材消耗，出错先补正，不随机把整锅饭清空。 |\n\n不把大批乘客送餐拆成每人一次重复操作。按同行组或同类餐一起处理，程序负责实际订单数量，玩家负责菜单、分配和临时办法。\n\n"}</script>
<script type="application/aurai-resource" id="doc-7-10">{"key":"doc-7-10","title":"9. 六名玩家怎样都有事做","access":"host","content":"## 9. 六名玩家怎样都有事做\n\n玩家自行选择，以下只是可用分工：两人处理餐食与补给，两人布置空间与维修，两人联络站方、调查物资并服务乘客。需要时重新组合，不分配固定职责职业。\n\n主持人每次处理一件有选择或有结果的短场景，再切到其他组。多组的结果互相影响：确定床位后才知道接多少人，采购或领取物资后才知道能提供什么菜单。其余玩家可以提出建议，但不用等所有人轮流掷骰后才继续营业。\n\n"}</script>
<script type="application/aurai-resource" id="doc-7-11">{"key":"doc-7-11","title":"10. 结局与继续旅程","access":"host","content":"## 10. 结局与继续旅程\n\n**抵达港湾**：已购票上车的乘客抵达约定目的地，已经接下的餐饮与服务按实际情况完成；记录实际票款、餐费、采购和设备支出。买来的用品、设备及未使用食材都留在团队库存，没有站方尾款或额外随机奖金。\n\n**只接部分乘客**：只接实际能安排的乘客，收入按真实买票人数计算；其余乘客留在车站等待其他安排。已经收费但未完成的行程或订单需说明原因并与乘客商量退款或改程，不默认为全额成功或整局失败。\n\n**改变方案**：线路条件实际改变时，可以停留有供暖的站内、申请其他接驳或商量新的交接地点。DM 先说明已知情况与可行选择，不突然以剧情要求强行发车。玩家拒绝接驳也能继续商量自己的停留与经营安排，不把整件事件做成只有接受才可玩的按钮。\n\n风雪不必在结局时立刻停止。乘客已经安置、列车有安全停留和补给条件，本件大事件就能收束。之后由团队决定休整、正常接客或承接下一段行程；无尽旅程不因抵达港湾而通关。\n\n"}</script>
<script type="application/aurai-resource" id="doc-7-12">{"key":"doc-7-12","title":"11. 实际记录哪些状态","access":"host","content":"## 11. 实际记录哪些状态\n\n- 在车乘客与同行组、目的站、已经同意的改程安排。\n- 当前接待状态（宽松、忙碌、拥挤）、各空间用途与临时布置。\n- 相关区域供暖状态、已修复或暂停使用的设备。\n- 团队资金、实际采购与取得的食材和用品。\n- 已售车票、票款、已接订单、餐费与完成情况。\n- 当前已知的站内情况、物资线索与线路确认。\n\n不增加天气数值、分钟账、全员饥饿条或全车满意度。库存、售票与订单结算由程序明确执行；DM 补现场细节并审核自由办法，不能凭叙述多发食材、改变已经明确的费用或推翻找到的物资。\n\n"}</script>
<script type="application/aurai-resource" id="doc-7-13">{"key":"doc-7-13","title":"12. 可以直接主持的沿途场景","access":"host","content":"## 12. 可以直接主持的沿途场景\n\n本节给出本样例的现场细节。新增点餐角色都属于前文两批买票乘客，不再额外增加一批人；站内工作人员不计入乘客。人数范围用于描述规模，售票时确认本次实际人数。示例成本按普通采购价计算，职业效果按实际角色另行应用。\n\n每次停站先说明当前可见情况，让玩家选择分工。途中从尚未处理的需求中切换场景，不要求把本节全部做完才能到下一站。现场已经解决的问题不重新出现，没接受的额外生意也不会变成欠单。\n\n### 松岭：上车前先把生意说清楚\n\n**现场开场**：站内灯亮着，候车室有暖气。值守员告诉团队约 10—20 人想去港湾，站边商家仍在营业。旅客先问票价、能否一起休息、行李放哪里，并没有人人要求买饭。已有普通乘客苔花与阿响照常按自己的目的站买票。\n\n#### 场景一：三位乘客的一顿热饭\n\n- **出场乘客**：兔子禾芽、山羊麦穗和野猫石耳，属于松岭这批乘客，目的站均为港湾。三人各付 15 元车票，另有合计 24 元的饭钱。\n- **他们直接说**：“能不能做三份热饭？不要肉、鱼和虫子，可以吃蛋奶，不吃辣。我们不一定要吃同一道菜。”这些要求点餐时全部讲清。\n- **现场条件**：查看团队当时的实际库存，已有普通订单占用的食材也要算进去。松岭商家按已有采购表售货。\n- **现成办法**：三份白菜蛋饭用大米、白菜、鸡蛋各三份，采购价值合计 15 元；缺货可在本站补。也可提议白菜豆腐饭，三种食材各三份，采购价值同为 15 元。两种方案都能满足已说出的需求，团队确认后即可接单。\n- **自由发挥**：混合菜单、热汤配主食等都可以，但把实际用料、分量和总价向乘客说清楚。额外昂贵用料不自动提高他们的预算。\n- **处理结果**：交付约定三份餐收 24 元，扣实际食材；三张车票另收 45 元。暂时做不了就先不接饭单，他们仍可买票并吃自带食物。已接单后改菜单须再征得同意。\n\n#### 场景二：箱子很大，但不是多出来的货物\n\n- **出场乘客**：苔花，沿用普通营业中的新乘客，目的站港湾。她带着已知的干菌菇货箱，不携带鲜松茸。\n- **她直接说**：“箱子要保持干燥，也别压坏。我可以让你们搬到仓储区，但到站得能取出来。”\n- **现场条件**：箱子搁在入口会占通道；厨房与仓储车厢已有独立货物区。货箱属于苔花，箱中食品不是团队库存。\n- **现成办法**：利用货物区存放并固定，保持通道可走；或者与她商量拆成便于存放的小件，搬完核对原货物。\n- **自由发挥**：玩家可以询问是否买一些干菌菇。只有双方谈定具体品种、数量、价格，且实际交货后才入库；DM 先确定箱内货物，再答复，不能按玩家缺什么就改成什么。\n- **处理结果**：妥善存放后入口恢复通行，苔花照常乘车。基础行李存放包含在已谈好的乘车服务内，不因此自动多收一笔奖励；主动商谈的食品交易另外结算。\n\n### 松岭至溪桥：让已经上车的人住得下、吃得上\n\n#### 场景三：漏风的窗边与两碗蛋汤\n\n- **出场乘客**：水獭沫沫与河狸榛榛，属于松岭这批同行乘客，前往港湾。他们在草原车厢窗边休息，想另外点两份热蛋汤，合计愿付 8 元。\n- **他们直接说**：“这边一直吹冷风。我们可以换地方坐，但行李想放在身边。还有，两碗蛋汤有吗？”休息安排与点汤是两件分别可处理的事。\n- **现场条件**：老化的窗缝可直接看见，维修箱材料够修这一处；其他正常暖区可用，但要查看当时是否已经忙碌。汤用鸡蛋两份，普通采购价值 4 元。\n- **现成办法**：重新封窗，原处继续使用；或先调到暖区，之后再修。搬人时同时安排行李，别把冷风问题转成堵通道。\n- **自由发挥**：借用已有遮挡物、重新布置休息区均可，由 DM 根据物品和位置确认实际遮风效果。热汤能满足点餐需求，但不等于窗缝修好了。\n- **处理结果**：修好后该处恢复正常；只搬人则窗边仍偏冷，下一批安排时要避开。汤交付另收 8 元并扣两份蛋；不接汤单也仍需回应已售票乘客的休息问题。\n\n### 溪桥：接新客之前决定列车怎样营业\n\n**现场开场**：候车室内约 20—30 人，室内有供暖。值守员能通过独立行车联络核实港湾方向；旅客语音设备故障，物资管理员正在找待售的供暖箱。原定溪桥下车的乘客先处理自己的下车或改程决定，再核对车上空间。\n\n#### 场景四：保留餐厅，还是少花钱腾地方\n\n- **出场乘客**：溪桥候车的几组同行旅客。先询问实际有多少人要上车、行李和休息需求，再由 DM 告知现有空间是否够用。\n- **他们直接说**：“能一起休息最好，不需要每组一间房。临时铺垫子也行，请先告诉我们会不会很挤。”\n- **现场条件**：人数少、空间够用时直接安排，不必改装。需要腾空间时，本站只有一批约供十人使用的垫子毯子，售价 60 元；隔帘一套 40 元，组件一套 100 元。\n- **现成办法**：按第 4 节选择用餐间方案，花 60 元并暂停堂食；或草原方案，花 200 元并保留堂食。先处理草原窗缝，再落实组件安装。更多休息用品没有现成无限供应，不能只按上述价格翻倍记账就取得货物。\n- **自由发挥**：旅客自带用品只供本人使用时，不必买重复用品；借用、交换或混合布置先取得所有者同意。借来的毯子需要约定归还站点，不能当作永久库存。也可只接能安排的那部分人。\n- **处理结果**：完成布置后再确认能接的同行组，讲明服务并售票，按实际上车人数每人收 10 元。记录空间用途、购入与借用用品；未接上的旅客继续在有供暖的候车室等待。\n\n#### 场景五：一笔 40 元的独立休息生意\n\n- **出场乘客**：獾乘客栗老板与同行小组，属于溪桥这批乘客。车票照付，另愿付合计 40 元购买独立休息区域。\n- **他直接说**：“我们想有一块不被穿来穿去的地方。如果只有隔帘，也请先让我看看布置。”他没有权利替别的旅客决定搬走。\n- **现场条件**：洞穴车厢的安静区是否可用，取决于之前安排；隔帘只有前述一套，若已用于草原区就不能再买出第二套。专用区域会占用真实空间。\n- **现成办法**：有空闲区域时说明位置和安排，对方认可后落实；没有合适空间则拒绝这笔额外服务，仍可正常售票。\n- **自由发挥**：提出半开放隔帘、同行组集中在角落等方案，由栗老板看过条件后协商价格。原本已安排在该处的人须同意搬动，不能为了高价订单直接赶走。\n- **处理结果**：原方案实际完成收 40 元；替代方案按重新谈好的价格收款。占用区域从其他可安排空间中扣除。没谈成不收额外费用，不产生乘客报复事件。\n\n#### 场景六：供暖箱就在旧维修库\n\n- **出场人员**：物资管理员灰桥和装卸员石背，都是站内工作人员。\n- **灰桥先说**：“组件 100 元一套，货单写二号库，可我在新库没找到。你们要的话可以一起核对。”他明确货物归属和售价。\n- **玩家能看见**：货单上的旧维修库标志、仓库登记中的旧库收货记录；问石背也能直接得到旧库位置。按任一线索去旧库即可，不需要先查完三处。\n- **到门口再呈现**：拉门下缘被积雪堵住，站内有可借的铲子与推车。箱上品名、登记数量能核对，旁边其他货箱不会因为角色猜测而变成备用组件。\n- **现成办法**：清理门前积雪，核对货箱，请管理员确认；决定购买则付款，用推车运回，在适合的位置安装。工具用完归还，组件购买后属于团队。\n- **自由发挥**：分头查库、协作搬运、利用已有工具开路都可以；涉及风险的办法先说明实际障碍，再按通用裁定处理。找到了但不需要组件，可以只告诉管理员位置。\n- **处理结果**：购买扣 100 元，安装后对应临时区域可用；只找到则更新物资位置，团队没有免费设备。若已经选择用餐间方案，这件事可不做，不阻止发车。\n\n#### 场景七：修通信，让乘客能向外报信\n\n- **出场人员**：溪桥值守员；候车旅客中有人想告知家人自己改乘安宁列车，不新增一位途中凭空上车的求助者。\n- **值守员直接说**：“行车联络能用，旅客这边的语音箱进水了。维修柜里有接线件，你们愿意帮忙的话我带你们看。”\n- **现场条件**：只处理这台旅客设备。故障是已确定的进水接线损坏，不隐藏第二个密码或失窃零件；站内材料归站方，本次维修经值守员同意使用。\n- **现成办法**：断开该设备电源、排水、更换损坏接线件，恢复后试通话。按常规方案可直接完成。\n- **自由发挥**：用团队已有且确实能联络的设备代为报信，也能满足旅客当前需求；设备本身仍未修复。玩家想索要报酬须先协商，本样例站方未承诺付费。\n- **处理结果**：记录通信恢复或暂由其他方式报信；使用的站方接线件不入团队库存。不修也可通过独立行车联络确认发车，旅客可以在抵达港湾后报信。\n\n### 溪桥至港湾：采购决定能卖什么\n\n#### 场景八：同一张单，可以吃不同的饭\n\n- **出场乘客**：乌鸦墨点、山羊穗穗、野猫岩尾和仓鼠圆子，属于已上车的溪桥旅客。四人合计预算 32 元，要四份热饭、不吃辣；穗穗不吃蛋奶鱼虫，其余三人想尝试虫料理，但也接受普通素饭。\n- **先问再采购**：这张需求在溪桥停站时提出。团队决定接单和菜单后，可以趁本站补货；到途中才缺货时，不能继续远程购买已经离开的站内商品。\n- **现成菜单**：三份蟋蟀胡萝卜饭用大米、食用蟋蟀、胡萝卜各三份，另做一份白菜豆腐饭，用大米、白菜、豆腐各一份。合计四份大米、三份蟋蟀、三份胡萝卜、一份白菜、一份豆腐，普通采购价值 20 元。\n- **另一种选择**：四份白菜豆腐饭用三种食材各四份，普通采购价值同为 20 元。当时库存够哪种就提议哪种，确认菜单后按约定 32 元接单；不用为了讨好物种而强制做虫料理。\n- **途中分餐**：先说明一份纯素、三份另选菜单，玩家自己想办法标记或分开交付。若弄错，先取回未食用的那份并重新分配；需要重做时扣真实用料，不重复收钱，也不随机毁掉全单。\n- **处理结果**：四份约定热饭交付收 32 元，扣实际用料。若库存不足四份，可以在接单前商量只做部分、换菜单或拒单；不能把少做的数量当成整单完成。已接单无法履约则协商补做、减费或退款。\n\n### 港湾：把本次经营收好，留下新的设施\n\n**抵站呈现**：港湾站正常营业，旅客取行李、下车，站外有住宿与商店。风雪仍可能继续，前述已知的港湾接收条件不突然取消。\n\n主持人依次问团队三件事：还有哪些已接订单未交付、有哪些乘客物品需要归还、临时区域准备恢复还是保留。苔花取回自己的货箱；借来的用品按约定交还；买来的组件、隔帘与垫子继续属于团队。原有目的站、改程票款及本事件新票款分别核对，避免再次给已购票乘客收费。\n\n本次结算列出实际票款与餐费、采购支出、剩余库存、添置设施和未完约定。上述场景单独完成没有额外奖金；所得来自已确认的交易。清理用餐间即可恢复堂食，草原临时区也可收起用品重新开放。团队随后决定补货、翻新或继续接客，进入下一段旅程。\n"}</script>

const escape=text=>text.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function inline(text){
return escape(text).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(match,label,target)=>{
const file=target.replace(/^\.\//,'').split('#')[0],index=documents.findIndex(doc=>doc.fileName===file);
return index>=0?`<a href="#" data-doc="${index}">${label}${index===7?'（主持人剧透）':''}</a>`:label;
}).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}
function markdown(source){
const lines=source.split(/\r?\n/),out=[];
let index=0,headingIndex=0;
const isTableRule=line=>/^\s*\|?\s*:?-{3,}/.test(line);
const cells=line=>line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(cell=>cell.trim());
while(index<lines.length){
const line=lines[index];
if(!line.trim()){index++;continue}
const heading=/^(#{1,6})\s+(.+)$/.exec(line);
if(heading){out.push(`<h${heading[1].length} id="section-${headingIndex++}">${inline(heading[2])}</h${heading[1].length}>`);index++;continue}
if(line.startsWith('|')&&index+1<lines.length&&isTableRule(lines[index+1])){
const titles=cells(line);index+=2;const rows=[];
while(index<lines.length&&lines[index].startsWith('|')){rows.push(`<tr>${cells(lines[index++]).map(cell=>`<td>${inline(cell)}</td>`).join('')}</tr>`)}
out.push(`<div class="tableWrap"><table><thead><tr>${titles.map(title=>`<th scope="col">${inline(title)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`);continue;
}
if(/^>\s?/.test(line)){out.push(`<blockquote>${inline(line.replace(/^>\s?/,''))}</blockquote>`);index++;continue}
if(/^[-*]\s+/.test(line)||/^\d+\.\s+/.test(line)){
const ordered=/^\d+\.\s+/.test(line),pattern=ordered?/^\d+\.\s+/:/^[-*]\s+/,items=[];
while(index<lines.length&&pattern.test(lines[index]))items.push(`<li>${inline(lines[index++].replace(pattern,''))}</li>`);
out.push(`<${ordered?'ol':'ul'}>${items.join('')}</${ordered?'ol':'ul'}>`);continue;
}
if(/^---+$/.test(line.trim())){out.push('<hr>');index++;continue}
out.push(`<p>${inline(line)}</p>`);index++;
}
return out.join('');
}

  if(!button.isConnected)return;
  const rows=button.closest('[data-archive]').querySelector('[data-archive-rows]');
  rows.insertAdjacentHTML('beforeend',result.items.map(row=>archiveRow(key,row)).join('')||(result.total===0?'<p class="small">暂无历史记录。</p>':''));
  if(result.nextOffset===undefined)button.remove();else{button.dataset.offset=result.nextOffset;button.textContent='查看更多';}
 }finally{button.disabled=false;}
}
function showPageError(error){
 const toast=document.createElement('div');toast.className='pageToast';toast.setAttribute('role','status');toast.textContent=error.message;document.body.append(toast);setTimeout(()=>toast.remove(),6000);
}
app.addEventListener('click',event=>{const button=event.target.closest('[data-more-archive]');if(button)void loadArchive(button).catch(showPageError);});

function documentView(index){
const doc=documents[index],headings=[...doc.content.matchAll(/^(#{1,6})\s+(.+)$/gm)];
app.innerHTML=header(doc.title)+`<section class="card"><div class="buttons"><button class="ghost" data-back>返回</button><button class="ghost" data-view="home">旅途指南</button><button class="ghost" data-view="list">全部资料</button></div>${index===7?'<p class="notice">主持人资料 · 包含事件幕后事实与场景答案</p>':''}<details><summary>章节目录</summary><nav class="documentToc" aria-label="章节">${headings.map((heading,i)=>heading[1].length===2?`<a href="#section-${i}" data-anchor="section-${i}">${escape(heading[2])}</a>`:'').join('')}</nav></details></section><article class="card document">${markdown(doc.content)}</article><div class="buttons"><button class="secondary" data-back>返回之前页面</button></div>`;
if(section){const target=headings.findIndex(heading=>heading[2].replace(/^\d+\.\s*/, '')===section);if(target>=0)document.getElementById(`section-${target}`).scrollIntoView()}
}
function render(){window.scrollTo(0,0);if(view==='home')home();else if(view==='guide')guide();else if(view==='list')list();else if(view==='characters')characterCards();else documentView(view)}
function open(next,heading=''){history.push({view,stage,role,section,scroll:window.scrollY});view=next===2?'characters':next;if(next===7)role='dm';section=heading;render()}
app.addEventListener('click',event=>{
const target=event.target.closest('[data-view],[data-doc],[data-stage],[data-role],[data-back],[data-anchor],[data-animal]');if(!target)return;
event.preventDefault();
if(target.hasAttribute('data-back')){const previous=history.pop();if(previous){({view,stage,role,section}=previous);render();window.scrollTo(0,previous.scroll)}else{view='home';section='';render()}return}
if(target.dataset.anchor){document.getElementById(target.dataset.anchor).scrollIntoView();return}
if(target.dataset.animal!==undefined){selectedAnimal=Number(target.dataset.animal);characterCards();document.getElementById("combination").scrollIntoView();document.getElementById("profession").focus({preventScroll:true});return}
if(target.dataset.role){role=target.dataset.role;render();return}
if(target.dataset.stage!==undefined){const scroll=window.scrollY;stage=Number(target.dataset.stage);guide();window.scrollTo(0,scroll);return}
if(target.dataset.doc!==undefined){open(Number(target.dataset.doc),target.dataset.section||'');return}
open(target.dataset.view);
});
app.addEventListener('change',event=>{if(event.target.id==='profession'){selectedProfession=Number(event.target.value);const scroll=window.scrollY;characterCards();window.scrollTo(0,scroll);document.getElementById('profession').focus({preventScroll:true})}});
app.addEventListener('toggle',event=>{
 const details=event.target;if(!details.open)return;
 if(details.hasAttribute('data-lazy-gallery')){
  const gallery=details.querySelector('[data-gallery]');if(gallery.childElementCount)return;
  const used=new Set(Object.values(characterArt.playable));
  gallery.innerHTML=characterArt.avatars.filter(item=>!used.has(item.key)).map(item=>`<div class="galleryPortrait"><img loading="lazy" decoding="async" src="${item.src}" alt="${item.name}" width="96" height="96">${item.name}</div>`).join('');
 }
 if(details.hasAttribute('data-lazy-rules')){const article=details.querySelector('[data-animal-rules]');if(!article.childElementCount)article.innerHTML=markdown(documents[2].content);}
},true);
document.addEventListener('aurai:messageupdate',()=>{if(view==='home')home()});
render();

})();
</script>
</body>
</html>
