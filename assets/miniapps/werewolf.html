updateSection('actions',[host?.cards,busy],()=>{ $('actions').replaceChildren();(host?.cards||[]).forEach(card=>{const b=card.buttons[0];if(!b)return;const form=document.createElement('form');form.className='aurai-stack';form.append(text('h3',card.title,'aurai-title'),text('p',card.body,'aurai-muted'));let selected=new Set();const options=document.createElement('div');options.className='ww-options';(b.selection?.options||[]).forEach(o=>{const label=document.createElement('label'),input=document.createElement('input');input.type=b.selection.mode==='multiple'?'checkbox':'radio';input.name='choice';if(input.type==='radio')input.required=true;input.onchange=()=>{if(input.type==='radio')selected=new Set([o.id]);else input.checked?selected.add(o.id):selected.delete(o.id);button.disabled=busy||selected.size!==(b.selection.maxSelections||1)};label.append(input,text('span',o.label));options.append(label)});form.append(options);const button=text('button',b.label,'aurai-button aurai-button--primary aurai-button--block');button.disabled=busy||!!b.selection;form.append(button);form.onsubmit=ev=>{ev.preventDefault();submit('aurai:clickButton',{messageId:card.messageId,buttonId:b.id,value:b.selection?.mode==='multiple'?[...selected]:[...selected][0],revision:card.revision,participantRevision:card.participantRevision})};$('actions').append(form);card.buttons.slice(1).forEach(extra=>{const action=text('button',extra.label,'aurai-button');action.type='button';action.disabled=busy;action.onclick=()=>submit('aurai:clickButton',{messageId:card.messageId,buttonId:extra.id,revision:card.revision,participantRevision:card.participantRevision});$('actions').append(action)})});});
 updateSection('rules',[s.roles,s.rules,!!host,setup],()=>{ $('rules').replaceChildren();$('rules').parentElement.hidden=!host||setup;const roleGroups=new Map();(s.roles||[]).forEach(({id,count,skills,...r})=>{const key=JSON.stringify({...r,skills:skills.map(({id,...skill})=>skill)});const group=roleGroups.get(key);if(group)group.count+=count;else roleGroups.set(key,{...r,count})});roleGroups.forEach(r=>$('rules').append(text('p',r.name+' × '+r.count+'：'+r.description)));if(s.rules)$('rules').append(text('p',(s.rules.win==='edge'?'屠边':'屠城')+'；'+(s.rules.sheriff?'有警长':'无警长')+'；'+s.rules.notes+'；阶段和结果由主持人裁定。'));});updateSection('log',s.log,()=>{$('log').replaceChildren();(s.log||[]).forEach(v=>$('log').append(text('p',v,'aurai-muted')));});const isPostgame=s.phase==='postgameDiscussion',canManage=!!host&&(host.viewerId===host.ownerId||host.viewerId===s.hostId);
 $('stop').hidden=!canManage||!s.phase||['setup','finished'].includes(s.phase);$('stop').textContent=isPostgame?'结束赛后环节':'结束本局';

   function hostPlayers(){const s=AuraiHTML.messageState,h=s._miniapp,v=h.hostView||h.own;return v.actors.map(id=>v.players.find(p=>p.id===id));}
  function sPlayerSubmitted(id){const s=AuraiHTML.messageState,h=s._miniapp,v=h.hostView||h.own;return v.actions[id]!==undefined;}
async function submit(action,data){if(busy)return;busy=true;render();try{await AuraiHTML.submitEvent({eventId:crypto.randomUUID(),action,data,notifyAi:false})}catch(e){AuraiGameBridge.reportError(String(e.message||e))}finally{busy=false;render()}}
 $('nextStep').onclick=()=>{if(configuredCount!==selection.size){const total=selection.size,wolves=Math.floor(total/3);defs=[newRole('wolf'),newRole('seer')];defs[0].count=wolves;if(total>=6)defs.push(newRole('witch'));if(total>=9)defs.push(newRole('hunter'));if(total>=12)defs.push(newRole('guard'));const villager=newRole('villager');villager.count=total-defs.reduce((n,r)=>n+r.count,0);defs.splice(1,0,villager);defs=defs.flatMap(r=>Array.from({length:r.count},()=>newRole(r.type)));configuredCount=total;$('roles').replaceChildren();roleEditor()}setupStep=2;render();saveDraft();AuraiHTML.requestResize()};$('previousStep').onclick=()=>{setupStep=1;render();saveDraft();AuraiHTML.requestResize()};$('randomRoles').onclick=()=>{const ids=[...selection];for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}defs.forEach((r,i)=>r.assigned=i<ids.length?[ids[i]]:[]);roleEditor();AuraiHTML.requestResize()};document.addEventListener('aurai:restore',()=>{const raw=$('setupDraftRows').value;if(raw){const draft=JSON.parse(raw);defs=draft.roles;selection=new Set(draft.players);nextRoleKey=draft.nextRoleKey;setupStep=draft.setupStep;configuredCount=draft.configuredCount;$('host').value=draft.hostId;roster='';if(AuraiHTML.messageState._miniapp)roleEditor();render()}});$('host').onchange=()=>{const id=$('host').value;selection.delete(id);defs.forEach(r=>r.assigned=r.assigned.map(v=>v===id?'':v));roster='';render();roleEditor()};$('addRole').onclick=()=>openRolePicker(-1);
 $('setup').addEventListener('change',saveDraft);$('setup').addEventListener('input',saveDraft);$('setup').addEventListener('invalid',e=>{let detail=e.target.closest('details');while(detail){detail.open=true;detail=detail.parentElement.closest('details')}},true);$('setup').onsubmit=e=>{e.preventDefault();const assignments={};defs.forEach((r,i)=>r.assigned.filter(Boolean).forEach(id=>assignments[id]='r'+i));submit('configure',{roles:defs.map(({assigned,draftKey,...r},i)=>({...r,id:'r'+i,skills:r.skills.map((a,j)=>({...a,id:'r'+i+'s'+j}))})),assignments,players:[...selection],hostId:$('host').value,rules:{notes:$('ruleNotes').value,win:$('win').value,lastWords:$('lastWords').value,sheriff:$('sheriff').checked,doubleSaveKills:$('doubleSaveKills').checked,winnerMvp:$('winnerMvp').checked,loserMvp:$('loserMvp').checked,funniest:$('funniest').checked,postgameDiscussion:$('postgameDiscussion').checked}})};$('stop').onclick=()=>submit('stop',null);$('finishCollection').onclick=()=>{const players=hostPlayers();$('finishCollectionDetail').textContent='结束后将关闭本轮行动卡。未提交：'+players.filter(p=>!sPlayerSubmitted(p.id)).map(p=>p.seat+'号').join('、')+'。不会自动按弃权或未使用技能处理。';$('collectionDialog').showModal()};$('collectionCancel').onclick=()=>$('collectionDialog').close();$('collectionConfirm').onclick=()=>{$('collectionDialog').close();submit('finishCollection',{})};document.addEventListener('aurai:messageupdate',render);render();
