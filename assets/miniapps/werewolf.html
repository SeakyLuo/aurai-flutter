ous targets without applying suggestion. Unsupported effects require your explicit deaths/privateMessages and manual resolution. Rules.notes includes house rules; you must check linked deaths and wolf-first victory yourself. Supply deathCauses for manual adjudications so poisoned or linked hunters cannot shoot. No automatic victory or sheriff selection. After resolve, arrange the next collect yourself. All originally signed-up candidates, including withdrawals, are ineligible to vote in elections. A one-candidate election can be resolved directly. For PK exclude PK candidates from voters. For sheriff-last speech pass exact actor order. Night observations are privateMessages, never announcement. Preserve this protocol, do not rewrite source to advance the match.';
