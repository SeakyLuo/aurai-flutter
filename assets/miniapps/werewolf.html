function nightStepKey(r){return r.type==='seer'||r.type==='shadowSeer'?'seer':r.type==='wolf'?'wolfVote':r.id;}

 if(s.kind==='night')startNightProgress();

 s.actors.forEach(function(id){var value=s.actions[id];if(value===undefined)return;var step=s.nightProgress.steps.filter(function(v){return v.id===nightStepKey(role(player(id)));})[0],result;

 else if(value.skill)result=ability(player(id),value.skill).name+' '+value.targets.map(function(target){return named(player(target));}).join('、');

 });

 else if(step.results){var ids=Object.keys(step.results),spectator=observerIds.indexOf(viewer)>=0,canWatch=step.id!=='wolfVote'||s.channels.every(function(c){return c.id!=='team:wolf'||c.spectatorsVisible!==false;}),visible=ids.filter(function(id){return viewer===s.hostId||viewer===ctx.ownerId||spectator&&canWatch||viewer===id||step.id==='wolfVote'&&s.channels.some(function(c){return c.id==='team:wolf'&&channelReaders(c).indexOf(viewer)>=0;});});

function hostWake(text){controls[s.hostId]=true;note(text,[s.hostId],true);}

function skillDescription(a){var target=a.targets+'名玩家',effects={wolfKill:'与狼队共同选择'+target+'袭击，平票空刀。',inspectTeam:'查验'+target+'的阵营。',inspectRole:'查验'+target+'的身份。',protect:'守护'+target+'免受狼队袭击。',save:'救下'+target+'遭狼队袭击的玩家。',poison:'毒杀'+target+'。',kill:'带走'+target+'。',silence:'使'+target+'次日禁言。',link:'连接'+target+'的生死。',reveal:'公开'+target+'的身份。'};return (a.firstNight?'仅首夜':a.timing==='death'?'出局时可':'每夜可')+effects[a.effect]+(a.timing==='death'&&a.effect==='kill'?'被毒杀、连带出局或自爆时不能发动。':'')+(a.noRepeat?'不能连续选择同一目标。':'');}

function skillQuestion(p,skills){var name=ownIdentity(p).name;if(!skills.length)return name+'，本轮没有可用技能。';if(role(p).type==='witch'){var medicines=skills.map(function(a){return a.effect==='save'?'一瓶解药':a.effect==='poison'?'一瓶毒药':a.name;});return name+'，你有'+medicines.join('和')+'，'+(skills.length===1?'要使用吗？':'今晚要使用哪瓶？')+(skills.length>1?'每夜最多使用一种药。':'');}var a=skills[0],question=name+'，'+(a.timing==='death'?'你要发动':'今晚要使用')+(skills.length===1?a.name:'技能')+'吗？';if(skills.some(function(a){return a.noRepeat;}))question+='不能连续选择同一目标。';if(a.timing==='death'&&a.effect==='kill')question+='被毒杀、连带出局或自爆时不能发动。';return question;}

function nightSuggestion(){var tally={},guard=[],save=[],poison=[],kills=[],feedback=[],unsupported=[];
 Object.keys(s.nightActions).forEach(function(id){var v=s.nightActions[id];if(v==='skip')return;var p=player(id),a=ability(p,v.skill);
 if(a.effect==='wolfKill')tally[v.targets[0]]=(tally[v.targets[0]]||0)+1;
 else if(a.effect==='protect')guard=guard.concat(v.targets);
 else if(a.effect==='save')save=save.concat(v.targets);
 else if(a.effect==='poison')poison=poison.concat(v.targets);
 else if(a.effect==='kill')kills=kills.concat(v.targets);
 else if(a.effect==='inspectTeam'||a.effect==='inspectRole')feedback.push({actorId:id,text:v.targets.map(function(target){var q=player(target);return named(q)+'：'+(a.effect==='inspectRole'?role(q).name:role(q).team==='wolf'?'狼人阵营':role(q).team==='good'?'好人阵营':'第三方或待定阵营（请主持按查验规则反馈）');}).join('、')});

var hostProtocol='You are the referee, not a player. The app only collects choices, privately stores roles/actions, orders speeches and counts votes. You and the instance creator may submit player actions with data.submitForPlayerId naming that player: submit data:{submitForPlayerId,context:{seq,step:fill|target|ballot},value}, speechEnded data:{submitForPlayerId,context:{seq,step:speech}}, withdraw data:{submitForPlayerId}, explode data:{submitForPlayerId}. Use the current seq and request options from this private view. Proxy submissions update native cards and weighted votes atomically, close completed cards and advance the same workflow; phase, turn, role and duplicate restrictions still apply. Record the player choices or your explicit game ruling; do not invent a choice merely to force progress. Players keep their own submission rights. Decide all skill effects, deaths, winners and phase transitions from roles/descriptions/rules. Never reveal secret roles/actions in public. Read readHtmlProgram before submitHtmlProgramEvent. collect data:{kind:night|deathSkill|signup|speech|vote|election|badge|direction|custom,purpose:day|election|pk|lastWords (speech/PK),actors:[playerIds],prompt:string,nominees:[playerIds] (vote/election/badge),requests:[{actorId,body,options:[{id,label,value}],count:integer}] (optional for night/deathSkill, required for custom)}. Standard night/deathSkill without requests builds existing configured skill and target cards (including skip); multi-target and special skills use explicit requests and manual adjudication. Each configured role has nightOrder: an integer from 0 to 99, smaller acts earlier; null means no scheduled night action. Follow the configured roles in ascending nightOrder, and the matching nightProgress steps. Equal values share a timing slot; collect them separately unless their rules require a shared action. Only call first-night setup skills on the first night. Do not impose a fixed wolf/seer/witch/guard order. At the wolf slot, start collect kind:night with only the eligible ordinary wolves and no explicit requests: the program wakes their private discussion first. Each wolf-channel contribution wakes the eligible teammates and you so you can follow the discussion. One message per wolf is participation, not completion: discussion stays open and players may address objections or revise their plan. Review the actual discussion before calling openWolfVote data:{} as host. Give each wolf a chance to contribute and respond to substantive objections; do not start voting merely because everyone has spoken once. When the discussion is sufficient, start the shared ballot without requiring unanimous agreement; remaining differences are decided by the vote. Do not interrupt an ongoing useful exchange or invent player contributions. A wolf contribution never creates the ballot itself. Collect the other roles at their configured nightOrder, one actor at a time. As host, author the question addressed to that player; audience controls visibility and interaction.actors permits only that player to answer. Use the native question/selection card for that role, not askUser. For witch ask whether to use her remaining antidote, poison or neither, with the actual permitted victim/targets; require explicit confirmation. Do not wake all night roles simultaneously. Announce only the agreed public order, never the secret identities of participants. Each completed night collection accumulates private nightActions and suggestion. suggestion computes wolf plurality (tie=no kill), guard/save/doubleSaveKills, poison, inspection and kill; deathSkill suggests hunter shots, blocked for poison/linked/explode causes known to app. Use custom requests to collect special actions. When shadowSeer is configured, seer and shadowSeer must receive identical private inspection cards via explicit custom requests; both see the seer identity, never reveal which is shadowSeer before game end. Reply with actual team to seer and inverted good/wolf team to shadowSeer. Adjudicate third-party inspection from house rules; never use ordinary inspection suggestions for shadowSeer. Built-in single-skill, single-target cards directly choose a player or skip; Standard wolfKill collection without custom requests sends ONE shared wolf-team ballot, not one card per wolf. Its audience is voting wolves, host, creator and spectators unless the wolf channel disables spectator visibility; only the specified wolves can vote. Use collect kind:night with the wolf actor IDs and omit requests for standard wolf attacks. Before voting, wolves read their private channels and discuss the target with sendChannelMessage in team:wolf; do not skip team discussion or invent discussion for them. Every wolf should contribute a useful suggestion or response before casting its vote. Do not proxy votes merely to bypass discussion. Wolves then use clickInteractiveMessage on the same card; proxy submit uses context:{seq,step:ballot}, value:targetPlayerId or skip. The app maps each vote to that wolf own skill, retains native results and computes the usual plurality/tie suggestion. Never collect ordinary wolf attacks as separate private cards. Multiple skills or targets choose a skill, then its targets; collection keeps the resulting skill/targets atomic. Only collect when waiting and pending is null. resolve data:{announcement?:publicText,deaths:[playerIds],deathCauses?:{playerId:attack|poison|linked|explode|shot|vote|host},privateMessages?:[{actorId,text}],sheriff?:playerId|null,lovers?:[playerId,playerId],loversSpectatorsVisible?:boolean,day?:integer,winner?:string,winnerIds?:[actualWinningPlayerIds],applySuggested?:boolean,consumeSkills?:boolean} applies your explicit decisions, clears pending and stays waiting unless winner ends game. Resolve any pending event before collecting. Omit announcement when there is no actual public ruling or result; private-only feedback needs no public announcement. Never fill announcement with phase ly eligible voters. All voters operate that same message; it preserves the individual choices and weighted totals after completion. Do not publish a separate text vote table or ask for votes in chat. All originally signed-up candidates, including withdrawals, are ineligible to vote in elections. A one-candidate election can be resolved directly. For PK exclude PK candidates from voters. The first day/election speech without a sheriff chooses a random starting actor and cycles in seat order. Read the actual actors and speaker after collecting. Other speeches preserve the supplied actor order; for sheriff-last speech pass exact actor order. For sheriff speech order, collect kind:direction with actors:[sheriffId] to ask the sheriff using the existing private question card. After the selection, arrange collect kind:speech in the chosen seat direction with the sheriff last; do not replace this choice with a chat-only question. Keep private feedback concise: include the night or round, player and actual result only. When providing the witch victim, state only the actual victim; do not repeat the medicine inventory or restrictions already shown on the action card. Submit necessary skill feedback in the night adjudication before sunrise, not in a separate daytime message. Do not append confidentiality reminders, waiting instructions or a referee-feedback label. This applies to sendChannelMessage and resolve privateMessages. Every inspection requires a concrete privateMessages result naming the inspected player and result; do not finish the night with only a public announcement. For manual/custom witch or other skills, privateMessages must confirm the actual action and target to its actor. Submitted choices are automatically retained in player knowledge; they are action receipts, not adjudicated effects. Night observations are privateMessages, never announcement. Keep player-facing messages factual and concise. Announcements state only actual results or the next action. Ques <section class="aurai-ui aurai-stack">
 <header class="ww-head"><div class="aurai-stack"><h2 class="aurai-title" id="matchTitle">狼人杀</h2><p class="aurai-muted" id="phase"></p></div></header><p id="hint" class="aurai-muted"></p>
 <p class="ww-inline aurai-muted" id="setupHint">打开详情配置角色、技能和玩家。</p>

  <label class="aurai-field">主持人<select id="host" required></select></label><p class="ww-small">支持 3–24 位玩家，主持 AI 不参赛。</p>
  <fieldset><legend>参与人 <span id="count" class="aurai-muted"></span></legend><p class="ww-small">选择参赛玩家。</p><div id="members" class="ww-options"></div></fieldset>
  <button type="button" id="nextStep" class="aurai-button aurai-button--primary aurai-button--block">下一步</button></div>
  <div id="setupStepTwo" class="aurai-stack" hidden><div class="ww-role-heading"><h3 class="aurai-title">配置角色</h3><button type="button" id="randomRoles" class="aurai-button" title="随机分配角色" aria-label="随机分配角色"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><g fill="currentColor" stroke="none"><circle cx="8" cy="8" r="1"/><circle cx="16" cy="8" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="8" cy="16" r="1"/><circle cx="16" cy="16" r="1"/></g></svg></button></div>
  <div id="roles" class="aurai-stack"></div><button type="button" class="aurai-button" id="addRole">添加角色</button>

  <details class="aurai-stack ww-role"><summary>规则设置</summary><div class="ww-columns"><label class="aurai-field">胜负规则<select id="win"><option value="edge">屠边</option><option value="city">屠城</option></select></label><label class="aurai-field">遗言<select id="lastWords"><option value="standard">首夜及白天出局</option><option value="all">所有出局玩家</option><option value="none">不留遗言</option></select></label></div>
  <label class="aurai-row"><input type="checkbox" id="sheriff" checked><span>启用警长竞选（1.5 票、选择发言方向、移交警徽）</span></label><label class="aurai-row"><input type="checkbox" id="doubleSaveKills" checked><span>同守同救仍出局</span></label>
  <label class="aurai-row"><input type="checkbox" id="firstNightProtection" checked><span>首刀保护（上一局首夜狼刀出局者，本局首夜免狼刀）</span></label>
   <label class="aurai-row"><input type="checkbox" id="winnerMvp" checked><span>赛后评选 · 胜方 MVP</span></label>
   <label class="aurai-row"><input type="checkbox" id="loserMvp" checked><span>赛后评选 · 败方 MVP</span></label>
   <label class="aurai-row"><input type="checkbox" id="funniest" checked><span>赛后评选 · 最下饭奖</span></label>
   <label class="aurai-row"><input type="checkbox" id="postgameDiscussion" checked><span>赛后讨论（复盘与互相吐槽）</span></label>
      <details><summary>夜间行动顺序</summary><div id="nightOrders" class="aurai-stack"></div></details>
<label class="aurai-field">补充规则<textarea id="ruleNotes" rows="3" maxlength="4000" placeholder="特殊技能、胜负与遗言规则"></textarea></label>
  </details><input type="hidden" id="setupDraftRows"><div class="aurai-actions ww-step-actions"><button type="button" id="previousStep" class="aurai-button">上一步</button><button class="aurai-button aurai-button--primary" id="start">开始对局</button></div>
  </div>
 </form>
 <section id="template" class="ww-full aurai-stack" hidden><h3 class="aurai-title">角色说明</h3><p class="ww-small">发送后可自由添加角色、调整人数，并指定玩家或随机分配。预言家、女巫等同一神职只能配置一位。</p><div id="templateRoles" class="aurai-stack"></div></section>
 <div id="own" class="aurai-stack" hidden></div><div id="actions" class="aurai-stack ww-actions"></div>
 <button id="finishCollection" type="button" class="aurai-button ww-full" hidden>结束本轮收集</button>
 <section id="matchPanels" class="aurai-stack">
  <div id="timelinePanel" class="ww-full aurai-stack" role="tabpanel" aria-labelledby="timelineTab" hidden>
   <label class="aurai-field ww-filter">查看记录<select id="timelinePlayer"><option value="all">全部玩家</option></select></label>
   <div id="timelineRows" class="aurai-stack"></div>
  </div>
  <div id="boardPanel" class="aurai-stack" role="tabpanel" aria-labelledby="boardTab">
   <div id="seats" class="ww-seats"></div><div id="rules" class="aurai-stack"></div>
  </div>
 </section>

  <button type="button" id="timelineTab" role="tab" aria-controls="timelinePanel" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>时间线</span></button>
 </nav>
</section>
<dialog id="collectionDialog" class="ww-picker"><div class="aurai-stack"><h3 class="aurai-title">结束本轮收集？</h3><p id="finishCollectionDetail" class="aurai-muted"></p><div class="aurai-row"><button id="collectionCancel" type="button" class="aurai-button">取消</button><button id="collectionConfirm" type="button" class="aurai-button aurai-button--primary">结束收集</button></div></div></dialog>
<dialog id="rolePicker" class="ww-picker"><div class="ww-picker-head"><button type="button" class="aurai-button" id="rolePickerBack" hidden>返回</button><h3 class="aurai-title" id="rolePickerTitle">选择角色</h3><button type="button" class="aurai-button" id="rolePickerClose" aria-label="关闭">×</button></div><div id="rolePickerBody" class="aurai-stack"></div></dialog>
<script>
(()=>{
 const $=id=>document.getElementById(id),effects={wolfKill:'狼队共同袭击',inspectTeam:'查看阵营',inspectRole:'查看身份',protect:'守护',save:'解救刀口',poison:'毒杀',kill:'带走',silence:'次日禁言',link:'连接生死',reveal:'公开身份'};
 const skill=(name,effect,order,more={})=>({name,effect,timing:'night',order,targets:1,uses:0,allowSelf:false,noRepeat:false,firstNight:false,...more});
 const presets={wolf:{name:'狼人',team:'wolf',category:'god',count:2,description:'每夜与狼队共同选择一人袭击。同票空刀。白天隐藏身份，通过发言和投票获胜。\n玩家策略（以本局规则为准）：先在许可的狼队私密频道讨论刀口及次日分工，再各自实际投票。比较移除查验、保人或关键选票的收益与暴露风险；悍跳、冲锋、倒钩、深水按局势配合，不机械全队站同一边。公开发言用好人可知的信息构建连贯判断，不泄露队友和夜间计划。\n狼队决策：\n1. 夜间私密讨论同时决定刀口与次日打法：谁上警、是否悍跳、谁留警下，查验声称和警徽流、支持或倒钩分工、退水及被查杀应对；按实际局势调整，不强制套固定人数或打法。报名后退水不恢复本局警选投票权。\n2. 刀口围绕本局胜利条件和剩余轮次，比较信息增量、技能与选票收益、守救风险、死亡反击及白天可放逐性。有两个以上合法目标时，至少比较两个，不把不确定底牌说成确认身份。\n3. 警长不是底牌，也不是默认刀口。警徽可移交时，持徽者死亡不等于消除1.5票；公开金水、已有查验和遗言不会因其死亡消失。区分持续查验的预言家、仍能行动的神职和只承接信息的持徽者。刀警长须说明与替代目标相比的具体收益，不能只说有警徽或能归票。\n4. 守卫不能连守只限制其真实上一夜目标；未知守谁不能推导当前目标安全。公开警长和神职可能成为保护焦点，应比较风险；连续平安后结合合法可知反馈调整，不机械追刀，也不把空刀当保护成功。\n5. 对队友的反对意见先比较事实、收益和风险，再确认统一选择；不以避免分票为由跳过比较，也不凭空声称多数或全队一致。夜刀考虑守救，死亡带走按该技能实际效果与限制判断。\n6. 只在许可的狼队私密频道讨论；公开发言保持好人可知视角。各自实际提交，提交前核对目标、当轮及原因一致，讨论和口头同意不代替行动。',skills:[skill('袭击','wolfKill',1,{allowSelf:true})]},villager:{name:'村民',team:'good',category:'villager',count:2,description:'没有夜间技能，通过发言和投票找出狼人。\n玩家策略（以本局规则为准）：提供独立判断和有效选票，不因无技能而划水或主动求出。比较身份声称、查验理由、发言变化和关键票型；站错边有新证据就解释并修正。不要把声音强势、银水、投过狼人或支持真预言家当作身份保证。',skills:[]},seer:{name:'预言家',team:'good',category:'god',count:1,description:'每夜查验一名其他玩家，得知其阵营。结果仅自己可见。\n玩家策略（以本局规则为准）：争取让真实查验形成可信信息链。通常可上警报验人、首验理由、后续查验计划及归票倾向；信息不足的首验如实说明随机，不编造依据。查验优先解决关键未知和阵营关系，警徽流随证据调整，不机械固定警上警下各一人；预先说明合法警徽移交如何传递后续查验。支持者可能是倒钩，反对者也可能误判。',skills:[skill('查验','inspectTeam',0)]},witch:{name:'女巫',team:'good',category:'god',count:1,description:'解药和毒药各一瓶，每夜最多使用一种，不可自救；解药用完后不再得知刀口。\n玩家策略（以本局规则为准）：先核对药量、刀口知情、自救和同守同救规则。首夜救人可保人数但不是必救，银水不等于铁好。毒药比较狼嫌疑、误伤神职的成本与不用药的轮次风险，不凭情绪用药。隐藏身份时避免泄露未公开刀口；需要公开时准确说明实际用药，不声称救治证明阵营。',skills:[skill('解药','save',2,{uses:1}),skill('毒药','poison',2,{uses:1})]},hunter:{name:'猎人',team:'good',category:'god',count:1,description:'出局时可带走一人；被毒杀不能发动。\n玩家策略（以本局规则为准）：有开枪能力仍需正常找狼，不靠威胁代替证据。跳身份或暂藏依放逐风险和局面决定，不故意聊差求出。发动时重新核对死因、资格和存活目标，以最新发言、票型及剩余人数选枪口；证据不足可权衡不开枪，不机械报复投自己的人。',skills:[skill('开枪','kill',0,{timing:'death',uses:1})]},guard:{name:'守卫',team:'good',category:'god',count:1,description:'每夜守护一人，可以自守，不能连续两夜守护同一人。\n玩家策略（以本局规则为准）：保存每夜守护目标，不能连守；结合可信查验、神职价值、上一夜刀口和狼队可能转刀选择保护。首夜空守、自守均需考虑救药重叠，不把某路线写成必选。平安夜不能单独证明守中了谁；暴露身份时兼顾自身与关键角色，避免在未公开身份时泄露守护记录。',skills:[skill('守护','protect',0,{allowSelf:true,noRepeat:true})]}};
 Object.assign(presets,{
  shadowSeer:{name:'灯影预言家',team:'good',category:'villager',count:1,description:'好人平民类身份，每夜可查验一名玩家，结果与真实阵营相反：好人显示狼人，狼人显示好人。自己与真正的预言家均看到预言家身份牌，不能直接得知真假。\n玩家策略（以本局规则为准）：按本局私密身份说明和主持反馈行动；不要借源码、角色定义或接口差异判定自己属于哪一种预言家。比较已公开的查验、死亡和票型验证解释，不自动倒置所有结果或把猜测当确证。',skills:[]},
  mechanicalWolf:{"name":"机械狼","team":"wolf","category":"god","count":1,"description":"任意夜间可学习一名玩家，整局一次，得知真实身份并获得对应能力至游戏结束。与其他狼人互不知身份；其他狼人全部出局后才获得狼刀。学习村民无技能；通灵师次夜起查具体身份；女巫次夜起获得一瓶毒药；守卫次夜起获得一次免狼刀和毒药的守护；猎人当夜起获得出局开枪；狼人获得一次双刀，取得狼刀后可使用，同目标双刀无视解药和守护。\n玩家策略（以本局规则为准）：学习目标要比较能力收益、行动生效时点及当前阵营缺口，不把高收益身份当作已确认。与狼队互不知身份时不擅自取得名单或加入狼聊；获得新能力后重新核对次数与目标限制，接刀资格以主持反馈为准。","skills":[],"independentWolf":true},
  gargoyle:{"name":"石像鬼","team":"wolf","category":"god","count":1,"description":"不能自爆，与其他狼人互不知身份，起初不参与狼刀。每夜最后行动，查验一名玩家的具体身份；其他狼人全部出局后可夜间袭击。\n玩家策略（以本局规则为准）：私密查验优先补足关键神职和残局信息，公开发言保持合理的闭眼视角。不能因知道身份就声称普通玩家也有依据；未获队友身份或狼刀资格前不擅自狼聊、指刀。","skills":[],"independentWolf":true},
  hatefulHunter:{"name":"憎恶猎人","team":"wolf","category":"god","count":1,"description":"狼狼大逃亡板子的猎人阵营角色，每夜猎杀一名玩家；出局时可开枪带走一人，被女巫毒杀时不能开枪。该板子的阵营和胜负条件由主持按开局规则裁定，不套用普通狼人板子。\n玩家策略（以本局规则为准）：先明确本板子的独立阵营、胜负边界及有效猎杀目标；夜间行动和出局开枪分别核对资格。结合已知信息与厚皮机制安排轮次，不套普通狼队的团队视角。","skills":[],"independentWolf":true},
  violentWolf:{"name":"暴狼","team":"wolf","category":"god","count":1,"description":"每夜参与狼队袭击；白天发言时可以自爆，自爆后进入夜晚，投票和遗言阶段不能自爆。\n玩家策略（以本局规则为准）：先私密讨论狼队目标与白天分工。自爆会公开身份并改变轮次，比较保队友、阻断信息和损失自身选票的收益；只在规则允许环节实际声明，不擅自替主持跳阶段。\n狼队决策：\n1. 夜间私密讨论同时决定刀口与次日打法：谁上警、是否悍跳、谁留警下，查验声称和警徽流、支持或倒钩分工、退水及被查杀应对；按实际局势调整，不强制套固定人数或打法。报名后退水不恢复本局警选投票权。\n2. 刀口围绕本局胜利条件和剩余轮次，比较信息增量、技能与选票收益、守救风险、死亡反击及白天可放逐性。有两个以上合法目标时，至少比较两个，不把不确定底牌说成确认身份。\n3. 警长不是底牌，也不是默认刀口。警徽可移交时，持徽者死亡不等于消除1.5票；公开金水、已有查验和遗言不会因其死亡消失。区分持续查验的预言家、仍能行动的神职和只承接信息的持徽者。刀警长须说明与替代目标相比的具体收益，不能只说有警徽或能归票。\n4. 守卫不能连守只限制其真实上一夜目标；未知守谁不能推导当前目标安全。公开警长和神职可能成为保护焦点，应比较风险；连续平安后结合合法可知反馈调整，不机械追刀，也不把空刀当保护成功。\n5. 对队友的反对意见先比较事实、收益和风险，再确认统一选择；不以避免分票为由跳过比较，也不凭空声称多数或全队一致。夜刀考虑守救，死亡带走按该技能实际效果与限制判断。\n6. 只在许可的狼队私密频道讨论；公开发言保持好人可知视角。各自实际提交，提交前核对目标、当轮及原因一致，讨论和口头同意不代替行动。","skills":[]},
  whiteNight:{"name":"白夜使者","team":"good","category":"god","count":1,"description":"从第三天开始，每个白天入夜前可翻牌发动时间回溯，整局一次：回到前一夜，前一晚及投票出局者重新回归，重新执行夜间流程并按新结果判定。\n玩家策略（以本局规则为准）：仅在允许时点比较回溯前后的存活、技能资源和好人胜负收益，避免因一票不满意就浪费一次性能力。回溯后的反馈与行动需重新确认，不把作废轮次的结果当作当前仍生效。","skills":[]},
  bomber:{"name":"炸弹师","team":"good","category":"god","count":1,"description":"好人神职。白天被投票放逐时带走所有投给自己的玩家；被毒杀或猎人带走不发动。被炸死的猎人不能开枪。\n玩家策略（以本局规则为准）：正常分析和争取有效投票，不主动诱导好人集体误投自己。临近放逐时说明风险并比较可能连带目标对好人的收益；触发与否及死亡连锁交由主持裁定。","skills":[]},
  darkNight:{"name":"黑夜使者","team":"third","category":"special","count":1,"description":"特殊身份；阵营、发动条件、目标和次数以主持开局公布的黑夜使者规则为准，由主持通过自定义填写收集并裁定。\n玩家策略（以本局规则为准）：先确认本局明确的阵营、目标、次数、触发和胜利条件；仅按这些能力制定策略。规则缺少影响选择的信息时私密询问主持，不拿其他版本补造能力。","skills":[]},
  moonPriest:{"name":"月夜祭司","team":"good","category":"god","count":1,"description":"月影传说板子的好人神职。夜间在禁锢之影之后确认机能状态；夜间被狼人杀死时，下一夜狼人失去杀人能力。禁锢是否阻止发动及次夜狼刀状态由主持记录和裁定。\n玩家策略（以本局规则为准）：结合实际机能反馈判断技能是否有效，隐藏身份时不泄露未公开夜间信息。比较自身存活及阻断后续狼刀的轮次价值，不把任何死亡都视为已触发效果。","skills":[]},
  nightWatchman:{"name":"守夜人","team":"good","category":"god","count":1,"description":"石像鬼与守夜人板子的好人神职。每夜首先行动，得知上个白天被放逐玩家的具体身份；不查狼刀、毒杀或开枪出局者。被放逐者为石像鬼时反馈狼人。\n玩家策略（以本局规则为准）：准确区分放逐身份反馈和其他死因，优先用真实结果检验前一天票型与支持关系。公开时说明反馈对应哪轮放逐，不能借此证明所有投对票的人都是好人。","skills":[]},
  knight:{"name":"骑士","team":"good","category":"god","count":1,"description":"好人神职。警长竞选结束后、放逐投票前，可翻牌与一名其他玩家决斗，整局一次；对方为狼人则对方出局并进入夜晚，否则骑士出局并继续白天发言。特殊身份及后续流程由主持按开局规则裁定。\n玩家策略（以本局规则为准）：决斗是一局一次的高风险验证，优先处理会改变站边或关键轮次的强矛盾。比较目标狼嫌疑、自己出局代价及提前入夜影响，不凭情绪决斗；特殊身份结算由主持确认。","skills":[]},
  cupid:{name:'丘比特（爱神）',team:'third',category:'special',count:1,description:'首夜选择两名玩家结为情侣，可包含自己；双方保留原身份，一方出局时另一方殉情。人狼恋可按约定组成第三方阵营，人人恋、狼狼恋及爱神归属按开局规则裁定。主持私密记录关系并告知情侣，情侣不作为独立身份牌；殉情不触发猎人或狼王开枪。\n玩家策略（以本局规则为准）：先按本局情侣阵营和胜利规则选择关系，不假定情侣一定属于第三方。只在获准的私密范围沟通，注意双方存活和连带风险，不泄露另一半的底牌或擅自获知未提供身份。',skills:[]},
  treasureThief:{name:'盗宝大师',team:'third',category:'special',count:1,description:'每夜偷取一名玩家的技能，该玩家当晚不能发动技能；整局不能重复偷同一人。该网站版本的胜利条件为好人与狼人各自存活人数均不超过一人，开局可另行约定。\n玩家策略（以本局规则为准）：按本局第三方胜利条件评估双方人数与技能威胁，选择能影响下一轮的未偷取目标。不能把偷取提交当成已知对方身份或能力失效已确认，等待真实反馈。',skills:[]},
  wildChild:{name:'野孩子',team:'third',category:'special',count:1,description:'首夜选择一名崇拜对象，起初按好人身份行动；对象出局后按约定时点加入狼队并获得袭击能力。先判胜负，再判变身。\n玩家策略（以本局规则为准）：首夜选择崇拜对象时比较其存活可能与转阵营风险。对象出局后先核对实际变身时点和新胜利条件，再调整行动；未收到许可不提前加入狼队或使用狼刀。',skills:[]},
  penguin:{name:'企鹅',team:'good',category:'god',count:1,description:'每夜选择一名玩家冰冻，使其当晚无法发动技能。整局不能冰冻同一名玩家两次。\n玩家策略（以本局规则为准）：冰冻优先考虑可疑关键行动者和本轮收益，同时评估误封好人技能的代价。记录已冻目标，不重复；行动没有预期效果时先考虑多种规则解释，不直接判定目标阵营。',skills:[]},
  bear:{name:'熊',team:'good',category:'god',count:1,description:'天亮时相邻存活玩家中有狼人则咆哮，否则不咆哮；相邻玩家死亡时向外顺延。熊死亡或被冰冻时不能咆哮。\n玩家策略（以本局规则为准）：用每次咆哮和当时相邻存活座位缩小范围，邻座死亡后重新计算。结合冰冻、死亡与真实反馈区分不咆哮的原因，不能把某次咆哮指向一个未经验证的确定狼人。',skills:[]},
  sheep:{name:'小绵羊',team:'good',category:'villager',count:1,description:'疯狂动物园板子中的普通好人，没有主动技能，通过发言和投票协助找出狼人。\n玩家策略（以本局规则为准）：用公开发言和关键票型提供独立判断，不因普通好人身份而划水。关注当前板子的特殊死亡及信息机制，不把动物角色名称当作阵营证据。',skills:[]},
  rooster:{name:'大公鸡',team:'good',category:'villager',count:1,description:'夜间被狼人袭击致死时，次日不能叫醒大家，跳过该白天进入下一夜。\n玩家策略（以本局规则为准）：正常参与好人推理和投票，隐藏身份时避免给狼队准确的跳昼目标。按实际公告判断白天是否跳过，不自行补发被取消轮次的票或抢先结束阶段。',skills:[]},
  moneyMouse:{name:'金钱鼠',team:'good',category:'god',count:1,description:'初始有七枚铜钱；村民出局扣一枚，神职出局扣两枚，狼人出局不扣。铜钱归零时出局，每夜最后得知剩余数量。\n玩家策略（以本局规则为准）：记录每轮铜钱反馈及公开死亡，比较人数和资源下降对存活的影响。隐匿身份时不泄露私密余额；未知死者类别不能仅靠猜测扣钱，也不能自行宣布归零。',skills:[]},
  littleGirl:{name:'小女孩',team:'good',category:'god',count:1,description:'夜间与狼人行动同一时点可偷偷睁眼获取线索。线上局的线索内容、暴露风险及使用限制须开局约定，由主持通过私密反馈模拟，不公开狼队名单。\n玩家策略（以本局规则为准）：仅分析主持合法提供的线索及明确风险，线索强度和真实性依本局约定。不能读源码、他人私密频道或完整狼队名单模拟睁眼；公开线索时说明证据范围而非伪造查验。',skills:[]},
  dreamWeaver:{name:'织梦人',team:'good',category:'god',count:1,description:'夜间较早行动，指定一名玩家梦游。梦游保护、连续梦游和织梦人出局后的关联效果按所选板子约定，由主持安排填写与裁定。\n玩家策略（以本局规则为准）：记录梦游对象，比较保护关键好人、连续指定及自身死亡关联的收益和风险。具体免疫和连带依冻结规则，不把一次平安夜当作目标阵营证明。',skills:[]},
  whiteWolfKing:{name:'白狼王',team:'wolf',category:'god',count:1,description:'具有普通狼人袭击能力。白天可声明自爆并选择带走一名玩家，投票和遗言环节不能发动；后续进入夜晚。\n玩家策略（以本局规则为准）：先按普通狼队参与讨论；自爆带人优先比较可确认关键神职、轮次和队友存活收益，不把猜测当底牌。只有合法时点和主持安排的目标卡才能发动，不因可自爆就立即消耗自己。\n狼队决策：\n1. 夜间私密讨论同时决定刀口与次日打法：谁上警、是否悍跳、谁留警下，查验声称和警徽流、支持或倒钩分工、退水及被查杀应对；按实际局势调整，不强制套固定人数或打法。报名后退水不恢复本局警选投票权。\n2. 刀口围绕本局胜利条件和剩余轮次，比较信息增量、技能与选票收益、守救风险、死亡反击及白天可放逐性。有两个以上合法目标时，至少比较两个，不把不确定底牌说成确认身份。\n3. 警长不是底牌，也不是默认刀口。警徽可移交时，持徽者死亡不等于消除1.5票；公开金水、已有查验和遗言不会因其死亡消失。区分持续查验的预言家、仍能行动的神职和只承接信息的持徽者。刀警长须说明与替代目标相比的具体收益，不能只说有警徽或能归票。\n4. 守卫不能连守只限制其真实上一夜目标；未知守谁不能推导当前目标安全。公开警长和神职可能成为保护焦点，应比较风险；连续平安后结合合法可知反馈调整，不机械追刀，也不把空刀当保护成功。\n5. 对队友的反对意见先比较事实、收益和风险，再确认统一选择；不以避免分票为由跳过比较，也不凭空声称多数或全队一致。夜刀考虑守救，死亡带走按该技能实际效果与限制判断。\n6. 只在许可的狼队私密频道讨论；公开发言保持好人可知视角。各自实际提交，提交前核对目标、当轮及原因一致，讨论和口头同意不代替行动。',skills:[]},

 function readableRecord(value){return value.replace(/\[([^\]]+)\]\(aurai:\/\/[^)]+\)/g,(_,label)=>label==='查看详情'?'':label).replace(/aurai:\/\/[^\s)]+/g,'').trim();}
 function roleRules(value){return value.split(/\n(?:玩家策略（以本局规则为准）：|夜间协作：|狼队决策：|刀口判断：|刀口反证与协商：)/)[0].trim();}
 function drawTimeline(s,host){
  const source=host?.hostView?.timeline||host?.own?.timeline||s.timeline||[],players=s.players||[],filter=$('timelinePlayer'),selected=filter.value;
  updateSection('timelineOptions',players.map(p=>[p.id,p.name]),()=>{filter.replaceChildren();const all=text('option','全部玩家');all.value='all';filter.append(all);players.forEach(p=>{const option=text('option',p.name);option.value=p.id;filter.append(option)});filter.value=selected;});
  updateSection('timelineRows',[source,filter.value,players.map(p=>[p.id,p.name])],()=>{
   const rows=$('timelineRows');rows.replaceChildren();let periodKey='';
   const names=Object.fromEntries(players.map(p=>[p.id,p.name]));
   source.filter(row=>filter.value==='all'||row.playerId===filter.value).forEach(row=>{
    const body=readableRecord(row.text);if(!body)return;
    const key=row.day+':'+row.period;if(key!==periodKey){periodKey=key;rows.append(text('h3','第'+row.day+(row.period==='night'?'夜':'天'),'aurai-title ww-timeline-period'));}
    const item=document.createElement('div');item.className='ww-timeline-row';item.append(text('span',row.playerId?names[row.playerId]+' · '+(row.type==='feedback'?'反馈':'行动'):'对局进程','ww-timeline-label'),text('p',body));rows.append(item);
   });
   if(!rows.children.length)rows.append(text('p',filter.value==='all'?'暂无对局记录':'暂无该玩家可查看的行动与反馈','aurai-muted ww-empty'));
  });
