var Chess = (function () {
  var lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var order=[4,0,2,6,8,1,3,5,7];
  function coordinate(p) { return String.fromCharCode(65+p[0])+(p[1]+1); }
  function legal(board) {
    return order.filter(function(i){return board[i]===null;}).map(function(i){return {to:[i%3,Math.floor(i/3)]};});
  }
  function winner(board) {
    return lines.find(function(line){return board[line[0]]!==null&&line.every(function(i){return board[i]===board[line[0]];});});
  }
  function winningLine(board) {
    return (winner(board)||[]).map(function(i){return [i%3,Math.floor(i/3)];});
  }
  function other(side) { return side==='x'?'o':'x'; }
  // Negamax explores the complete remaining tree. Depth scores prefer quick
  // wins and delay forced losses; alpha-beta pruning skips irrelevant branches.
  function score(board,side,depth,alpha,beta) {
    if(winner(board))return depth-10;
    var moves=legal(board);
    if(!moves.length)return 0;
    var best=-Infinity;
    for(var i=0;i<moves.length;i++) {
      var p=moves[i].to,index=p[1]*3+p[0];board[index]=side;
      var value=-score(board,other(side),depth+1,-beta,-alpha);
      board[index]=null;best=Math.max(best,value);alpha=Math.max(alpha,value);
      if(alpha>=beta)break;
    }
    return best;
  }
  function bestMove(board,side) {
    var copy=board.slice(),best=-Infinity,chosen;
    legal(copy).forEach(function(move){
      var index=move.to[1]*3+move.to[0];copy[index]=side;
      var value=-score(copy,other(side),1,-Infinity,Infinity);copy[index]=null;
      if(value>best){best=value;chosen=move;}
    });
    return chosen;
  }
  function play(s,move) {
    var to=move.to;s.board[to[1]*3+to[0]]=s.turn;
    return {to:to,piece:s.turn,text:(s.turn==='x'?'X':'O')+' '+coordinate(to)};
  }
  return {width:3,height:3,first:'x',second:'o',sides:{x:'X',o:'O'},
    initial:function(){return Array(9).fill(null);},legal:legal,play:play,
    winningLine:winningLine,coordinate:coordinate,bestMove:bestMove,
    rules:'3 × 3 九宫格，X 先行，双方轮流在空格落子。横、竖或斜线连成三个即获胜；满盘未分胜负判和。支持与本地 AI 离线对弈。'};
})();

const svgNS='http://www.w3.org/2000/svg';
function node(tag,attrs,parent) {
  const el=document.createElementNS(svgNS,tag);
  for(const [key,value] of Object.entries(attrs))el.setAttribute(key,String(value));
  if(parent)parent.append(el);return el;
}
function drawBoard(board,selected,pending,moves,last,winningLine) {
  const el=$('board');el.setAttribute('viewBox','0 0 336 336');el.replaceChildren();
  $('game').style.setProperty('--board-ratio',1);
  const xy=p=>[48+p[0]*120,48+p[1]*120];
  for(const position of [108,228]) {
    node('line',{x1:position,y1:12,x2:position,y2:324,class:'neon-grid'},el);
    node('line',{x1:12,y1:position,x2:324,y2:position,class:'neon-grid'},el);
  }
  board.forEach((piece,i)=>{
    const p=[i%3,Math.floor(i/3)],[cx,cy]=xy(p);
    const cell=node('g',{'aria-label':(piece?Chess.sides[piece]:'空格')+' '+Chess.coordinate(p)},el);
    if(!piece)return;
    const attrs={class:'neon-mark '+piece,fill:'none','stroke-linecap':'round','stroke-linejoin':'round','stroke-width':10};
    if(piece==='x')node('path',{...attrs,d:`M ${cx-23} ${cy-23} L ${cx+23} ${cy+23} M ${cx+23} ${cy-23} L ${cx-23} ${cy+23}`},cell);
    else node('circle',{...attrs,cx,cy,r:28},cell);
    if(last?.to[0]===p[0]&&last?.to[1]===p[1])node('circle',{cx,cy:cy+44,r:2.5,class:'last-mark'},cell);
  });
  if(winningLine.length) {
    const [a,b]=[xy(winningLine[0]),xy(winningLine[2])];
    node('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'winning-line'},el);
  }
  if(pending){const [cx,cy]=xy(pending.to);node('rect',{x:cx-44,y:cy-44,width:88,height:88,rx:20,class:'pending-cell'},el);}
}
function boardPoint(event) {
  const rect=$('board').getBoundingClientRect();
  const x=(event.clientX-rect.left)/rect.width*336,y=(event.clientY-rect.top)/rect.height*336;
  if(x<0||x>=336||y<0||y>=336)return null;
  return [x<108?0:x<228?1:2,y<108?0:y<228?1:2];
}


// A cancellable worker per move: no model request and no work on the UI thread.
const LocalEngine=(()=>{
  let active=null;
  function cancel(){if(active){active.finish(null);active=null;}}
  function search(view){
    cancel();
    const source=document.getElementById('localEngineSource').textContent;
    const url=URL.createObjectURL(new Blob([JSON.parse(source)],{type:'text/javascript'}));
    const worker=new Worker(url);URL.revokeObjectURL(url);
    return new Promise((resolve,reject)=>{
      let timer=null,best=null;const started=performance.now();
      const job={finish(value,error){
        worker.terminate();clearTimeout(timer);if(active===job)active=null;
        error?reject(error):resolve(value);
      }};
      active=job;
      worker.onerror=event=>{event.preventDefault();job.finish(null,new Error(event.message));};
      worker.onmessage=({data})=>{
        if(data.type==='error'){job.finish(null,new Error(data.message));return;}
        if(data.type==='progress'){
          best=data.move;
          if(timer===null)timer=setTimeout(()=>job.finish(best),Math.max(0,[200,400,800,1500,2500][view.difficulty-1]-(performance.now()-started)));
        }
        if(data.type==='done')job.finish(best);
        if(data.type==='result'){
          const choice=data.forced||data.vcf?data.move:Difficulty.pickMove(data.candidates,view.difficulty).move;
          job.finish({to:[choice%15,Math.floor(choice/15)]});
        }
      };
      if(['tictactoe','reversi','connect4','halma'].includes(GAME)){
        const codes=Object.fromEntries(Object.entries(view.pieceLegend).map(([code,symbol])=>[symbol,code]));
        worker.postMessage({board:view.board.flat().map(p=>p==='·'?null:codes[p]),turn:view.turn,level:view.difficulty});
      }else if(GAME==='xiangqi'){
        const codes=Object.fromEntries(Object.entries(view.pieceLegend).map(([code,symbol])=>[symbol,code]));
        worker.postMessage({board:view.board.map(row=>row.map(p=>p==='·'?null:codes[p])),turn:view.turn,level:view.difficulty,legalMoves:view.legalMoves});
      }else{
        const black=[],white=[];
        view.board.flat().forEach((p,i)=>{if(p==='●')black.push(i);else if(p==='○')white.push(i);});
        const moves=[];black.forEach((p,i)=>{moves.push(p);if(i<white.length)moves.push(white[i]);});
        worker.postMessage({type:'search',seq:1,moves,level:view.difficulty});
      }
    });
  }
  return {search,cancel};
})();

    $('drawActions').hidden=!drawForMe||s.phase!=='playing';
    $('rematch').hidden=!own||s.phase!=='finished';$('gameActions').hidden=!own||s.phase!=='playing';
    $('offerDraw').disabled=busy||!!s.drawOffer;
    for(const id of ['acceptDraw','declineDraw','askAi','rematch','resign','confirmResign'])$(id).disabled=busy;
    $('askAi').disabled=busy||deciding||!own||own.kind==='agent'||s.phase!=='playing'||(!decisionTurn()&&turn.kind!=='agent');
    $('askAi').setAttribute('aria-busy',String(pendingAction==='requestAi'||deciding));
    $('askAi').title=['agent','engine'].includes(turn.kind)?'请对手继续落子':'轮到你了，请在棋盘落子';
    $('emptyHistory').hidden=history.length>0;
    $('history').start=s.ply-history.length+1;
    $('history').replaceChildren(...history.map(m=>text('li',`${s.players.find(p=>p.id===m.actorId).name}：${m.text}`)));
    drawBoard(board,selected,pending,s.legalMoves,last,s.winningLine,flipped());
  } else {
    // A fresh inline launch card still shows the board instead of an empty form.
    $('board').replaceChildren();
    if(!fullscreen()){
      $('match').hidden=false;$('players').replaceChildren();playerDisplay='';$('turn').hidden=false;$('turn').textContent='邀请 AI，一起下棋';
      drawBoard(Chess.initial(),null,null,[],null,[],false);
    }
  }
  AuraiHTML.requestResize();
  if(!busy&&!deciding&&!paused)queueMicrotask(autoDecide);
}
async function submit(action,data={}){
  if(busy)return;cancelSearch();busy=true;pendingAction=action;render();
  try{await AuraiHTML.boardGame('event',{eventId:crypto.randomUUID(),action,data:action==='configure'?data:{game:s.game,ply:s.ply,...data},notifyAi:false});decisionAttempt='';showMore(false);}
  finally{busy=false;pendingAction='';render();}
}
$('setup').onsubmit=event=>{event.preventDefault();void submit('configure',{humanId:$('human').value,aiId:$('ai').value,humanFirst:$('first').value==='human',difficulty:Number($('difficulty').value)});};
$('board').onclick=event=>{
  if(!myTurn())return;const p=boardPoint(event,flipped());if(!p)return;
  if(GAME==='xiangqi'||Chess.moving){
    const piece=board[p[1]*Chess.width+p[0]];
    if(piece&&piece[0]===s.turn){selected=selected?.[0]===p[0]&&selected?.[1]===p[1]?null:p;pending=null;}
    else if(selected){pending=s.legalMoves.find(m=>m.from[0]===selected[0]&&m.from[1]===selected[1]&&m.to[0]===p[0]&&m.to[1]===p[1])||null;if(pending){void submit('move',pending);return;}}
  } else {pending=s.legalMoves.find(m=>m.to[0]===p[0]&&(GAME==='connect4'||m.to[1]===p[1]))||null;if(pending){void submit('move',pending);return;}}
  render();
};
$('undo').onclick=()=>submit('undo');
function showMore(open){$('morePanel').hidden=!open;$('more').setAttribute('aria-expanded',String(open));if(!open)$('resignActions').hidden=true;}
$('more').onclick=()=>showMore($('morePanel').hidden);$('closeMore').onclick=()=>showMore(false);
document.addEventListener('keydown',event=>{if(event.key==='Escape')showMore(false);});
$('askAi').onclick=()=>decisionTurn()?decide():submit('requestAi');$('rematch').onclick=()=>submit('rematch');$('offerDraw').onclick=()=>submit('offerDraw');
$('acceptDraw').onclick=()=>submit('answerDraw',{accept:true});$('declineDraw').onclick=()=>submit('answerDraw',{accept:false});
$('resign').onclick=()=>{$('resignActions').hidden=false;};$('cancelResign').onclick=()=>{$('resignActions').hidden=true;};$('confirmResign').onclick=()=>submit('resign');
$('matchDifficulty').onchange=()=>submit('difficulty',{level:Number($('matchDifficulty').value)});
$('ai').onchange=render;$('human').onchange=render;
document.addEventListener('aurai:pause',()=>{paused=true;cancelSearch();});
document.addEventListener('aurai:resume',()=>{paused=false;decisionAttempt='';render();});
document.addEventListener('aurai:restore',render);
document.addEventListener('aurai:messageupdate',()=>{const next=AuraiHTML.messageState;if(next.game!==s.game||next.ply!==s.ply||next.phase!==s.phase||next.difficulty!==s.difficulty||next.drawOffer!==s.drawOffer)cancelSearch();render();});
document.addEventListener('aurai:displaychange',()=>{if(!fullscreen())cancelSearch();decisionAttempt='';render();});render();

})();
</script>
