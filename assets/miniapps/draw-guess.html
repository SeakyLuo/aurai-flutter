<main class="aurai-ui aurai-stack" id="game">
 <header><h1>你画我猜</h1><span id="progress" class="aurai-muted"></span></header>

 </form>

  <div class="topic-row"><div><span class="aurai-muted" id="role"></span><h2 id="topic"></h2></div><span class="aurai-muted" id="clock"></span></div>
  <div class="paper" data-aurai-gestures="exclusive"><canvas id="canvas" width="768" height="768" aria-label="共享画板"></canvas><span id="paperHint"></span></div>
  <div id="toolbar" class="toolbar" hidden><div class="palette" id="palette"></div><div class="tools">

  </div></div>

 </section>
</main>

<script>
(()=>{
