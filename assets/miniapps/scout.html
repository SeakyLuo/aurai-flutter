<script>(()=>{
const GAME='scout',TITLE='Scout 马戏星探';
// SCOUT rules by Kei Kajino / Oink Games, three-to-five-player rules.
// https://oinkgames.com/en/games/analog/scout/ — artwork below is original CSS.
var Cards=(function(){
  function require(ok,message){if(!ok)throw Error(message);}
  function random(s){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296;}
  function log(s,seat,text){s.logs.push({seat:seat,text:text});s.logs=s.logs.slice(-12);}
  function flipped(hand){return hand.slice().reverse().map(function(c){return {id:c.id,top:c.bottom,bottom:c.top};});}
  function combination(cards){
    if(!cards.length)return null;
    var values=cards.map(function(c){return c.top;}),same=values.every(function(n){return n===values[0];});
    var direction=values.length>1?values[1]-values[0]:0;
    if(!same&&!(Math.abs(direction)===1&&values.every(function(n,i){return i===0||n-values[i-1]===direction;})))return null;
    return {count:values.length,type:same?1:0,low:Math.min.apply(null,values)};
  }
  function beats(a,b){return !b||a.count>b.count||a.count===b.count&&(a.type>b.type||a.type===b.type&&a.low>b.low);}
  function shows(hand,active){
    var target=combination(active),out=[];
    for(var i=0;i<hand.length;i++)for(var n=1;n<=hand.length-i;n++){
      var group=combination(hand.slice(i,i+n));if(group&&beats(group,target))out.push({start:i,count:n,type:group.type,low:group.low});
    }
    return out;
  }
  function recruit(hand,active,data){
    require(data.edge==='left'||data.edge==='right','请选择牌桌左端或右端');
    require(typeof data.flip==='boolean','请选择招募牌的朝向');
    require(Number.isInteger(data.position)&&data.position>=0&&data.position<=hand.length,'请选择插入位置');
    require(active.length>0,'牌桌上没有可招募的牌');
    var picked=active[data.edge==='left'?0:active.length-1];
    var card={id:picked.id,top:data.flip?picked.bottom:picked.top,bottom:data.flip?picked.top:picked.bottom};
    var nextHand=hand.slice();nextHand.splice(data.position,0,card);
    return {hand:nextHand,active:active.filter(function(c){return c.id!==picked.id;}),card:card};
  }
  function deal(s){
    var deck=[],id=0;
    // Three players remove all nine cards containing 10: 36 cards, 12 each.
    // Four players remove only 9/10: 44 cards, 11 each. Five use all 45, 9 each.
    var seats=s.players.length,limit=seats===3?9:10;
    for(var a=1;a<=limit;a++)for(var b=a+1;b<=limit;b++){if(seats===4&&a===9&&b===10)continue;deck.push({id:id++,top:a,bottom:b});}
    for(var i=deck.length-1;i>0;i--){var j=Math.floor(random(s)*(i+1)),card=deck[i];deck[i]=deck[j];deck[j]=card;}
    deck=deck.map(function(c){return random(s)<.5?{id:c.id,top:c.bottom,bottom:c.top}:c;});

    s.stage='orient';s.turn=0;s.oriented=Array(seats).fill(false);s.active=[];s.owner=null;s.scouted=0;
    s.captured=Array(seats).fill(0);s.tokens=Array(seats).fill(0);s.comboUsed=Array(seats).fill(false);s.roundScores=null;
  }
  function create(players,seed){require([3,4,5].indexOf(players.length)>=0,'请选择 3、4 或 5 人');var s={phase:'playing',players:players,seed:seed>>>0,round:1,scores:Array(players.length).fill(0),logs:[],winner:null,winners:[],result:''};deal(s);return s;}
  function quality(hand){
    // Minimum number of adjacent valid sets needed to empty this hand.
    var costs=Array(hand.length+1).fill(Infinity);costs[hand.length]=0;
    for(var i=hand.length-1;i>=0;i--)for(var n=1;n<=hand.length-i;n++)if(combination(hand.slice(i,i+n)))costs[i]=Math.min(costs[i],1+costs[i+n]);
    return -costs[0]*10+hand.reduce(function(total,c){return total+c.top;},0)/100;
  }
  function endRound(s,immune){
    s.roundScores=s.scores.map(function(_,i){return s.captured[i]+s.tokens[i]-(i===immune?0:s.hands[i].length);});
    s.scores=s.scores.map(function(n,i){return n+s.roundScores[i];});
    log(s,-1,'第 '+s.round+' 轮结束');
    if(s.round===s.players.length){s.phase='finished';s.stage='finished';var best=Math.max.apply(null,s.scores);s.winners=s.scores.map(function(n,i){return n===best?i:-1;}).filter(function(i){return i>=0;});s.winner=s.winners[0];s.result=s.winners.map(function(i){return s.players[i].name;}).join('、')+'获胜';}
    else{s.stage='roundEnd';s.turn=0;}
  }
  function show(s,seat,start,count){
    var move=shows(s.hands[seat],s.active).find(function(m){return m.start===start&&m.count===count;});
    require(move,'请选择手中相邻且比当前演出更强的组合');

  function apply(s,seat,action,data){

    require(s.owner!==seat,'不能招募自己的演出');

  function publicView(s){var view={phase:s.phase,stage:s.stage,turn:s.turn,players:s.players,round:s.round,scores:s.scores,counts:s.hands.map(function(h){return h.length;}),active:s.active,owner:s.owner,scouted:s.scouted,captured:s.captured,tokens:s.tokens,comboUsed:s.comboUsed,roundScores:s.roundScores,logs:s.logs,winner:s.winner,winners:s.winners,result:s.result};if(s.phase==='finished')view.hands=s.hands;return view;}
  function privateView(s,seat){return {seat:seat,hand:s.hands[seat],legalShows:s.phase==='playing'&&s.stage==='play'&&s.turn===seat?shows(s.hands[seat],s.active):[]};}
  function ai(own,v){
    if(v.stage==='orient')return {action:'orient',data:{flip:quality(flipped(own.hand))>quality(own.hand)}};
    var legal=own.legalShows;

      var data={edge:edge,flip:flip,position:p},r=recruit(own.hand,v.active,data),value=quality(r.hand);

    }});});

  }

    rules:'支持 3—5 人，轮数等于人数。3 人移除所有含 10 的牌，共 36 张，每人 12 张；4 人只移除 9/10 牌，共 44 张，每人 11 张；5 人使用全部 45 张，每人 9 张。每轮开始可选择整手牌朝向，之后不能重排或翻转手牌。\n演出：打出手中相邻的同数牌或连续升序／降序牌。先比张数，再比牌型（同数大于连续），最后比最小数字；必须严格压过桌面演出。被压过的桌牌每张得 1 分。\n招募：只能取桌牌两端的一张，可翻面并插入手牌任意位置；原演出者得 1 分。本轮每人可使用一次“招募并演出”，招募后立即出牌。\n有人出完手牌，或一次演出后其余所有玩家都仅招募，立即结束本轮。每人得分为赢得的桌牌数＋被招募次数－剩余手牌数；演出未被任何对手压过而结束本轮的演出者不扣手牌分。桌上仍在演出的牌不计分。每轮起始玩家轮换，总分最高者获胜，可并列。'};
})();

    }else if(v.stage==='orient'){
      desk.append(el('h2','好戏，从选好方向开始'),el('p','每张牌有两个数字。整手翻转后，牌序也会反过来。','scout-subtle'));
    }else{
      desk.append(el('p',v.owner===null?'舞台已就绪':v.players[v.owner].name+'的演出','scout-subtle'));
      var active=el('div','','scout-active');v.active.forEach(function(c){active.append(card(c,false));});
      if(!v.active.length)active.append(el('span','自由演出 · 任意有效组合','scout-subtle'));desk.append(active);
      var group=Cards.combination(v.active);
      if(group)desk.append(el('div',group.count+' 张 · '+(group.count===1?'单张':group.type?'同数':'连续'),'scout-subtle'));

    table.append(desk);root.append(table);
    if(v.phase==='finished'){showRemainingHands(root,v,card);return;}
    if(!own){root.append(el('p','正在观战 · 手牌仅玩家本人可见','aurai-muted'));return;}

const $=id=>document.getElementById(id);
const el=(tag,value,cls)=>{const node=document.createElement(tag);node.textContent=value;if(cls)node.className=cls;return node;};
let s=AuraiHTML.messageState,busy=false,thinking=false,paused=false,generation=0,attempt='',timer=null;
let seatCount=s.players?s.players.length:Cards.seats;
const host=()=>s._miniapp;
const mine=()=>s.players?.find(p=>p.id===host()?.viewerId);
const aiTurn=()=>s.phase==='playing'&&(s.players[s.turn].kind==='engine'||s.engineCanJump===true);
const key=()=>`${s.game}:${s.ply}`;
function cancel(){generation++;clearTimeout(timer);timer=null;thinking=false;}
async function continueAi(){
  if(busy||thinking||paused||!AuraiHTML.presentation.interactive||!mine()||!aiTurn())return;
  const run=++generation;attempt=key();thinking=true;render();
  try{
    const job=await AuraiHTML.boardGame('begin');
    if(run!==generation||job.skipped)return;
    await AuraiHTML.boardGame('complete',{token:job.token,version:job.version,action:'cardAi',data:{game:job.view.game,ply:job.view.ply}});
  }finally{if(run===generation){thinking=false;render();}}
}
async function act(action,data={}){
  if(busy)return;cancel();busy=true;render();
  try{
    await AuraiHTML.boardGame('event',{eventId:crypto.randomUUID(),action,data:action==='configure'?data:{game:s.game,ply:s.ply,...data},notifyAi:false});
    attempt='';
  }finally{busy=false;render();}
}
function showRemainingHands(root,v,card){
  const section=el('section','','card-remaining');section.append(el('strong','剩余手牌'));
  v.players.forEach((p,i)=>{
    const row=el('div','','card-revealed-hand'),cards=el('div','','card-revealed-cards');
    row.append(el('span',p.name+' · '+v.hands[i].length+' 张','aurai-muted'));
    v.hands[i].forEach(c=>cards.append(card(c,false)));
    if(!v.hands[i].length)cards.append(el('span','已出完','aurai-muted'));
    row.append(cards);section.append(row);
  });root.append(section);
}
function more(open){$('cardMorePanel').hidden=!open;$('cardMore').setAttribute('aria-expanded',String(open));$('cardLeaveConfirm').hidden=true;AuraiHTML.requestResize();}
function render(){
  s=AuraiHTML.messageState;
  const setup=!s.phase||s.phase==='setup',owner=host()?.viewerId==='user:local';
  $('cardSetup').hidden=!setup;$('cardMatch').hidden=setup;
  $('cardStatus').textContent=setup?'本地 AI':s.phase==='finished'?'本局结束':`第 ${s.game} 局`;
  $('cardRules').textContent=s.rules||Cards.rules;
  $('cardStart').disabled=busy||!owner;
  $('cardSetupHint').textContent=host()?owner?'无需联网，也不用配置模型':'等待玩家开始对局':'从小程序库打开即可开始';
  for(const [id,visible] of [['cardSeatOptions',setup],['cardRematchSeats',s.phase==='finished']]){
    const container=$(id);container.hidden=!Cards.seatOptions||!visible||!owner;
    if(!container.hidden){container.replaceChildren(el('span','对局人数','aurai-muted'),...Cards.seatOptions.map(count=>{
      const b=el('button',count+' 人','aurai-button'+(seatCount===count?' aurai-button--primary':''));b.type='button';b.disabled=busy;b.setAttribute('aria-pressed',String(seatCount===count));b.onclick=()=>{seatCount=count;render();};return b;
    }),el('small','你与 '+(seatCount-1)+' 位电脑游玩','aurai-muted'));}
  }
  if(!setup){
    $('cardPlayers').replaceChildren(...s.players.map((p,i)=>{
      const node=el('div','',`card-player${s.phase==='playing'&&s.turn===i?' active':''}`);
      node.append(el('span','','card-seat'),el('strong',p.name));
      if(s.counts)node.append(el('small',s.counts[i]+' 张'));

    }));

    $('cardContinue').hidden=GAME==='doudizhu'||s.phase==='finished';$('cardContinue').disabled=busy||thinking||!mine()||!aiTurn();
    $('cardContinue').setAttribute('aria-busy',String(thinking));
    $('cardMore').hidden=GAME==='doudizhu';
    $('cardToolbar').hidden=GAME==='doudizhu'&&(s.phase!=='finished'||!mine());
    $('cardRematch').hidden=s.phase!=='finished'||!mine();$('cardRematch').disabled=busy;
    $('cardLeave').hidden=s.phase==='finished'||!mine();

  }

$('cardStart').onclick=()=>act('configure',Cards.seatOptions?{seats:seatCount}:{});
$('cardRematch').onclick=()=>{CardUI.reset();more(false);void act('rematch',Cards.seatOptions?{seats:seatCount}:{});};
$('cardContinue').onclick=()=>{more(false);clearTimeout(timer);timer=null;void continueAi();};
$('cardMore').onclick=()=>more($('cardMorePanel').hidden);$('cardCloseMore').onclick=()=>more(false);
$('cardLeave').onclick=()=>{$('cardLeaveConfirm').hidden=false;};
$('cardCancelLeave').onclick=()=>{$('cardLeaveConfirm').hidden=true;};

document.addEventListener('keydown',e=>{if(e.key==='Escape')more(false);});
document.addEventListener('aurai:pause',()=>{paused=true;cancel();});

document.addEventListener('aurai:restore',render);
document.addEventListener('aurai:messageupdate',()=>{const next=AuraiHTML.messageState;if(next.game!==s.game||next.ply!==s.ply)cancel();render();});
document.addEventListener('aurai:displaychange',render);
render();

})();</script>
