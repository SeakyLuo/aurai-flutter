    s.hands=Array.from({length:4},function(){return deck.splice(0,10).sort(function(a,b){return a-b;});});s.rows=deck.splice(0,4).map(function(c){return [c];});s.unused=deck;s.taken=[[],[],[],[]];s.roundPoints=[0,0,0,0];s.seen=s.rows.map(function(r){return r[0];});s.trick=1;startTrick(s);
  }
  function startTrick(s){s.stage='select';s.turn=0;s.choices=[null,null,null,null];s.queue=[];s.revealed=[];s.resolved=[];}
  function create(players,seed){var s={phase:'playing',players:players,seed:seed>>>0,round:1,scores:[0,0,0,0],logs:[],winner:null,winners:[],result:''};deal(s);return s;}
  function rowFor(rows,card){var best=-1,tail=0;rows.forEach(function(r,i){var n=r[r.length-1];if(n<card&&n>tail){best=i;tail=n;}});return best;}
  function cheapest(rows){return rows.reduce(function(best,row,i){return cost(row)<cost(rows[best])?i:best;},0);}
  function place(s,item,row,take){var captured=take?s.rows[row].slice():[],penalty=cost(captured);if(take){s.taken[item.seat]=s.taken[item.seat].concat(captured);s.scores[item.seat]+=penalty;s.roundPoints[item.seat]+=penalty;s.rows[row]=[item.card];}else s.rows[row].push(item.card);
    s.resolved.push({seat:item.seat,card:item.card,row:row,points:penalty,taken:captured});log(s,item.seat,'打出 '+item.card+'，'+(take?'收第 '+(row+1)+' 行，罚 '+penalty+' 分':'放入第 '+(row+1)+' 行'));
  }
  function resolve(s){while(s.queue.length){var item=s.queue[0],row=rowFor(s.rows,item.card);if(row===-1){s.stage='choose';s.turn=item.seat;return;}s.queue.shift();place(s,item,row,s.rows[row].length===5);}
    s.turn=0;
    if(s.trick<10){s.stage='trickEnd';return;}
    if(s.scores.some(function(n){return n>=66;})){s.phase='finished';s.stage='finished';var best=Math.min.apply(null,s.scores);s.winners=[0,1,2,3].filter(function(i){return s.scores[i]===best;});s.winner=s.winners.length===1?s.winners[0]:null;s.result=s.winners.map(function(i){return s.players[i].name;}).join('、')+(s.winners.length>1?'并列获胜':'获胜');}
    else s.stage='roundEnd';
  }
  function apply(s,seat,action,d){
    require(s.phase==='playing'&&s.turn===seat,'尚未轮到你');
    if(s.stage==='trickEnd'){require(action==='nextTrick','请继续下一次出牌');s.trick++;startTrick(s);return;}
    if(s.stage==='roundEnd'){require(action==='nextRound','请开始下一轮');s.round++;deal(s);return;}
    if(s.stage==='choose'){require(action==='take'&&Number.isInteger(d.row)&&d.row>=0&&d.row<4,'请选择要收取的一行');var item=s.queue.shift();place(s,item,d.row,true);resolve(s);return;}
    require(action==='commit'&&s.hands[seat].indexOf(d.card)>=0,'请选择一张手牌');s.hands[seat].splice(s.hands[seat].indexOf(d.card),1);s.choices[seat]=d.card;
    var next=s.choices.indexOf(null);if(next>=0){s.turn=next;return;}
    s.revealed=s.choices.map(function(card,i){return {card:card,seat:i};}).sort(function(a,b){return a.card-b.card;});s.queue=s.revealed.slice();s.seen=s.seen.concat(s.revealed.map(function(p){return p.card;}));resolve(s);
  }
  function publicView(s){var view={phase:s.phase,stage:s.stage,turn:s.turn,players:s.players,rows:s.rows,scores:s.scores,roundPoints:s.roundPoints,round:s.round,trick:s.trick,ready:s.choices.map(function(c){return c!==null;}),revealed:s.revealed,resolved:s.resolved,pending:s.stage==='choose'?s.queue[0]:null,seen:s.seen,logs:s.logs,winner:s.winner,winners:s.winners,result:s.result};if(s.phase==='finished')view.hands=s.hands;return view;}
  function privateView(s,seat){return {seat:seat,hand:s.hands[seat],chosen:s.choices[seat]};}
  function ai(own,v){
    if(v.stage==='choose')return {action:'take',data:{row:cheapest(v.rows)}};
    // Sample unknown cards, never committed choices or opponents' hands.
    var unknown=Array.from({length:104},function(_,i){return i+1;}).filter(function(c){return own.hand.indexOf(c)<0&&v.seen.indexOf(c)<0;}),samples=[];
    for(var i=0;i<48;i++){var pool=unknown.slice(),sample=[];for(var j=0;j<3;j++)sample.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);samples.push(sample);}
    function evaluate(card){var total=0;samples.forEach(function(sample){var rows=v.rows.map(function(r){return r.slice();}),plays=sample.map(function(c){return {card:c,us:false};});plays.push({card:card,us:true});plays.sort(function(a,b){return a.card-b.card;});plays.forEach(function(p){var row=rowFor(rows,p.card),take=row<0;if(take)row=cheapest(rows);take=take||rows[row].length===5;if(p.us&&take)total+=cost(rows[row]);if(take)rows[row]=[p.card];else rows[row].push(p.card);});});return total/samples.length+card*.0005;}
    var best=own.hand[0],score=evaluate(best);own.hand.slice(1).forEach(function(c){var next=evaluate(c);if(next<score){best=c;score=next;}});return {action:'commit',data:{card:best}};
  }
  return {title:'牛头王',seats:4,create:create,apply:apply,publicView:publicView,privateView:privateView,ai:ai,points:points,cost:cost,rowFor:rowFor,
    rules:'你与三位电脑使用 1—104 号牌。每轮每人 10 张手牌，桌面四行各放一张牌。每次各选一张暗牌，全部选定后一起揭晓，按数字从小到大处理；电脑选择时看不到你的暗牌。\n牌必须接到小于它、且差值最小的行尾。放上第六张时，收走该行原有五张牌，新牌成为行首。若比所有行尾都小，必须自选一行收走，再放入自己的牌。收来的牌只计罚分，不进入手牌。\n普通牌 1 分，5 的倍数 2 分，10 的倍数 3 分，11 的倍数 5 分，55 特殊为 7 分。罚分越少越好。\n每轮出完 10 张后重新发牌；在一轮结束时有人累计达到 66 分，整场结束，最低分获胜，同分共享胜利。'};
})();

var CardUI=(function(){
  var selected=null,revision='';function reset(){selected=null;revision='';}
  function render(root,v,own,api){var el=api.el,key=v.game+':'+v.ply;if(key!==revision){selected=null;revision=key;}root.replaceChildren();root.className='six-root';
    function button(text,fn,disabled,primary){var b=el('button',text,'aurai-button'+(primary?' aurai-button--primary':''));b.type='button';b.disabled=disabled;b.onclick=fn;return b;}
    function card(c){var box=el('span','','six-card');box.dataset.level=Cards.points(c);box.append(el('b',String(c)),el('small','罚 '+Cards.points(c)));return box;}
    root.append(el('div','第 '+v.round+' 轮 · '+v.trick+' / 10 次出牌','six-meta'));
    var scores=el('div','','six-scores');v.players.forEach(function(p,i){var box=el('div','','six-score');box.append(el('span',p.name),el('strong',v.scores[i]+' 分'),el('small',v.stage==='select'?(v.ready[i]?'已选好':'选牌中'):'本轮 +'+v.roundPoints[i]));scores.append(box);});root.append(scores);
    var choosing=v.stage==='choose';
    root.append(el('p',choosing?(v.players[v.pending.seat].name+'的 '+v.pending.card+' 比所有行尾都小，'+(own&&v.pending.seat===own.seat?'请选择收走一行':'正在选择收牌')):'每行最多五张，第六张会收走整行','six-hint'));
    var rows=el('div','','six-rows');v.rows.forEach(function(row,i){var line=el('div','','six-row'),label=el('span',String(i+1),'six-row-number'),strip=el('div','','six-row-cards');row.forEach(function(c){strip.append(card(c));});for(var n=row.length;n<5;n++)strip.append(el('span','','six-slot'));line.append(label,strip);
      if(choosing&&own&&v.pending.seat===own.seat)line.append(button('收取 · '+Cards.cost(row)+' 分',function(){api.act('take',{row:i});},!api.canPlay,false));
      else line.append(el('span',Cards.cost(row)+' 分','six-cost'));rows.append(line);});root.append(rows);
    if(v.revealed.length){var results=el('div','','six-revealed');v.revealed.forEach(function(p){var done=v.resolved.find(function(r){return r.seat===p.seat;}),item=el('div','','six-reveal');item.append(el('small',v.players[p.seat].name),card(p.card),el('small',done?(done.points?'罚 '+done.points+' 分':'第 '+(done.row+1)+' 行'):'待放置'));results.append(item);});root.append(results);}
    if(v.phase==='finished'){root.append(el('strong',v.result,'six-result'));showRemainingHands(root,v,card);return;}
    if(!own){root.append(el('p','正在观战','aurai-muted'));return;}
    if(v.stage==='trickEnd'||v.stage==='roundEnd'){root.append(button(v.stage==='trickEnd'?'继续出牌':'开始下一轮',function(){api.act(v.stage==='trickEnd'?'nextTrick':'nextRound',{});},!api.canPlay,true));return;}
    if(v.stage==='select'){
      var hand=el('div','','six-hand');own.hand.forEach(function(c){var b=button('',function(){selected=c;render(root,v,own,api);},!api.canPlay,false);b.className='six-pick'+(c===selected?' selected':'');b.append(card(c));b.setAttribute('aria-label',c+' 号，'+Cards.points(c)+' 分');b.setAttribute('aria-pressed',String(c===selected));hand.append(b);});root.append(hand);
      root.append(button(own.chosen!==null?'已选好，等待揭晓':selected===null?'选一张牌':'确认暗出 '+selected,function(){api.act('commit',{card:selected});},!api.canPlay||selected===null,true));
    }
  }
  return {render:render,reset:reset};
})();

const $=id=>document.getElementById(id);
const el=(tag,value,cls)=>{const node=document.createElement(tag);node.textContent=value;if(cls)node.className=cls;return node;};
let s=AuraiHTML.messageState,busy=false,thinking=false,paused=false,generation=0,attempt='',timer=null;
let seatCount=s.players?s.players.length:Cards.seats;
const host=()=>s._miniapp;
const mine=()=>s.players?.find(p=>p.id===host()?.viewerId);
const aiTurn=()=>s.phase==='playing'&&(s.players[s.turn].kind==='engine'||s.engineCanJump===true);
const key=()=>`${s.game}:${s.ply}`;
function cancel(){generation++;clearTimeout(timer);timer=null;thinking=false;}
async function continueAi(){
  if(busy||thinking||paused||!mine()||!aiTurn())return;
  const run=++generation;attempt=key();thinking=true;render();
  try{
    const job=await AuraiHTML.boardGame('begin');
    if(run!==generation||job.skipped)return;
    await AuraiHTML.boardGame('complete',{token:job.token,version:job.version,action:'cardAi',data:{game:job.view.game,ply:job.view.ply}});
  }finally{if(run===generation){thinking=false;render();}}
}
async function act(action,data={}){
  if(busy)return;cancel();busy=true;render();
  try{
    await AuraiHTML.boardGame('event',{eventId:crypto.randomUUID(),action,data:action==='configure'?data:{game:s.game,ply:s.ply,...data},notifyAi:false});
    attempt='';
  }finally{busy=false;render();}
}
function showRemainingHands(root,v,card){
  const section=el('section','','card-remaining');section.append(el('strong','剩余手牌'));
  v.players.forEach((p,i)=>{
    const row=el('div','','card-revealed-hand'),cards=el('div','','card-revealed-cards');
    row.append(el('span',p.name+' · '+v.hands[i].length+' 张','aurai-muted'));
    v.hands[i].forEach(c=>cards.append(card(c,false)));
    if(!v.hands[i].length)cards.append(el('span','已出完','aurai-muted'));
    row.append(cards);section.append(row);
  });root.append(section);
}
function more(open){$('cardMorePanel').hidden=!open;$('cardMore').setAttribute('aria-expanded',String(open));$('cardLeaveConfirm').hidden=true;AuraiHTML.requestResize();}
function render(){
  s=AuraiHTML.messageState;
  const setup=!s.phase||s.phase==='setup',owner=host()?.viewerId==='user:local';
  $('cardSetup').hidden=!setup;$('cardMatch').hidden=setup;
  $('cardStatus').textContent=setup?'本地 AI':s.phase==='finished'?'本局结束':`第 ${s.game} 局`;
  $('cardRules').textContent=s.rules||Cards.rules;
  $('cardStart').disabled=busy||!owner;
  $('cardSetupHint').textContent=host()?owner?'无需联网，也不用配置模型':'等待玩家开始对局':'从小程序库打开即可开始';
  for(const [id,visible] of [['cardSeatOptions',setup],['cardRematchSeats',s.phase==='finished']]){
    const container=$(id);container.hidden=!Cards.seatOptions||!visible||!owner;
    if(!container.hidden){container.replaceChildren(el('span','对局人数','aurai-muted'),...Cards.seatOptions.map(count=>{
      const b=el('button',count+' 人','aurai-button'+(seatCount===count?' aurai-button--primary':''));b.type='button';b.disabled=busy;b.setAttribute('aria-pressed',String(seatCount===count));b.onclick=()=>{seatCount=count;render();};return b;
    }),el('small','你与 '+(seatCount-1)+' 位电脑游玩','aurai-muted'));}
  }
  if(!setup){
    $('cardPlayers').replaceChildren(...s.players.map((p,i)=>{
      const node=el('div','',`card-player${s.phase==='playing'&&s.turn===i?' active':''}`);
      node.append(el('span','','card-seat'),el('strong',p.name));
      if(s.counts)node.append(el('small',s.counts[i]+' 张'));
      node.setAttribute('aria-label',p.name+(s.phase==='playing'&&s.turn===i?'，正在行动':''));return node;
    }));
    if(s.abandoned){$('cardTable').replaceChildren(el('p','本局已结束，可重新开局。','aurai-muted'));}
    else CardUI.render($('cardTable'),s,host()?.own,{act,busy:busy||thinking,canJump:!busy&&!thinking&&!!mine(),canPlay:!busy&&!thinking&&!!mine()&&s.turn===mine().side,el});
    $('cardContinue').hidden=GAME==='doudizhu'||s.phase==='finished';$('cardContinue').disabled=busy||thinking||!mine()||!aiTurn();
    $('cardContinue').setAttribute('aria-busy',String(thinking));
    $('cardMore').hidden=GAME==='doudizhu';
    $('cardToolbar').hidden=GAME==='doudizhu'&&(s.phase!=='finished'||!mine());
    $('cardRematch').hidden=s.phase!=='finished'||!mine();$('cardRematch').disabled=busy;
    $('cardLeave').hidden=s.phase==='finished'||!mine();
    $('cardLog').replaceChildren(...(s.logs||[]).map(item=>el('li',(item.seat>=0?s.players[item.seat].name+' · ':'')+item.text)));
  }
  AuraiHTML.requestResize();
  if(!setup&&!busy&&!thinking&&!paused&&mine()&&aiTurn()&&attempt!==key()&&!timer){
    timer=setTimeout(()=>{timer=null;void continueAi();},s.engineCanJump===true||host()?.own?.jumpable?.length?3000:650);
  }
}
$('cardStart').onclick=()=>act('configure',Cards.seatOptions?{seats:seatCount}:{});
$('cardRematch').onclick=()=>{CardUI.reset();more(false);void act('rematch',Cards.seatOptions?{seats:seatCount}:{});};
$('cardContinue').onclick=()=>{more(false);clearTimeout(timer);timer=null;void continueAi();};
$('cardMore').onclick=()=>more($('cardMorePanel').hidden);$('cardCloseMore').onclick=()=>more(false);
$('cardLeave').onclick=()=>{$('cardLeaveConfirm').hidden=false;};
$('cardCancelLeave').onclick=()=>{$('cardLeaveConfirm').hidden=true;};
$('cardConfirmLeave').onclick=()=>{more(false);void act('leave');};
document.addEventListener('keydown',e=>{if(e.key==='Escape')more(false);});
document.addEventListener('aurai:pause',()=>{paused=true;cancel();});
document.addEventListener('aurai:resume',()=>{paused=false;attempt='';render();});
document.addEventListener('aurai:restore',render);
document.addEventListener('aurai:messageupdate',()=>{const next=AuraiHTML.messageState;if(next.game!==s.game||next.ply!==s.ply)cancel();render();});
document.addEventListener('aurai:displaychange',render);
render();

})();</script>
