  function fits(v,w){return !v.walls.some(function(a){return a.axis===w.axis?(w.axis==='h'?a.y===w.y&&Math.abs(a.x-w.x)<2:a.x===w.x&&Math.abs(a.y-w.y)<2):a.x===w.x&&a.y===w.y;});}
  function wallGraph(v,w){if(!fits(v,w))return null;var g=graph(v.walls.concat([w]));return distances(g,0)[v.pawns[0]]<99&&distances(g,1)[v.pawns[1]]<99?g:null;}
  function legalWalls(v,seat){var out=[];if(!v.remaining[seat])return out;for(var y=0;y<8;y++)for(var x=0;x<8;x++)['h','v'].forEach(function(axis){var w={x:x,y:y,axis:axis};if(wallGraph(v,w))out.push(w);});return out;}
  function create(players,seed){return {phase:'playing',players:players,turn:seed%2,pawns:[76,4],walls:[],remaining:[10,10],logs:[],winner:null,result:''};}
  function apply(s,seat,action,d){
    require(s.phase==='playing'&&s.turn===seat,'尚未轮到你');var text;
    if(action==='move'){require(moves(s,seat).indexOf(d.to)>=0,'请选择可到达的位置');s.pawns[seat]=d.to;text='前进一步';
      if(Math.floor(d.to/9)===(seat===0?0:8)){s.phase='finished';s.winner=seat;s.result=s.players[seat].name+'到达终点，获胜';}
    }else{require(action==='wall','请选择走棋或放墙');require(s.remaining[seat]>0,'围墙已用完');require(Number.isInteger(d.x)&&Number.isInteger(d.y)&&d.x>=0&&d.x<8&&d.y>=0&&d.y<8&&(d.axis==='h'||d.axis==='v'),'请选择有效的围墙位置');var w={x:d.x,y:d.y,axis:d.axis};require(wallGraph(s,w),'围墙不能交叉、重叠或封死道路');s.walls.push(w);s.remaining[seat]--;text='放置'+(d.axis==='h'?'横向':'纵向')+'围墙';}
    s.logs.push({seat:seat,text:text});s.logs=s.logs.slice(-12);if(s.phase==='playing')s.turn=1-seat;
  }
  function publicView(s){return {phase:s.phase,players:s.players,turn:s.turn,pawns:s.pawns,walls:s.walls,remaining:s.remaining,logs:s.logs,winner:s.winner,result:s.result};}
  function privateView(s,seat){var active=s.phase==='playing'&&s.turn===seat;return {seat:seat,moves:active?moves(s,seat):[],walls:active?legalWalls(s,seat):[]};}
  function ai(own,v){
    var seat=own.seat,g=graph(v.walls),ours=distances(g,seat),theirs=distances(g,1-seat),legal=own.moves;
    var best=legal.reduce(function(a,b){return ours[b]<ours[a]?b:a;});if(ours[best]===0)return {action:'move',data:{to:best}};
    var choice=null,benefit=1.25;
    own.walls.forEach(function(w){var next=graph(v.walls.concat([w])),a=distances(next,seat)[v.pawns[seat]]-ours[v.pawns[seat]],b=distances(next,1-seat)[v.pawns[1-seat]]-theirs[v.pawns[1-seat]],score=b-a*1.15;
      if(theirs[v.pawns[1-seat]]===1&&b>0)score+=2;
      if(score>benefit){benefit=score;choice=w;}
    });return choice?{action:'wall',data:choice}:{action:'move',data:{to:best}};
  }
  return {title:'步步为营',seats:2,create:create,apply:apply,publicView:publicView,privateView:privateView,ai:ai,moves:moves,legalWalls:legalWalls,graph:graph,distances:distances,
    rules:'双人玩法：双方各有 10 面墙，棋子从各自底线中央出发，先到达对面任意终点格者获胜。开局随机决定先手。\n每回合二选一：向上下左右移动一格，或放置一面横向、纵向的墙。墙占两格长度，不能重叠、交叉，也不能把任何一方通往终点的所有道路封死。\n相邻且中间无墙时，可以直线跳过对方；对方身后有墙或已到棋盘边缘时，才可以向对方左右侧跳。\n点亮格走棋；放墙时先选择方向，再点交点预览，确认放置。电脑只使用公开棋盘进行寻路和拦截。'};
})();

var CardUI=(function(){
  var mode='move',axis='h',choice=null,revision='';
  function reset(){mode='move';axis='h';choice=null;revision='';}
  function render(root,v,own,api){
    var key=v.game+':'+v.ply;if(key!==revision){choice=null;mode='move';revision=key;}root.replaceChildren();root.className='qr-root';var el=api.el;
    function button(text,fn,disabled,cls){var b=el('button',text,cls||'aurai-button');b.type='button';b.disabled=disabled;b.onclick=fn;return b;}
    var info=el('div','','qr-info');v.players.forEach(function(p,i){var item=el('span',p.name+' · '+v.remaining[i]+' 面墙');item.dataset.side=i;info.append(item);});root.append(info);
    var board=el('div','','qr-board');board.setAttribute('aria-label','步步为营棋盘');
    for(var i=0;i<81;i++)(function(at){var seat=v.pawns.indexOf(at),allowed=api.canPlay&&mode==='move'&&own.moves.indexOf(at)>=0,b=button('',function(){api.act('move',{to:at});},!allowed,'qr-cell'+(allowed?' reachable':''));
      b.setAttribute('aria-label','第 '+(Math.floor(at/9)+1)+' 行，第 '+(at%9+1)+' 列'+(seat>=0?'，'+v.players[seat].name:''));
      if(seat>=0){var pawn=el('span','','qr-pawn side-'+seat);if(v.phase==='playing'&&v.turn===seat)pawn.classList.add('thinking');b.append(pawn);}board.append(b);
    })(i);
    function wall(w,preview){var node=el('span','','qr-wall '+w.axis+(preview?' preview':''));node.style.left=((w.x+1)/9*100)+'%';node.style.top=((w.y+1)/9*100)+'%';board.append(node);}
    v.walls.forEach(function(w){wall(w,false);});
    if(mode==='wall'&&api.canPlay){for(var y=0;y<8;y++)for(var x=0;x<8;x++)(function(x,y){var legal=own.walls.some(function(w){return w.x===x&&w.y===y&&w.axis===axis;}),b=button('',function(){choice={x:x,y:y,axis:axis};render(root,v,own,api);},!legal,'qr-anchor');b.style.left=((x+1)/9*100)+'%';b.style.top=((y+1)/9*100)+'%';b.setAttribute('aria-label','在第 '+(y+1)+' 行第 '+(x+1)+' 列后放'+(axis==='h'?'横墙':'竖墙'));board.append(b);})(x,y);}
    if(choice)wall(choice,true);root.append(el('div','你的终点','qr-goal'),board,el('div','电脑的终点','qr-goal'));
    if(v.phase==='finished'){root.append(el('strong',v.result,'qr-result'));return;}
    var actions=el('div','','qr-actions');
    if(own){actions.append(button('走棋',function(){mode='move';choice=null;render(root,v,own,api);},!api.canPlay,'aurai-button'+(mode==='move'?' aurai-button--primary':'')),button('放墙',function(){mode='wall';choice=null;render(root,v,own,api);},!api.canPlay||!v.remaining[own.seat],'aurai-button'+(mode==='wall'?' aurai-button--primary':'')));
      if(mode==='wall'){actions.append(button(axis==='h'?'横向 ↔':'纵向 ↕',function(){axis=axis==='h'?'v':'h';choice=null;render(root,v,own,api);},!api.canPlay),button('确认放墙',function(){api.act('wall',choice);},!api.canPlay||!choice));}root.append(actions);
    }
    root.append(el('p',!own?'正在观战':!api.canPlay?'等待电脑行动':mode==='move'?'点亮格前进，或选择放墙阻挡对手':'点交点预览围墙，再确认放置','aurai-muted qr-help'));
  }
  return {render:render,reset:reset};
})();

const $=id=>document.getElementById(id);
const el=(tag,value,cls)=>{const node=document.createElement(tag);node.textContent=value;if(cls)node.className=cls;return node;};
let s=AuraiHTML.messageState,busy=false,thinking=false,paused=false,generation=0,attempt='',timer=null;
let seatCount=s.players?s.players.length:Cards.seats;
const host=()=>s._miniapp;
const mine=()=>s.players?.find(p=>p.id===host()?.viewerId);
const aiTurn=()=>s.phase==='playing'&&(s.players[s.turn].kind==='engine'||s.engineCanJump===true);
const key=()=>`${s.game}:${s.ply}`;
function cancel(){generation++;clearTimeout(timer);timer=null;thinking=false;}
async function continueAi(){
  if(busy||thinking||paused||!mine()||!aiTurn())return;
  const run=++generation;attempt=key();thinking=true;render();
  try{
    const job=await AuraiHTML.boardGame('begin');
    if(run!==generation||job.skipped)return;
    await AuraiHTML.boardGame('complete',{token:job.token,version:job.version,action:'cardAi',data:{game:job.view.game,ply:job.view.ply}});
  }finally{if(run===generation){thinking=false;render();}}
}
async function act(action,data={}){
  if(busy)return;cancel();busy=true;render();
  try{
    await AuraiHTML.boardGame('event',{eventId:crypto.randomUUID(),action,data:action==='configure'?data:{game:s.game,ply:s.ply,...data},notifyAi:false});
    attempt='';
  }finally{busy=false;render();}
}
function showRemainingHands(root,v,card){
  const section=el('section','','card-remaining');section.append(el('strong','剩余手牌'));
  v.players.forEach((p,i)=>{
    const row=el('div','','card-revealed-hand'),cards=el('div','','card-revealed-cards');
    row.append(el('span',p.name+' · '+v.hands[i].length+' 张','aurai-muted'));
    v.hands[i].forEach(c=>cards.append(card(c,false)));
    if(!v.hands[i].length)cards.append(el('span','已出完','aurai-muted'));
    row.append(cards);section.append(row);
  });root.append(section);
}
function more(open){$('cardMorePanel').hidden=!open;$('cardMore').setAttribute('aria-expanded',String(open));$('cardLeaveConfirm').hidden=true;AuraiHTML.requestResize();}
function render(){
  s=AuraiHTML.messageState;
  const setup=!s.phase||s.phase==='setup',owner=host()?.viewerId==='user:local';
  $('cardSetup').hidden=!setup;$('cardMatch').hidden=setup;
  $('cardStatus').textContent=setup?'本地 AI':s.phase==='finished'?'本局结束':`第 ${s.game} 局`;
  $('cardRules').textContent=s.rules||Cards.rules;
  $('cardStart').disabled=busy||!owner;
  $('cardSetupHint').textContent=host()?owner?'无需联网，也不用配置模型':'等待玩家开始对局':'从小程序库打开即可开始';
  for(const [id,visible] of [['cardSeatOptions',setup],['cardRematchSeats',s.phase==='finished']]){
    const container=$(id);container.hidden=!Cards.seatOptions||!visible||!owner;
    if(!container.hidden){container.replaceChildren(el('span','对局人数','aurai-muted'),...Cards.seatOptions.map(count=>{
      const b=el('button',count+' 人','aurai-button'+(seatCount===count?' aurai-button--primary':''));b.type='button';b.disabled=busy;b.setAttribute('aria-pressed',String(seatCount===count));b.onclick=()=>{seatCount=count;render();};return b;
    }),el('small','你与 '+(seatCount-1)+' 位电脑游玩','aurai-muted'));}
  }
  if(!setup){
    $('cardPlayers').replaceChildren(...s.players.map((p,i)=>{
      const node=el('div','',`card-player${s.phase==='playing'&&s.turn===i?' active':''}`);
      node.append(el('span','','card-seat'),el('strong',p.name));
      if(s.counts)node.append(el('small',s.counts[i]+' 张'));
      node.setAttribute('aria-label',p.name+(s.phase==='playing'&&s.turn===i?'，正在行动':''));return node;
    }));
    if(s.abandoned){$('cardTable').replaceChildren(el('p','本局已结束，可重新开局。','aurai-muted'));}
    else CardUI.render($('cardTable'),s,host()?.own,{act,busy:busy||thinking,canJump:!busy&&!thinking&&!!mine(),canPlay:!busy&&!thinking&&!!mine()&&s.turn===mine().side,el});
    $('cardContinue').hidden=GAME==='doudizhu'||s.phase==='finished';$('cardContinue').disabled=busy||thinking||!mine()||!aiTurn();
    $('cardContinue').setAttribute('aria-busy',String(thinking));
    $('cardMore').hidden=GAME==='doudizhu';
    $('cardToolbar').hidden=GAME==='doudizhu'&&(s.phase!=='finished'||!mine());
    $('cardRematch').hidden=s.phase!=='finished'||!mine();$('cardRematch').disabled=busy;
    $('cardLeave').hidden=s.phase==='finished'||!mine();
    $('cardLog').replaceChildren(...(s.logs||[]).map(item=>el('li',(item.seat>=0?s.players[item.seat].name+' · ':'')+item.text)));
  }
  AuraiHTML.requestResize();
  if(!setup&&!busy&&!thinking&&!paused&&mine()&&aiTurn()&&attempt!==key()&&!timer){
    timer=setTimeout(()=>{timer=null;void continueAi();},s.engineCanJump===true||host()?.own?.jumpable?.length?3000:650);
  }
}
$('cardStart').onclick=()=>act('configure',Cards.seatOptions?{seats:seatCount}:{});
$('cardRematch').onclick=()=>{CardUI.reset();more(false);void act('rematch',Cards.seatOptions?{seats:seatCount}:{});};
$('cardContinue').onclick=()=>{clearTimeout(timer);timer=null;void continueAi();};
$('cardMore').onclick=()=>more($('cardMorePanel').hidden);$('cardCloseMore').onclick=()=>more(false);
$('cardLeave').onclick=()=>{$('cardLeaveConfirm').hidden=false;};
$('cardCancelLeave').onclick=()=>{$('cardLeaveConfirm').hidden=true;};
$('cardConfirmLeave').onclick=()=>{more(false);void act('leave');};
document.addEventListener('keydown',e=>{if(e.key==='Escape')more(false);});
document.addEventListener('aurai:pause',()=>{paused=true;cancel();});
document.addEventListener('aurai:resume',()=>{paused=false;attempt='';render();});
document.addEventListener('aurai:restore',render);
document.addEventListener('aurai:messageupdate',()=>{const next=AuraiHTML.messageState;if(next.game!==s.game||next.ply!==s.ply)cancel();render();});
document.addEventListener('aurai:displaychange',render);
render();

})();</script>
