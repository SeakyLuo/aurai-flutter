<!-- Generated by scripts/build_board_games.py; edit miniapps/board-games modules. -->
<script type="application/json" id="aurai-send-action">{"type":"program","initialView":{"gameType":"{{GAME}}","title":"{{TITLE}}","setupProtocol":"用户已要求下棋时，由发起本消息的 AI 调用 submitHtmlProgramEvent 开局，无需用户打开页面配置。action:configure，data:{humanId:玩家成员ID,aiId:AI成员ID,humanFirst:boolean}，expectedVersion 使用本次状态版本，eventId 使用新的唯一编号。成员从 state._miniapp.members 选择；私聊/任务中 humanId 为唯一人类、aiId 为你自己的 state._miniapp.viewerId。群聊选择用户指定的玩家和 AI；不明确时询问，不代其他成员同意。humanFirst 按用户指定，未指定时默认用户先手。仅 state._miniapp.ownerId 或本地用户可配置，phase 不为 setup 时不要再次配置。提交成功后用 readHtmlProgram 读取最新棋盘及 state._miniapp.own.protocol；轮到 AI 时只走一步，轮到用户时结束当前执行，等待落子回调，不轮询、不重复建任务或发送新棋盘。用户未要求开局时只展示棋盘，不自动配置。"}}</script>
<script type="application/json" id="aurai-capabilities">{{CAPABILITIES}}</script>
<script type="application/aurai-program">
var GAME='{{GAME}}',TITLE='{{TITLE}}';
{{ENGINE}}
{{PROGRAM}}
</script>
<main id="game" class="aurai-ui aurai-stack">
  <header><h1>{{TITLE}}</h1><span id="status" class="aurai-muted"></span></header>
  <section id="welcome" class="aurai-stack" hidden><p class="aurai-muted">在私聊或群聊中发送，邀请 AI 一起下棋。</p></section>
  <form id="setup" class="aurai-stack" hidden>
    <p class="aurai-muted" id="setupHint"></p>
    <label class="aurai-field">玩家<select id="human"></select></label>
    <label class="aurai-field">AI 对手<select id="ai"></select></label>
    <label class="aurai-field">先手<select id="first"><option value="human">玩家先手</option><option value="ai">AI 先手</option></select></label>
    <button class="aurai-button aurai-button--primary" id="start" type="submit">开始对局</button>
  </form>
  <section id="match" class="aurai-stack" hidden>
    <div id="players" class="players"></div>
    <div class="board-wrap"><svg id="board" role="img" aria-label="{{TITLE}}棋盘"></svg></div>
    <p id="turn" class="turn" aria-live="polite"></p>
    <div class="fullscreen-only aurai-stack">
      <p id="instruction" class="aurai-muted" aria-live="polite"></p>
      <div id="drawActions" class="aurai-row" hidden>
        <button id="acceptDraw" type="button" class="aurai-button">接受和棋</button>
        <button id="declineDraw" type="button" class="aurai-button">继续对局</button>
      </div>
      <div id="morePanel" class="aurai-stack" hidden>
        <div class="aurai-row more-heading"><strong>更多</strong><button id="closeMore" type="button" class="aurai-button">收起</button></div>
        <details><summary>最近棋谱</summary><ol id="history"></ol><p id="emptyHistory" class="aurai-muted">尚未落子</p></details>
        <details><summary>规则</summary><p id="rules" class="aurai-muted"></p></details>
        <button id="rematch" type="button" class="aurai-button aurai-button--primary" hidden>再来一局 · 交换先手</button>
        <div id="gameActions" class="aurai-row">
          <button id="offerDraw" type="button" class="aurai-button">提议和棋</button>
          <button id="resign" type="button" class="aurai-button">认输</button>
        </div>
      <div id="resignActions" class="aurai-row" hidden>
        <span class="aurai-muted">确认认输，结束本局？</span>
        <button id="confirmResign" type="button" class="aurai-button aurai-button--danger">确认认输</button>
        <button id="cancelResign" type="button" class="aurai-button">继续下棋</button>
      </div>
      </div>
      <nav id="gameToolbar" class="aurai-row" aria-label="对局操作">
        <button id="undo" type="button" class="aurai-button">悔棋</button>
        <button id="askAi" type="button" class="aurai-button">继续</button>
        <button id="more" type="button" class="aurai-button" aria-expanded="false" aria-controls="morePanel">更多</button>
      </nav>
    </div>
  </section>
</main>
<style>
{{STYLE}}
</style>
<script>
(()=>{
const GAME='{{GAME}}',TITLE='{{TITLE}}';
{{ENGINE}}
{{BOARD}}
{{UI}}
})();
</script>
