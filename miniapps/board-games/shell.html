<!-- Generated by scripts/build_board_games.py; edit miniapps/board-games modules. -->
<script type="application/json" id="aurai-send-action">{"type":"program","initialView":{"gameType":"{{GAME}}","title":"{{TITLE}}","setupProtocol":"用户已要求下棋时，由发起本消息的 AI 调用 submitHtmlProgramEvent 开局，无需用户打开页面配置。action:configure，data:{humanId:玩家成员ID,aiId:AI成员ID,humanFirst:boolean}，expectedVersion 使用本次状态版本，eventId 使用新的唯一编号。成员从 state._miniapp.members 选择；私聊/任务中 humanId 为唯一人类、aiId 为你自己的 state._miniapp.viewerId。群聊选择用户指定的玩家和 AI；不明确时询问，不代其他成员同意。humanFirst 按用户指定，未指定时默认用户先手。四子棋、五子棋、井字棋和黑白棋的颜色或符号由程序随机分配，后续下一局保持颜色、轮换先手；以 view.firstSide 为本局先手颜色，不要假设黑棋、珊瑚棋或 X 总是先手。仅 state._miniapp.ownerId 或本地用户可配置，phase 不为 setup 时不要再次配置。提交成功后用 readHtmlProgram 读取最新棋盘及 state._miniapp.own.protocol；轮到 AI 时只走一步，轮到用户时结束当前执行，等待落子回调，不轮询、不重复建任务或发送新棋盘。用户要求观看双方 AI 对弈时，象棋和五子棋可传 watching:true，humanId 和 aiId 分别为双方角色，必须不同；观看时由程序轮流唤醒当前执棋角色。用户未要求开局时只展示棋盘，不自动配置。"}}</script>
<script type="application/json" id="aurai-capabilities">{{CAPABILITIES}}</script>
<script type="application/aurai-program">
var GAME='{{GAME}}',TITLE='{{TITLE}}';
{{ENGINE}}
{{PROGRAM}}
</script>
<main id="game" class="aurai-ui aurai-stack">
  <header><button id="menu" class="aurai-button fullscreen-only" type="button" aria-label="对局菜单" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button><h1>{{TITLE}}</h1></header>
  <section id="welcome" class="aurai-stack" hidden><p class="aurai-muted">在私聊或群聊中发送，邀请 AI 一起下棋。</p></section>
  <form id="setup" class="aurai-stack" hidden>
    <p class="aurai-muted" id="setupHint"></p>
    <label class="aurai-field" id="matchTypeField" hidden>对局<select id="matchType"><option value="play">我来下棋</option><option value="watch">观看对弈</option></select></label>
    <label class="aurai-field" id="modeField" hidden>玩法<select id="mode"><option value="normal">普通象棋</option><option value="jieqi">揭棋</option><option value="banqi">暗棋</option></select></label>
    <label class="aurai-field"><span id="humanLabel">玩家</span><select id="human"></select></label>
    <label class="aurai-field"><span id="aiLabel">对手</span><select id="ai"></select></label>
    <label class="aurai-field" id="difficultyField">难度<select id="difficulty"><option value="1">入门</option><option value="2">简单</option><option value="3" selected>普通</option><option value="4">困难</option><option value="5">专家</option></select></label>
    <label class="aurai-field">先手<select id="first"><option value="human">玩家先手</option><option value="ai">对手先手</option></select></label>
    <button class="aurai-button aurai-button--primary" id="start" type="submit">开始对局</button>
  </form>
  <section id="match" class="aurai-stack" hidden>
    <div id="players" class="players"></div>
    <div class="board-wrap"><svg id="board" role="img" aria-label="{{TITLE}}棋盘"></svg></div>
    <p id="turn" class="turn" aria-live="polite"></p>
    <div class="fullscreen-only aurai-stack">
      <p id="instruction" class="aurai-muted" aria-live="polite"></p>
      <p id="recommendation" class="aurai-muted" aria-live="polite" hidden></p>
      <nav id="gameToolbar" class="aurai-row" aria-label="对局操作">
        <button id="undo" type="button" class="aurai-button">悔棋</button>
        <button id="watchPause" type="button" class="aurai-button" hidden>暂停</button>
        <button id="recommend" type="button" class="aurai-button" hidden>推荐下法</button>
        <button id="rematch" type="button" class="aurai-button aurai-button--primary" title="交换先手开始下一局" hidden>下一局</button>
        <button id="resign" type="button" class="aurai-button">认输</button>
      </nav>
    </div>
  </section>
  <dialog id="gameDialog" aria-labelledby="dialogTitle">
    <div class="aurai-stack">
      <h2 id="dialogTitle" class="aurai-title"></h2>
      <section id="dialogMenu" class="aurai-stack" hidden>
        <p id="status" class="aurai-muted"></p>
        <button id="askAi" type="button" class="aurai-button">继续</button>
        <button id="menuRules" type="button" class="aurai-button">规则</button>
        <button id="menuDifficulty" type="button" class="aurai-button">难度</button>
        <button id="offerDraw" type="button" class="aurai-button">和棋</button>
        <button id="menuRestart" type="button" class="aurai-button">重来</button>
      </section>
      <section id="dialogRules" class="aurai-stack" hidden><p id="rules" class="aurai-muted"></p><details><summary>最近棋谱</summary><ol id="history"></ol><p id="emptyHistory" class="aurai-muted">尚未落子</p></details></section>
      <section id="dialogDifficulty" hidden><label class="aurai-field" id="matchDifficultyField">难度<select id="matchDifficulty"><option value="1">入门</option><option value="2">简单</option><option value="3">普通</option><option value="4">困难</option><option value="5">专家</option></select></label></section>
      <section id="dialogRestart" class="aurai-stack" hidden><p id="restartText" class="aurai-muted"></p><label class="aurai-field" id="nextModeField" hidden>玩法<select id="nextMode"><option value="normal">普通象棋</option><option value="jieqi">揭棋</option><option value="banqi">暗棋</option></select></label></section>
      <p id="dialogQuestion" class="aurai-muted" hidden></p>
      <div class="aurai-actions"><button id="dialogCancel" type="button" class="aurai-button">取消</button><button id="dialogConfirm" type="button" class="aurai-button aurai-button--primary" hidden>确定</button></div>
    </div>
  </dialog>
</main>
