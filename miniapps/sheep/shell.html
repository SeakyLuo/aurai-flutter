<!-- Generated by scripts/build_sheep.py; edit miniapps/sheep. -->
<script type="application/json" id="aurai-send-action">{"type":"message","state":{"title":"羊了个羊","localOnly":true}}</script>
<main id="sheepGame" class="aurai-ui aurai-stack">
  <header class="sheep-header"><div class="sheep-brand"><img src="{{LOGO}}" alt=""><div><h1>羊了个羊</h1><p>把小小烦恼，三张消掉</p></div></div><span id="levelName" class="level-badge"></span></header>
  <section id="welcome" class="welcome">
    <div class="welcome-art" aria-hidden="true"><span>🍀</span><span>🐑</span><span>🥕</span></div>
    <h2>今天也要轻松过关</h2><p>叠牌三消 · 每局都有通关解法</p>
    <div id="levels" class="levels" role="group" aria-label="选择难度"></div>
    <button id="start" class="aurai-button aurai-button--primary" type="button">进入牧场</button>
    <p class="welcome-note">点亮牌面，凑齐三张。七格放满前，清空牧场。</p>
  </section>
  <section id="match" hidden>
    <div class="progress-heading"><span id="progressLabel"></span><span id="moveLabel"></span></div>
    <div class="progress-track"><div id="progress"></div></div>
    <div id="meadow" class="meadow"><div class="grass grass-one"></div><div class="grass grass-two"></div><div id="board" class="sheep-board" role="group" aria-label="叠牌牧场"></div></div>
    <div class="tray-heading"><strong>收集槽</strong><span id="trayLabel"></span></div>
    <div id="tray" class="sheep-tray" role="group" aria-label="七格收集槽"></div>
    <p id="instruction" class="instruction" aria-live="polite"></p>
    <section id="result" class="result" hidden aria-live="polite"><span id="resultSymbol"></span><h2 id="resultTitle"></h2><p id="resultText"></p><button id="next" type="button" class="aurai-button aurai-button--primary">再来一关</button></section>
    <nav class="sheep-tools" aria-label="游戏操作">
      <button id="undo" type="button">{{UNDO}}<span>撤回</span></button><button id="hint" type="button">{{HINT}}<span>提示</span></button><button id="retry" type="button">{{RETRY}}<span>重来</span></button><button id="new" type="button">{{NEW}}<span>换关</span></button>
    </nav>
    <section id="confirm" class="confirm" hidden><p id="confirmText"></p><div class="aurai-row"><button id="confirmNo" type="button" class="aurai-button">继续玩</button><button id="confirmYes" type="button" class="aurai-button aurai-button--primary">确定</button></div></section>
  </section>
  <details class="sheep-rules"><summary>玩法</summary><p>只能选择没有被上层遮住的牌。相同图案的三张牌会自动消除；消除后仍占满七格则本次挑战结束。每关发牌时都保证至少有一条通关路径，但自由选择的顺序仍可能堵住收集槽。撤回不限次数；重来保留同一关，换关会生成新的牌面。提示会寻找当前局面的通关走法。</p></details>
</main>
<style>{{STYLE}}</style>
<script id="sheepHintSource" type="application/json">{{WORKER}}</script>
<script>(()=>{ {{ENGINE}}
{{UI}}
})();</script>
