<!-- Generated by scripts/build_card_games.py; edit miniapps/card-games modules. -->
<script type="application/json" id="aurai-send-action">{"type":"program","initialView":{"gameType":"{{GAME}}","title":"{{TITLE}}","phase":"setup","setupProtocol":"这是与本地系统 AI 游玩的对局小程序。玩家直接打开后开始，其他成员只观战。不要代替电脑行动，也不要读取其他玩家的隐藏信息。"}}</script>
<script type="application/json" id="aurai-capabilities">["messages.send"]</script>
<script type="application/aurai-program">
var GAME='{{GAME}}',TITLE='{{TITLE}}';
{{RULES}}
{{PROGRAM}}
</script>
<main id="cardGame" class="aurai-ui aurai-stack {{GAME}}">
  <header class="card-heading"><h1>{{TITLE}}</h1><span id="cardStatus" class="aurai-muted"></span></header>
  <section id="cardSetup" class="aurai-stack">
    <div class="card-cover" aria-hidden="true">{{COVER}}</div>
    <h2>{{SUBTITLE}}</h2><p class="aurai-muted">{{DESCRIPTION}}</p>
    <div id="cardSeatOptions" class="card-seat-options" hidden></div>
    <button id="cardStart" type="button" class="aurai-button aurai-button--primary">与电脑开局</button>
    <p id="cardSetupHint" class="aurai-muted"></p>
  </section>
  <section id="cardMatch" class="aurai-stack" hidden>
    <div id="cardPlayers" class="card-players"></div>
    <div id="cardTable"></div>
    <div id="cardRematchSeats" class="card-seat-options" hidden></div>
    <nav id="cardToolbar" class="aurai-row" aria-label="对局操作">
      <button id="cardContinue" type="button" class="aurai-button">继续</button>
      <button id="cardRematch" type="button" class="aurai-button aurai-button--primary" hidden>下一局</button>
      <button id="cardMore" type="button" class="aurai-button" aria-expanded="false">更多</button>
    </nav>
  </section>
  <section id="cardMorePanel" class="aurai-stack" hidden>
    <div class="aurai-row"><strong>对局</strong><button id="cardCloseMore" type="button" class="aurai-button">收起</button></div>
    <details><summary>玩法规则</summary><p id="cardRules"></p></details>
    <details><summary>最近记录</summary><ol id="cardLog"></ol></details>
    <button id="cardLeave" type="button" class="aurai-button">结束本局</button>
    <div id="cardLeaveConfirm" class="aurai-stack" hidden><p>结束当前对局？本局不计胜负。</p><div class="aurai-row"><button id="cardConfirmLeave" class="aurai-button aurai-button--danger" type="button">结束本局</button><button id="cardCancelLeave" class="aurai-button" type="button">继续玩</button></div></div>
  </section>
</main>
<style>{{STYLE}}
{{GAME_STYLE}}</style>
<script>(()=>{
const GAME='{{GAME}}',TITLE='{{TITLE}}';
{{RULES}}
{{GAME_UI}}
{{UI}}
})();</script>
